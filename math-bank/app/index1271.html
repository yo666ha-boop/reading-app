<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>みかみ塾 数学問題プリント作成アプリ</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#111;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #dfe3e7;border-radius:14px;padding:16px;margin:0 0 14px}h1{font-size:22px;margin:0 0 6px}.sub,.status{font-size:13px;color:#59636e;line-height:1.5}.gate.pass{color:#166534;font-weight:800}.gate.fail{color:#b42318;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:4px}select,input,button{width:100%;padding:9px;border:1px solid #b9c0c7;border-radius:9px;background:#fff;font:inherit}.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin-top:10px}button{font-weight:700;cursor:pointer}button:disabled{opacity:.45}.summary{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.pill{font-size:12px;background:#eef3f9;padding:4px 8px;border-radius:999px}.problem{padding:12px 0;border-bottom:1px solid #e5e7eb;break-inside:avoid}.meta{font-size:11px;color:#66727e}.title{font-weight:800;margin:5px 0}.q,.answer{white-space:pre-wrap;line-height:1.7}.choices{line-height:1.65}.figures{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.figures img,.inline-img{max-width:min(100%,520px);max-height:360px;object-fit:contain;border:1px solid #ddd;border-radius:8px}.answer{display:none;background:#f7f8fa;padding:8px;border-radius:8px;margin-top:8px}.answer.open,.show-answers .answer{display:block}.answer-btn{width:auto;margin-top:8px}.identity{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.identity div{border-bottom:1px solid #222;min-height:26px}.paper-head{display:flex;justify-content:space-between;border-bottom:2px solid #222;padding-bottom:7px}.empty{text-align:center;padding:25px;color:#66727e}@page{size:A4;margin:12mm}@media print{body{background:#fff}.wrap{max-width:none;padding:0}.controls,.top,.answer-btn{display:none!important}.panel{border:0;padding:0;margin:0}.problem{page-break-inside:avoid}.answer{display:none!important}.print-answers .answer{display:block!important;background:none;border-top:1px dashed #777}.figures img,.inline-img{max-height:250px}}
</style></head><body><div class="wrap"><div class="panel top"><h1>みかみ塾 数学問題プリント作成アプリ</h1><div class="sub">検証済み原問題1271問（Winpass717・実力錬成237・Standard317）を固定土台にします。類題は独立再計算済みだけを別工程で追加します。</div><div id="status" class="status">読込中…</div><div id="gate" class="gate fail">正本ゲート確認中</div></div>
<div class="panel controls"><div class="grid"><div class="field"><label>学年</label><select id="grade"><option value="">すべて</option><option value="1">中1</option><option value="2">中2</option><option value="3">中3</option></select></div><div class="field"><label>ジャンル</label><select id="major"><option value="">すべて</option></select></div><div class="field"><label>単元</label><select id="minor"><option value="">すべて</option></select></div><div class="field"><label>技能</label><select id="skill"><option value="">すべて</option></select></div><div class="field"><label>難易度</label><select id="difficulty"><option value="">すべて</option></select></div><div class="field"><label>形式</label><select id="qformat"><option value="">すべて</option></select></div><div class="field"><label>教材</label><select id="book"><option value="">すべて</option></select></div><div class="field"><label>問題数</label><input id="count" type="number" min="1" max="200" value="10"></div><div class="field"><label>並び順</label><select id="order"><option value="random">ランダム</option><option value="source">教材順</option></select></div><div class="field"><label>検索</label><input id="search" type="search" placeholder="ID・問題文・解答・単元"></div></div><div class="actions"><button id="draw">問題を出す</button><button id="redraw">同条件で再抽選</button><button id="toggle">画面の解答を表示</button><button id="printQ">問題をA4印刷</button><button id="printA">解答をA4印刷</button></div><div id="summary" class="summary"></div></div>
<div class="panel" id="paper"><div class="paper-head"><b>数学 問題プリント</b><span id="printCount"></span></div><div class="identity"><div>名前：</div><div>日付：</div><div>点数：　　/　　点</div></div><div id="condition" class="sub"></div><div id="list"><div class="empty">データを読み込むと問題が表示されます。</div></div></div></div>
<script>
const DATA_URL='./app-records.json',EXPECTED={total:1271,source:{Winpass:717,'実力錬成':237,Standard:317}},SETTINGS_KEY='mikami-math-1271-settings-v1';let records=[],current=[];const $=id=>document.getElementById(id),IDS=['grade','major','minor','skill','difficulty','qformat','book','count','order','search'];const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const uniq=a=>[...new Set(a.filter(x=>x!==null&&x!==undefined&&String(x).trim()))].sort((a,b)=>String(a).localeCompare(String(b),'ja',{numeric:true}));
function safePath(s){return typeof s==='string'&&/^assets\/math\/[A-Za-z0-9_\/-]+\.(png|jpe?g|webp|gif|svg)$/i.test(s)&&!s.includes('..')}function major(r){return r?.unit?.major||''}function minor(r){return r?.unit?.minor||''}function book(r){return r?.source?.book||''}
function audit(rs){let bad=0,figbad=0;const ids=new Set(),src={Winpass:0,'実力錬成':0,Standard:0};for(const r of rs){if(!r||typeof r!=='object'||!r.id||ids.has(r.id)){bad++;continue}ids.add(r.id);if(![1,2,3].includes(r.grade)||!r.question?.trim()||!r.answer?.trim()||r.source?.is_generated_variant!==false||!(book(r) in src)||!r.audit||r.audit.problem_answer_verified!==true||r.audit.structure_verified!==true||r.audit.figure_refs_verified!==true)bad++;else src[book(r)]++;if(!Array.isArray(r.figure_refs)||new Set(r.figure_refs).size!==r.figure_refs.length||r.figure_refs.some(x=>!safePath(x)))figbad++}const pass=rs.length===EXPECTED.total&&ids.size===EXPECTED.total&&bad===0&&figbad===0&&Object.entries(EXPECTED.source).every(([k,n])=>src[k]===n);return{pass,total:rs.length,ids:ids.size,bad,figbad,src}}
function setOpts(id,vals){const e=$(id),keep=e.value;e.innerHTML='<option value="">すべて</option>'+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');if([...e.options].some(o=>o.value===keep))e.value=keep}function refresh(){let a=records;if($('grade').value)a=a.filter(r=>String(r.grade)===$('grade').value);setOpts('major',uniq(a.map(major)));if($('major').value)a=a.filter(r=>major(r)===$('major').value);setOpts('minor',uniq(a.map(minor)));if($('minor').value)a=a.filter(r=>minor(r)===$('minor').value);setOpts('skill',uniq(a.map(r=>r.skill)));setOpts('difficulty',uniq(a.map(r=>r.difficulty)));setOpts('qformat',uniq(a.map(r=>r.question_format)));setOpts('book',uniq(records.map(book)));summary();save()}
function filtered(){const q=$('search').value.trim().toLowerCase();return records.filter(r=>(!$('grade').value||String(r.grade)===$('grade').value)&&(!$('major').value||major(r)===$('major').value)&&(!$('minor').value||minor(r)===$('minor').value)&&(!$('skill').value||r.skill===$('skill').value)&&(!$('difficulty').value||r.difficulty===$('difficulty').value)&&(!$('qformat').value||r.question_format===$('qformat').value)&&(!$('book').value||book(r)===$('book').value)&&(!q||[r.id,r.title,r.question,r.answer,r.explanation,major(r),minor(r),r.skill,book(r),...(r.choices||[])].join('\n').toLowerCase().includes(q)))}function sourceSort(a,b){return [a.grade,book(a),a.source.document,a.source.original_no,a.id].join('|').localeCompare([b.grade,book(b),b.source.document,b.source.original_no,b.id].join('|'),'ja',{numeric:true})}function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function select(){let a=filtered(),n=Math.max(1,Math.min(200,Number($('count').value)||10));$('count').value=n;a=$('order').value==='source'?[...a].sort(sourceSort):shuffle(a);return a.slice(0,n)}
function textWithMarkers(text,refs,used){let html=esc(text);html=html.replace(/\[\[IMAGE:([^\]]+)\]\]/g,(m,p)=>{p=p.trim();if(!refs.includes(p)||!safePath(p))return '<b>[図版参照エラー]</b>';used.add(p);return `<img class="inline-img" data-figure="${esc(p)}" src="${esc(p)}" loading="eager">`});return html}function render(rows){current=rows;document.body.classList.remove('show-answers','print-answers');$('toggle').textContent='画面の解答を表示';if(!rows.length){$('list').innerHTML='<div class="empty">条件に合う問題がありません。</div>';return}$('list').innerHTML=rows.map((r,i)=>{const used=new Set(),q=textWithMarkers(r.question,r.figure_refs,used),ans=textWithMarkers(r.answer,r.figure_refs,used),figs=r.figure_refs.filter(x=>!used.has(x)).map(x=>`<img data-figure="${esc(x)}" src="${esc(x)}" loading="eager">`).join('');return `<div class="problem"><div class="meta">${i+1}. ${esc(r.id)} / 中${r.grade} / ${esc(major(r))} › ${esc(minor(r))} / ${esc(book(r))}</div><div class="title">${esc(r.title)}</div><div class="q">${q}</div>${Array.isArray(r.choices)&&r.choices.length?'<ol class="choices">'+r.choices.map(x=>`<li>${esc(x)}</li>`).join('')+'</ol>':''}${figs?`<div class="figures">${figs}</div>`:''}<button class="answer-btn" data-i="${i}">解答を表示</button><div class="answer" id="ans${i}"><b>解答：</b>${ans}${r.explanation?'\n\n<b>解説：</b>'+esc(r.explanation):''}</div></div>`}).join('');document.querySelectorAll('.answer-btn').forEach(b=>b.onclick=()=>{const a=$('ans'+b.dataset.i),on=a.classList.toggle('open');b.textContent=on?'解答を隠す':'解答を表示'});$('printCount').textContent=`${rows.length}問`;condition()}
function condition(){const x=[];for(const id of ['grade','major','minor','skill','difficulty','qformat','book'])if($(id).value)x.push(id==='grade'?'中'+$(id).value:$(id).value);if($('search').value)x.push('検索:'+$('search').value);$('condition').textContent=x.join(' / ')||'全範囲'}function summary(){const f=filtered();$('summary').innerHTML=[`候補 ${f.length}問`,`Winpass ${f.filter(r=>book(r)==='Winpass').length}`,`実力錬成 ${f.filter(r=>book(r)==='実力錬成').length}`,`Standard ${f.filter(r=>book(r)==='Standard').length}`].map(x=>`<span class="pill">${esc(x)}</span>`).join('');condition()}function save(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(Object.fromEntries(IDS.map(id=>[id,$(id).value]))))}catch{}}function restore(){let s={};try{s=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}catch{};for(const id of IDS)if(s[id]!=null)$(id).value=String(s[id]);refresh()}
function printMode(ans){const imgs=[...document.querySelectorAll('#list img')];if(imgs.some(i=>i.complete&&i.naturalWidth===0)||imgs.some(i=>!i.complete)){alert('図版の読み込み完了後に印刷してください。');return}document.body.classList.toggle('print-answers',ans);document.querySelector('.paper-head b').textContent=ans?'数学 解答プリント':'数学 問題プリント';setTimeout(()=>window.print(),0)}$('draw').onclick=()=>render(select());$('redraw').onclick=()=>render(select());$('toggle').onclick=()=>{const on=document.body.classList.toggle('show-answers');$('toggle').textContent=on?'画面の解答を隠す':'画面の解答を表示'};$('printQ').onclick=()=>printMode(false);$('printA').onclick=()=>printMode(true);IDS.forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{refresh();save()}));
fetch(DATA_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(rs=>{const a=audit(rs);$('status').textContent=`読込 ${a.total} / ID ${a.ids} / Winpass ${a.src.Winpass} / 実力錬成 ${a.src['実力錬成']} / Standard ${a.src.Standard} / 構造 ${a.bad} / 図版 ${a.figbad}`;$('gate').className='gate '+(a.pass?'pass':'fail');$('gate').textContent=a.pass?'1271正本ゲート PASS':'1271正本ゲート FAIL';for(const id of ['draw','redraw','toggle','printQ','printA'])$(id).disabled=!a.pass;if(a.pass){records=rs;restore();render(select())}}).catch(e=>{$('status').textContent='読込失敗: '+e;$('gate').textContent='1271正本ゲート FAIL'});
</script></body></html>
