<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>みかみ塾 数学問題アプリ</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f6f6f6}body{margin:0}.wrap{max-width:980px;margin:auto;padding:20px}.panel{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin-bottom:16px}h1{font-size:24px;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}label{font-size:13px;font-weight:700;display:block;margin-bottom:4px}select,input,button{font:inherit;padding:10px;border:1px solid #bbb;border-radius:10px;background:#fff}button{cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap}.problem{padding:14px 0;border-bottom:1px solid #eee}.meta{font-size:12px;color:#555;margin-bottom:6px}.q{white-space:pre-wrap;font-size:17px;line-height:1.7}.answer{display:none;margin-top:10px;padding:10px;background:#f7f7f7;border-radius:10px;white-space:pre-wrap}.answer.open{display:block}.status{font-size:13px;color:#555}.empty{padding:24px;text-align:center;color:#666}@media print{.controls,.status,.answer-toggle{display:none!important}.wrap{max-width:none;padding:0}.panel{border:0}.problem{break-inside:avoid}.answer{display:none!important}}
</style>
</head>
<body><div class="wrap">
<div class="panel"><h1>みかみ塾 数学問題アプリ</h1><div id="status" class="status">データを読み込み中…</div></div>
<div class="panel controls">
<div class="grid">
<div><label>学年</label><select id="grade"><option value="">すべて</option><option value="1">中1</option><option value="2">中2</option><option value="3">中3</option></select></div>
<div><label>単元</label><select id="unit"><option value="">すべて</option></select></div>
<div><label>難易度</label><select id="difficulty"><option value="">すべて</option></select></div>
<div><label>問題数</label><input id="count" type="number" min="1" max="100" value="10"></div>
</div>
<div class="actions" style="margin-top:12px"><button id="draw">問題を出す</button><button id="showAll">解答を表示</button><button id="print">印刷</button></div>
</div>
<div class="panel" id="list"><div class="empty">実データ確認後に問題を表示します。</div></div>
</div>
<script>
const DATA_URL='./app-records.json';
let records=[];
const $=id=>document.getElementById(id);
function uniq(xs){return [...new Set(xs.filter(v=>v!==null&&v!==undefined&&String(v).trim()!==''))].sort((a,b)=>String(a).localeCompare(String(b),'ja',{numeric:true}))}
function opt(el,vals){const keep=el.value;el.innerHTML='<option value="">すべて</option>'+vals.map(v=>`<option>${String(v).replaceAll('&','&amp;').replaceAll('<','&lt;')}</option>`).join('');if(vals.map(String).includes(keep))el.value=keep}
function gradeOf(r){return String(r.grade??r.school_grade??'').replace(/[^123]/g,'')}
function unitOf(r){return r.unit_name??r.unit??r.subunit_name??r.subunit??''}
function difficultyOf(r){return r.difficulty??''}
function refreshFilters(){const g=$('grade').value;const base=g?records.filter(r=>gradeOf(r)===g):records;opt($('unit'),uniq(base.map(unitOf)));opt($('difficulty'),uniq(base.map(difficultyOf)))}
function filtered(){const g=$('grade').value,u=$('unit').value,d=$('difficulty').value;return records.filter(r=>(!g||gradeOf(r)===g)&&(!u||String(unitOf(r))===u)&&(!d||String(difficultyOf(r))===d))}
function sample(a,n){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x.slice(0,n)}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function render(rows){if(!rows.length){$('list').innerHTML='<div class="empty">条件に合う問題がありません。</div>';return}
$('list').innerHTML=rows.map((r,i)=>`<div class="problem"><div class="meta">${i+1}. 中${esc(gradeOf(r))} / ${esc(unitOf(r))}${difficultyOf(r)?' / '+esc(difficultyOf(r)):''}${r.source?' / '+esc(r.source):''}</div><div class="q">${esc(r.question??r.problem??r.question_text)}</div><button class="answer-toggle" data-i="${i}" style="margin-top:10px">解答</button><div class="answer" id="a${i}">${esc(r.answer??r.correct_answer??r.answer_text)}${r.explanation?'\n\n解説：'+esc(r.explanation):''}</div></div>`).join('');
document.querySelectorAll('.answer-toggle').forEach(b=>b.onclick=()=>document.getElementById('a'+b.dataset.i).classList.toggle('open'))}
$('grade').onchange=refreshFilters;
$('draw').onclick=()=>{const f=filtered();const n=Math.max(1,Math.min(100,Number($('count').value)||10));render(sample(f,n))};
$('showAll').onclick=()=>document.querySelectorAll('.answer').forEach(x=>x.classList.add('open'));
$('print').onclick=()=>window.print();
fetch(DATA_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('app-records.json not available');return r.json()}).then(d=>{records=Array.isArray(d)?d:(d.records||[]);$('status').textContent=`読込済み：${records.length}問`;refreshFilters()}).catch(e=>{$('status').textContent='実データ未投入：最終問題バンクの再検証後に接続します。';console.warn(e)});
</script></body></html>
