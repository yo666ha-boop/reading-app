<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>みかみ塾 数学問題プリント作成アプリ</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f3f5f7;--line:#dfe3e7;--muted:#5f6b76;--accent:#1f5fae}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}h1{font-size:24px;margin:0 0 6px}h2{font-size:18px;margin:0 0 10px}.sub,.status{font-size:13px;color:var(--muted);line-height:1.55}.status.good{color:#166534}.status.warn{color:#9a3412}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.field label{font-size:12px;font-weight:800;display:block;margin-bottom:4px}.field select,.field input,button{width:100%;font:inherit;padding:10px;border:1px solid #b9c0c7;border-radius:10px;background:#fff}.field input[type=checkbox]{width:auto}.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}button{cursor:pointer;font-weight:700}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button:disabled{cursor:not-allowed;opacity:.45}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pill{font-size:12px;padding:4px 8px;border-radius:999px;background:#eef3f9;color:#24435f}.paper{background:#fff}.paper-head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;border-bottom:2px solid #222;padding-bottom:8px;margin-bottom:10px}.paper-title{font-weight:900;font-size:20px}.identity{display:grid;grid-template-columns:repeat(3,minmax(100px,1fr));gap:8px;margin:10px 0 16px}.identity div{border-bottom:1px solid #222;min-height:28px;font-size:13px;padding:4px 2px}.problem{padding:12px 0;border-bottom:1px solid #e6e8eb;break-inside:avoid}.problem:last-child{border-bottom:0}.meta{font-size:11px;color:#66727e;margin-bottom:6px}.q{white-space:pre-wrap;font-size:16px;line-height:1.7}.figures{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.figures img{max-width:min(100%,520px);max-height:360px;object-fit:contain;border:1px solid #ddd;border-radius:8px;background:#fff}.answer{display:none;margin-top:10px;padding:10px;background:#f7f8fa;border-radius:9px;white-space:pre-wrap;line-height:1.65}.show-answers-screen .answer{display:block}.answer-toggle{width:auto;margin-top:8px}.empty{padding:26px;text-align:center;color:#68737e}.screen-only-note{font-size:12px;color:#68737e;margin-top:8px}.data-gate{font-weight:800}.data-gate.pass{color:#166534}.data-gate.fail{color:#b42318}@media(max-width:600px){.wrap{padding:10px}.panel{padding:12px;border-radius:12px}.identity{grid-template-columns:1fr}.paper-head{grid-template-columns:1fr}.q{font-size:15px}.actions{grid-template-columns:1fr 1fr}}
@page{size:A4;margin:12mm}
@media print{body{background:#fff}.wrap{max-width:none;padding:0}.controls,.top-status,.answer-toggle,.screen-only-note{display:none!important}.panel{border:0;border-radius:0;padding:0;margin:0}.paper{display:block!important}.problem{break-inside:avoid;page-break-inside:avoid}.answer{display:none!important}.print-answers .answer{display:block!important;background:transparent;border-top:1px dashed #777;border-radius:0;padding:8px 0 0}.print-answers .q{font-size:14px}.print-answers .problem{padding:8px 0}.figures img{max-height:250px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel top-status">
    <h1>みかみ塾 数学問題プリント作成アプリ</h1>
    <div class="sub">正本1231問専用。原問題1124問＋検算済み類題107問以外は追加しません。</div>
    <div id="status" class="status">データを読み込み中…</div>
    <div id="gate" class="data-gate fail">正本ゲート確認中</div>
  </div>

  <div class="panel controls">
    <h2>出題条件</h2>
    <div class="grid">
      <div class="field"><label>学年</label><select id="grade"><option value="">すべて</option><option value="1">中1</option><option value="2">中2</option><option value="3">中3</option></select></div>
      <div class="field"><label>ジャンル</label><select id="major"><option value="">すべて</option></select></div>
      <div class="field"><label>単元</label><select id="minor"><option value="">すべて</option></select></div>
      <div class="field"><label>技能</label><select id="skill"><option value="">すべて</option></select></div>
      <div class="field"><label>難易度</label><select id="difficulty"><option value="">すべて</option></select></div>
      <div class="field"><label>出題形式</label><select id="qformat"><option value="">すべて</option></select></div>
      <div class="field"><label>原問題 / 類題</label><select id="kind"><option value="both">両方</option><option value="original">原問題のみ</option><option value="variant">既存類題のみ</option></select></div>
      <div class="field"><label>教材</label><select id="book"><option value="">すべて</option></select></div>
      <div class="field"><label>問題数</label><input id="count" type="number" min="1" max="100" value="10"></div>
      <div class="field"><label>並び順</label><select id="order"><option value="random">ランダム</option><option value="source">教材順</option></select></div>
    </div>
    <div class="actions">
      <button id="draw" class="primary">問題を出す</button>
      <button id="redraw">同条件で再抽選</button>
      <button id="toggleAnswers">画面の解答を表示</button>
      <button id="printQuestions">問題をA4印刷</button>
      <button id="printAnswers">解答をA4印刷</button>
    </div>
    <div id="summary" class="summary"></div>
    <div class="screen-only-note">条件はこの端末に自動保存されます。印刷時は操作UIを非表示にします。</div>
  </div>

  <div class="panel paper" id="paper">
    <div class="paper-head"><div><div class="paper-title">数学 問題プリント</div><div id="conditionLine" class="sub"></div></div><div id="printCount" class="sub"></div></div>
    <div class="identity"><div>名前：</div><div>日付：</div><div>点数：　　　/　　　点</div></div>
    <div id="list"><div class="empty">正本データを読み込むと、ここに問題が表示されます。</div></div>
  </div>
</div>
<script>
const DATA_URL='./app-records.json';
const CANONICAL={total:1231,original:1124,variant:107,source:{Winpass:570,'実力錬成':237,Standard:317}};
let records=[], currentRows=[];
const $=id=>document.getElementById(id);
const IDS=['grade','major','minor','skill','difficulty','qformat','kind','book','count','order'];
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function uniq(xs){return [...new Set(xs.filter(v=>v!==null&&v!==undefined&&String(v).trim()!==''))].sort((a,b)=>String(a).localeCompare(String(b),'ja',{numeric:true}))}
function setOptions(el,vals){const keep=el.value;el.innerHTML='<option value="">すべて</option>'+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');if(vals.map(String).includes(keep))el.value=keep}
function isVariant(r){return !!r?.source?.is_generated_variant}
function majorOf(r){return r?.unit?.major??''}
function minorOf(r){return r?.unit?.minor??''}
function sourceBook(r){return r?.source?.book??''}
function labelDifficulty(v){return ({basic:'基礎',standard:'標準',advanced:'発展',unknown:'未分類'})[v]??v}
function saveSettings(){try{localStorage.setItem('mikami-math-app-settings-v2',JSON.stringify(Object.fromEntries(IDS.map(id=>[id,$(id).value]))))}catch{}}
function loadSettings(){try{const x=JSON.parse(localStorage.getItem('mikami-math-app-settings-v2')||'{}');IDS.forEach(id=>{if(x[id]!=null)$(id).value=x[id]})}catch{}}
function cascadeBase(stop){let a=records;const g=$('grade').value;if(g)a=a.filter(r=>String(r.grade)===g);if(stop==='grade')return a;const maj=$('major').value;if(maj)a=a.filter(r=>majorOf(r)===maj);if(stop==='major')return a;const min=$('minor').value;if(min)a=a.filter(r=>minorOf(r)===min);return a}
function refreshFilters(){setOptions($('major'),uniq(cascadeBase('grade').map(majorOf)));setOptions($('minor'),uniq(cascadeBase('major').map(minorOf)));const base=cascadeBase('minor');setOptions($('skill'),uniq(base.map(r=>r.skill)));setOptions($('difficulty'),uniq(base.map(r=>r.difficulty)));setOptions($('qformat'),uniq(base.map(r=>r.question_format)));setOptions($('book'),uniq(records.filter(r=>!isVariant(r)).map(sourceBook)));updateSummary();saveSettings()}
function filtered(){const g=$('grade').value,maj=$('major').value,min=$('minor').value,skill=$('skill').value,d=$('difficulty').value,qf=$('qformat').value,kind=$('kind').value,book=$('book').value;return records.filter(r=>(!g||String(r.grade)===g)&&(!maj||majorOf(r)===maj)&&(!min||minorOf(r)===min)&&(!skill||r.skill===skill)&&(!d||r.difficulty===d)&&(!qf||r.question_format===qf)&&(kind==='both'||(kind==='original'&&!isVariant(r))||(kind==='variant'&&isVariant(r)))&&(!book||(isVariant(r)?false:sourceBook(r)===book)))}
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function sourceSort(a,b){const ka=[a.grade,sourceBook(a),a.source?.document??'',a.source?.original_no??'',a.id].join('|');const kb=[b.grade,sourceBook(b),b.source?.document??'',b.source?.original_no??'',b.id].join('|');return ka.localeCompare(kb,'ja',{numeric:true})}
function selectRows(){let f=filtered();const n=Math.max(1,Math.min(100,Number($('count').value)||10));if($('order').value==='random')f=shuffle(f);else f=[...f].sort(sourceSort);return f.slice(0,n)}
function figuresHtml(r){return (r.figure_refs||[]).length?`<div class="figures">${r.figure_refs.map(ref=>`<img src="${esc(ref)}" alt="図版 ${esc(r.id)}" loading="lazy" onerror="this.dataset.loadError='1'">`).join('')}</div>`:''}
function render(rows){currentRows=rows;document.body.classList.remove('show-answers-screen');$('toggleAnswers').textContent='画面の解答を表示';if(!rows.length){$('list').innerHTML='<div class="empty">条件に合う問題がありません。</div>';$('printCount').textContent='0問';return}
$('list').innerHTML=rows.map((r,i)=>`<div class="problem" data-id="${esc(r.id)}"><div class="meta">${i+1}. ID ${esc(r.id)} / 中${esc(r.grade)} / ${esc(majorOf(r))} › ${esc(minorOf(r))} / ${esc(r.skill)} / ${esc(labelDifficulty(r.difficulty))} / ${esc(r.question_format)} / ${isVariant(r)?'既存類題':'原問題'}${!isVariant(r)?' / '+esc(sourceBook(r)):''}</div><div class="q">${esc(r.question)}</div>${figuresHtml(r)}<button class="answer-toggle" data-i="${i}">解答</button><div class="answer" id="a${i}"><strong>解答：</strong>${esc(r.answer)}${r.explanation?'\n\n<strong>解説：</strong>'+esc(r.explanation):''}</div></div>`).join('');
document.querySelectorAll('.answer-toggle').forEach(b=>b.onclick=()=>document.getElementById('a'+b.dataset.i).classList.toggle('open'));$('printCount').textContent=`${rows.length}問`;updateConditionLine()}
function updateConditionLine(){const parts=[];if($('grade').value)parts.push(`中${$('grade').value}`);for(const id of ['major','minor','skill','difficulty','qformat','kind','book']){const el=$(id);if(el.value&&el.value!=='both')parts.push(el.options[el.selectedIndex]?.textContent||el.value)}$('conditionLine').textContent=parts.join(' / ')||'全範囲'}
function updateSummary(){const f=filtered();$('summary').innerHTML=[`候補 ${f.length}問`,`原問題 ${f.filter(r=>!isVariant(r)).length}問`,`既存類題 ${f.filter(isVariant).length}問`].map(x=>`<span class="pill">${x}</span>`).join('');updateConditionLine()}
function canonicalAudit(rs){const ids=new Set();let duplicate=0,blankQ=0,blankA=0,original=0,variant=0;const src={Winpass:0,'実力錬成':0,Standard:0};for(const r of rs){if(ids.has(r.id))duplicate++;ids.add(r.id);if(!String(r.question||'').trim())blankQ++;if(!String(r.answer||'').trim())blankA++;if(isVariant(r))variant++;else{original++;if(src[sourceBook(r)]!=null)src[sourceBook(r)]++}}const pass=rs.length===CANONICAL.total&&original===CANONICAL.original&&variant===CANONICAL.variant&&duplicate===0&&blankQ===0&&blankA===0&&Object.keys(CANONICAL.source).every(k=>src[k]===CANONICAL.source[k]);return {pass,total:rs.length,original,variant,duplicate,blankQ,blankA,src}}
function showGate(a){$('gate').className='data-gate '+(a.pass?'pass':'fail');$('gate').textContent=a.pass?'正本ゲート PASS：1231問（原1124＋既存類題107）':'正本ゲート未達：データを公開完成版として扱いません';$('draw').disabled=!a.pass;$('redraw').disabled=!a.pass;$('printQuestions').disabled=!a.pass;$('printAnswers').disabled=!a.pass}
function printMode(answers){if(!currentRows.length)return;document.body.classList.toggle('print-answers',answers);document.querySelector('.paper-title').textContent=answers?'数学 解答プリント':'数学 問題プリント';window.print();setTimeout(()=>{document.body.classList.remove('print-answers');document.querySelector('.paper-title').textContent='数学 問題プリント'},300)}
IDS.forEach(id=>$(id).addEventListener('change',()=>{refreshFilters();saveSettings()}));
$('draw').onclick=()=>render(selectRows());$('redraw').onclick=()=>render(selectRows());$('toggleAnswers').onclick=()=>{const on=document.body.classList.toggle('show-answers-screen');$('toggleAnswers').textContent=on?'画面の解答を隠す':'画面の解答を表示'};$('printQuestions').onclick=()=>printMode(false);$('printAnswers').onclick=()=>printMode(true);
fetch(DATA_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('app-records.json not available');return r.json()}).then(d=>{records=Array.isArray(d)?d:(d.records||[]);const a=canonicalAudit(records);$('status').className='status '+(a.pass?'good':'warn');$('status').textContent=`読込 ${a.total}問 / 原問題 ${a.original} / 既存類題 ${a.variant} / 重複ID ${a.duplicate} / 空問題 ${a.blankQ} / 空解答 ${a.blankA}`;loadSettings();refreshFilters();showGate(a);if(a.pass)render(selectRows())}).catch(e=>{$('status').className='status warn';$('status').textContent='正本データ未接続：最終1231問の再確認後に接続します。';showGate({pass:false});console.warn(e)});
</script>
</body>
</html>
