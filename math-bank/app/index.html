<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>みかみ塾 数学問題プリント作成アプリ</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f3f5f7;--line:#dfe3e7;--muted:#5f6b76;--accent:#1f5fae}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}h1{font-size:24px;margin:0 0 6px}h2{font-size:18px;margin:0 0 10px}.sub,.status{font-size:13px;color:var(--muted);line-height:1.55}.status.good{color:#166534}.status.warn{color:#9a3412}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.field label{font-size:12px;font-weight:800;display:block;margin-bottom:4px}.field select,.field input,button{width:100%;font:inherit;padding:10px;border:1px solid #b9c0c7;border-radius:10px;background:#fff}.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}button{cursor:pointer;font-weight:700}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button:disabled{cursor:not-allowed;opacity:.45}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pill{font-size:12px;padding:4px 8px;border-radius:999px;background:#eef3f9;color:#24435f}.paper{background:#fff}.paper-head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;border-bottom:2px solid #222;padding-bottom:8px;margin-bottom:10px}.paper-title{font-weight:900;font-size:20px}.identity{display:grid;grid-template-columns:repeat(3,minmax(100px,1fr));gap:8px;margin:10px 0 16px}.identity div{border-bottom:1px solid #222;min-height:28px;font-size:13px;padding:4px 2px}.problem{padding:12px 0;border-bottom:1px solid #e6e8eb;break-inside:avoid}.problem:last-child{border-bottom:0}.meta{font-size:11px;color:#66727e;margin-bottom:6px}.problem-title{font-size:13px;font-weight:800;margin-bottom:5px}.q{white-space:pre-wrap;font-size:16px;line-height:1.7}.choices{margin:8px 0 4px;padding-left:28px;line-height:1.65}.choices li{padding:2px 0;white-space:pre-wrap}.figures{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.figures img{max-width:min(100%,520px);max-height:360px;object-fit:contain;border:1px solid #ddd;border-radius:8px;background:#fff}.answer{display:none;margin-top:10px;padding:10px;background:#f7f8fa;border-radius:9px;white-space:pre-wrap;line-height:1.65}.answer.open,.show-answers-screen .answer{display:block}.answer-toggle{width:auto;margin-top:8px}.empty{padding:26px;text-align:center;color:#68737e}.screen-only-note{font-size:12px;color:#68737e;margin-top:8px}.data-gate{font-weight:800}.data-gate.pass{color:#166534}.data-gate.fail{color:#b42318}.import-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.import-row input[type=file]{display:none}@media(max-width:600px){.wrap{padding:10px}.panel{padding:12px;border-radius:12px}.identity{grid-template-columns:1fr}.paper-head{grid-template-columns:1fr}.q{font-size:15px}.actions{grid-template-columns:1fr 1fr}.import-row{grid-template-columns:1fr}}
@page{size:A4;margin:12mm}
@media print{body{background:#fff}.wrap{max-width:none;padding:0}.controls,.top-status,.answer-toggle,.screen-only-note{display:none!important}.panel{border:0;border-radius:0;padding:0;margin:0}.paper{display:block!important}.problem{break-inside:avoid;page-break-inside:avoid}.answer{display:none!important}.print-answers .answer{display:block!important;background:transparent;border-top:1px dashed #777;border-radius:0;padding:8px 0 0}.print-answers .q{font-size:14px}.print-answers .problem{padding:8px 0}.figures img{max-height:250px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel top-status">
    <h1>みかみ塾 数学問題プリント作成アプリ</h1>
    <div class="sub">正本1231問専用。原問題1124問＋検算済み類題107問以外は追加しません。問題文・選択肢・正答・解説を保持します。</div>
    <div id="status" class="status">データを読み込み中…</div>
    <div id="gate" class="data-gate fail">正本ゲート確認中</div>
  </div>

  <div class="panel controls">
    <h2>出題条件</h2>
    <div class="grid">
      <div class="field"><label>学年</label><select id="grade"><option value="">すべて</option><option value="1">中1</option><option value="2">中2</option><option value="3">中3</option></select></div>
      <div class="field"><label>ジャンル</label><select id="major"><option value="">すべて</option></select></div>
      <div class="field"><label>単元</label><select id="minor"><option value="">すべて</option></select></div>
      <div class="field"><label>技能</label><select id="skill"><option value="">すべて</option></select></div>
      <div class="field"><label>難易度</label><select id="difficulty"><option value="">すべて</option></select></div>
      <div class="field"><label>出題形式</label><select id="qformat"><option value="">すべて</option></select></div>
      <div class="field"><label>原問題 / 類題</label><select id="kind"><option value="both">両方</option><option value="original">原問題のみ</option><option value="variant">既存類題のみ</option></select></div>
      <div class="field"><label>教材</label><select id="book"><option value="">すべて</option></select></div>
      <div class="field"><label>問題数</label><input id="count" type="number" min="1" max="200" value="10"></div>
      <div class="field"><label>並び順</label><select id="order"><option value="random">ランダム</option><option value="source">教材順</option></select></div>
      <div class="field"><label>問題バンク検索</label><input id="search" type="search" placeholder="ID・タイトル・問題文・選択肢・解答・単元"></div>
    </div>
    <div class="actions">
      <button id="draw" class="primary">問題を出す</button>
      <button id="redraw">同条件で再抽選</button>
      <button id="toggleAnswers">画面の解答を表示</button>
      <button id="printQuestions">問題をA4印刷</button>
      <button id="printAnswers">解答をA4印刷</button>
    </div>
    <div class="import-row">
      <div class="screen-only-note">公開時は app-records.json を自動読込。再確認中は正本JSONを手動読込して同じ完全ゲートで検証できます。</div>
      <div><input id="importFile" type="file" accept="application/json,.json"><button id="importButton" type="button">正本JSONを読込</button></div>
    </div>
    <div id="summary" class="summary"></div>
    <div class="screen-only-note">条件はこの端末に自動保存されます。印刷時は操作UIを非表示にします。</div>
  </div>

  <div class="panel paper" id="paper">
    <div class="paper-head"><div><div class="paper-title">数学 問題プリント</div><div id="conditionLine" class="sub"></div></div><div id="printCount" class="sub"></div></div>
    <div class="identity"><div>名前：</div><div>日付：</div><div>点数：　　　/　　　点</div></div>
    <div id="list"><div class="empty">正本データを読み込むと、ここに問題が表示されます。</div></div>
  </div>
</div>
<script>
const DATA_URL='./app-records.json';
const CANONICAL={total:1231,original:1124,variant:107,source:{Winpass:570,'実力錬成':237,Standard:317}};
const VALID_GRADES=new Set([1,2,3]);
const VALID_DIFFICULTY=new Set(['basic','standard','advanced','unknown']);
const VALID_BOOKS=new Set(['Winpass','実力錬成','Standard','generated']);
const SAFE_EXTERNAL_FIGURE_SCHEMES=new Set(['http','https','data','blob']);
const SAFE_LOCAL_FIGURE_EXTENSIONS=new Set(['.png','.jpg','.jpeg','.webp','.gif','.svg','.avif']);
const SETTINGS_KEY='mikami-math-app-settings-v4';
let records=[], currentRows=[], dataSource='未接続', recordById=new Map();
const $=id=>document.getElementById(id);
const IDS=['grade','major','minor','skill','difficulty','qformat','kind','book','count','order','search'];
function isObj(v){return !!v&&typeof v==='object'&&!Array.isArray(v)}
function txt(v){return typeof v==='string'?v.trim():''}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function uniq(xs){return [...new Set(xs.filter(v=>v!==null&&v!==undefined&&String(v).trim()!==''))].sort((a,b)=>String(a).localeCompare(String(b),'ja',{numeric:true}))}
function setOptions(el,vals,label=v=>v){const keep=el.value;el.innerHTML='<option value="">すべて</option>'+vals.map(v=>`<option value="${esc(v)}">${esc(label(v))}</option>`).join('');if(vals.map(String).includes(keep))el.value=keep}
function safeFigureRef(ref){
  const s=txt(ref);if(!s)return false;
  if(s.startsWith('//'))return true;
  const scheme=s.match(/^([A-Za-z][A-Za-z0-9+.-]*):/);if(scheme)return SAFE_EXTERNAL_FIGURE_SCHEMES.has(scheme[1].toLowerCase());
  let path=s.split(/[?#]/,1)[0];try{path=decodeURIComponent(path)}catch{return false}
  if(!path||path.startsWith('/')||path.includes('\\'))return false;
  const parts=path.split('/');if(parts.some(p=>!p||p==='.'||p==='..'))return false;
  const name=parts[parts.length-1];const dot=name.lastIndexOf('.');if(dot<0)return false;
  return SAFE_LOCAL_FIGURE_EXTENSIONS.has(name.slice(dot).toLowerCase());
}
function validChoices(v){return v===null||(Array.isArray(v)&&v.every(x=>typeof x==='string'&&x.trim()))}
function isVariant(r){return !!r?.source?.is_generated_variant}
function majorOf(r){return r?.unit?.major??''}
function minorOf(r){return r?.unit?.minor??''}
function sourceBook(r){return r?.source?.book??''}
function sourceAnchor(r){if(!isVariant(r))return r;const p=recordById.get(r?.source?.parent_id);return p&&!isVariant(p)?p:r}
function parentBookOf(r){return sourceBook(sourceAnchor(r))}
function labelDifficulty(v){return ({basic:'基礎',standard:'標準',advanced:'発展',unknown:'未分類'})[v]??v}
function saveSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(Object.fromEntries(IDS.map(id=>[id,$(id).value]))))}catch{}}
function readSettings(){try{const x=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}');return isObj(x)?x:{}}catch{return {}}}
function setStoredValue(id,value){if(value===null||value===undefined)return;const el=$(id),v=String(value);if(id==='search'){el.value=v;return}if(id==='count'){el.value=String(Math.max(1,Math.min(200,Number(v)||10)));return}if([...el.options].some(o=>o.value===v))el.value=v}
function restoreSettings(){const x=readSettings();for(const id of ['grade','kind','count','order','search'])setStoredValue(id,x[id]);refreshFilters();setStoredValue('major',x.major);refreshFilters();setStoredValue('minor',x.minor);refreshFilters();for(const id of ['skill','difficulty','qformat','book'])setStoredValue(id,x[id]);updateSummary();saveSettings()}
function cascadeBase(stop){let a=records;const g=$('grade').value;if(g)a=a.filter(r=>String(r?.grade)===g);if(stop==='grade')return a;const maj=$('major').value;if(maj)a=a.filter(r=>majorOf(r)===maj);if(stop==='major')return a;const min=$('minor').value;if(min)a=a.filter(r=>minorOf(r)===min);return a}
function refreshFilters(){setOptions($('major'),uniq(cascadeBase('grade').map(majorOf)));setOptions($('minor'),uniq(cascadeBase('major').map(minorOf)));const base=cascadeBase('minor');setOptions($('skill'),uniq(base.map(r=>r?.skill)));setOptions($('difficulty'),uniq(base.map(r=>r?.difficulty)),labelDifficulty);setOptions($('qformat'),uniq(base.map(r=>r?.question_format)));setOptions($('book'),uniq(records.filter(r=>!isVariant(r)).map(sourceBook)));updateSummary();saveSettings()}
function matchSearch(r,q){if(!q)return true;const a=sourceAnchor(r);const hay=[r?.id,r?.title,r?.question,...(Array.isArray(r?.choices)?r.choices:[]),r?.answer,r?.explanation,majorOf(r),minorOf(r),r?.skill,r?.question_format,parentBookOf(r),a?.source?.document,a?.source?.original_no,...(r?.unit?.tags||[])].join('\n').toLowerCase();return hay.includes(q.toLowerCase())}
function filtered(){const g=$('grade').value,maj=$('major').value,min=$('minor').value,skill=$('skill').value,d=$('difficulty').value,qf=$('qformat').value,kind=$('kind').value,book=$('book').value,q=$('search').value.trim();return records.filter(r=>(!g||String(r?.grade)===g)&&(!maj||majorOf(r)===maj)&&(!min||minorOf(r)===min)&&(!skill||r?.skill===skill)&&(!d||r?.difficulty===d)&&(!qf||r?.question_format===qf)&&(kind==='both'||(kind==='original'&&!isVariant(r))||(kind==='variant'&&isVariant(r)))&&(!book||parentBookOf(r)===book)&&matchSearch(r,q))}
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function sourceSort(a,b){const aa=sourceAnchor(a),bb=sourceAnchor(b);const ka=[aa?.grade,parentBookOf(a),aa?.source?.document??'',aa?.source?.original_no??'',isVariant(a)?1:0,a?.id].join('|');const kb=[bb?.grade,parentBookOf(b),bb?.source?.document??'',bb?.source?.original_no??'',isVariant(b)?1:0,b?.id].join('|');return ka.localeCompare(kb,'ja',{numeric:true})}
function selectRows(){let f=filtered();const n=Math.max(1,Math.min(200,Number($('count').value)||10));$('count').value=String(n);if($('order').value==='random')f=shuffle(f);else f=[...f].sort(sourceSort);return f.slice(0,n)}
function choicesHtml(r){return Array.isArray(r?.choices)&&r.choices.length?`<ol class="choices">${r.choices.map(c=>`<li>${esc(c)}</li>`).join('')}</ol>`:''}
function figuresHtml(r){return (r?.figure_refs||[]).length?`<div class="figures">${r.figure_refs.map(ref=>`<img src="${esc(ref)}" alt="図版 ${esc(r.id)}" loading="eager" onload="this.dataset.loadOk='1'" onerror="this.dataset.loadError='1'">`).join('')}</div>`:''}
function clearOutput(message){currentRows=[];document.body.classList.remove('show-answers-screen','print-answers');$('toggleAnswers').textContent='画面の解答を表示';document.querySelector('.paper-title').textContent='数学 問題プリント';$('list').innerHTML=`<div class="empty">${esc(message)}</div>`;$('printCount').textContent='0問'}
function render(rows){currentRows=rows;document.body.classList.remove('show-answers-screen');$('toggleAnswers').textContent='画面の解答を表示';if(!rows.length){clearOutput('条件に合う問題がありません。');return}
$('list').innerHTML=rows.map((r,i)=>`<div class="problem" data-id="${esc(r.id)}"><div class="meta">${i+1}. ID ${esc(r.id)} / 中${esc(r.grade)} / ${esc(majorOf(r))} › ${esc(minorOf(r))} / ${esc(r.skill)} / ${esc(labelDifficulty(r.difficulty))} / ${esc(r.question_format)} / ${isVariant(r)?'既存類題':'原問題'} / ${esc(parentBookOf(r))}</div>${r.title?`<div class="problem-title">${esc(r.title)}</div>`:''}<div class="q">${esc(r.question)}</div>${choicesHtml(r)}${figuresHtml(r)}<button class="answer-toggle" data-i="${i}">解答を表示</button><div class="answer" id="a${i}"><strong>解答：</strong>${esc(r.answer)}${r.explanation?'\n\n<strong>解説：</strong>'+esc(r.explanation):''}</div></div>`).join('');
document.querySelectorAll('.answer-toggle').forEach(b=>b.onclick=()=>{const a=document.getElementById('a'+b.dataset.i);const on=a.classList.toggle('open');b.textContent=on?'解答を隠す':'解答を表示'});$('printCount').textContent=`${rows.length}問`;updateConditionLine()}
function updateConditionLine(){const parts=[];if($('grade').value)parts.push(`中${$('grade').value}`);for(const id of ['major','minor','skill','difficulty','qformat','kind','book']){const el=$(id);if(el.value&&el.value!=='both')parts.push(el.options[el.selectedIndex]?.textContent||el.value)}if($('search').value.trim())parts.push(`検索:${$('search').value.trim()}`);$('conditionLine').textContent=parts.join(' / ')||'全範囲'}
function updateSummary(){const f=filtered();$('summary').innerHTML=[`候補 ${f.length}問`,`原問題 ${f.filter(r=>!isVariant(r)).length}問`,`既存類題 ${f.filter(isVariant).length}問`,`選択問題 ${f.filter(r=>Array.isArray(r?.choices)&&r.choices.length).length}問`,`データ ${dataSource}`].map(x=>`<span class="pill">${esc(x)}</span>`).join('');updateConditionLine()}
function canonicalAudit(rs){
  const ids=new Set(),byId=new Map();let duplicate=0,blankQ=0,blankA=0,original=0,variant=0,invalid=0,auditFail=0,parentFail=0,figureFail=0,choiceRecords=0;const src={Winpass:0,'実力錬成':0,Standard:0};
  for(const r of rs){if(!isObj(r)){invalid++;continue}const rid=txt(r.id);if(!rid){invalid++;continue}if(ids.has(rid))duplicate++;ids.add(rid);byId.set(rid,r)}
  for(const r of rs){
    if(!isObj(r)){continue}
    const rid=txt(r.id);if(!rid)continue;
    if(!VALID_GRADES.has(r.grade))invalid++;
    if(typeof r.title!=='string')invalid++;
    if(!VALID_DIFFICULTY.has(r.difficulty))invalid++;
    if(!txt(r.skill))invalid++;
    if(!txt(r.question_format))invalid++;
    if(!txt(r.question)){blankQ++;invalid++}
    if(!Object.prototype.hasOwnProperty.call(r,'choices')||!validChoices(r.choices))invalid++;else if(Array.isArray(r.choices)&&r.choices.length)choiceRecords++;
    if(!txt(r.answer)){blankA++;invalid++}
    if(typeof r.explanation!=='string')invalid++;
    if(!(r.variant_group===null||typeof r.variant_group==='string'))invalid++;
    const unit=r.unit;if(!isObj(unit)||!txt(unit.major)||!txt(unit.minor))invalid++;
    const tags=unit?.tags??[];if(!Array.isArray(tags)||tags.some(x=>typeof x!=='string')||new Set(tags).size!==tags.length)invalid++;
    if(r.prerequisites!==undefined&&(!Array.isArray(r.prerequisites)||r.prerequisites.some(x=>typeof x!=='string')||new Set(r.prerequisites).size!==r.prerequisites.length))invalid++;
    const source=r.source;if(!isObj(source)||!VALID_BOOKS.has(source?.book)||typeof source?.is_generated_variant!=='boolean'||typeof source?.document!=='string'||!(source?.original_no===null||typeof source?.original_no==='string'))invalid++;
    const generated=isVariant(r);if(generated){variant++;if(source?.book!=='generated'||!txt(source?.parent_id))invalid++}else{original++;if(src[source?.book]===undefined)invalid++;else src[source.book]++}
    const figs=r.figure_refs;if(!Array.isArray(figs)||figs.some(x=>!safeFigureRef(x))||new Set(figs).size!==figs.length)figureFail++;
    const audit=r.audit;if(!isObj(audit)||audit.problem_answer_verified!==true||audit.structure_verified!==true||audit.figure_refs_verified!==true)auditFail++;
  }
  for(const r of rs){if(!isObj(r)||!isVariant(r))continue;const p=byId.get(txt(r.source?.parent_id));if(!p||isVariant(p))parentFail++}
  const pass=rs.length===CANONICAL.total&&original===CANONICAL.original&&variant===CANONICAL.variant&&duplicate===0&&blankQ===0&&blankA===0&&invalid===0&&auditFail===0&&parentFail===0&&figureFail===0&&Object.keys(CANONICAL.source).every(k=>src[k]===CANONICAL.source[k]);
  return {pass,total:rs.length,original,variant,duplicate,blankQ,blankA,invalid,auditFail,parentFail,figureFail,choiceRecords,src}
}
function showGate(a){$('gate').className='data-gate '+(a.pass?'pass':'fail');$('gate').textContent=a.pass?'正本ゲート PASS：1231問・タイトル/選択肢・構造/監査/親子関係/図版パスまで確認':'正本ゲート未達：データを公開完成版として扱いません';for(const id of ['draw','redraw','toggleAnswers','printQuestions','printAnswers'])$(id).disabled=!a.pass}
function acceptRecords(rs,source){records=Array.isArray(rs)?rs:[];recordById=new Map(records.filter(isObj).map(r=>[txt(r.id),r]).filter(([id])=>id));dataSource=source;const a=canonicalAudit(records);$('status').className='status '+(a.pass?'good':'warn');$('status').textContent=`${source} / 読込 ${a.total}問 / 原 ${a.original} / 類題 ${a.variant} / 選択 ${a.choiceRecords} / 重複 ${a.duplicate} / 空問 ${a.blankQ} / 空答 ${a.blankA} / 構造 ${a.invalid} / 監査 ${a.auditFail} / 親 ${a.parentFail} / 図版 ${a.figureFail}`;restoreSettings();showGate(a);if(a.pass)render(selectRows());else clearOutput('正本1231問の完全ゲートを通過していないため、出題・解答表示・印刷はロックしています。')}
function figurePrintReadiness(){const imgs=[...document.querySelectorAll('#list .figures img')];const failed=imgs.filter(img=>img.dataset.loadError==='1'||(img.complete&&img.naturalWidth===0));const pending=imgs.filter(img=>!img.complete);return {images:imgs.length,failed:failed.length,pending:pending.length,ready:failed.length===0&&pending.length===0}}
function printMode(answers){if(!currentRows.length)return;const f=figurePrintReadiness();if(!f.ready){$('status').className='status warn';$('status').textContent=f.failed?`印刷中止：表示中の図版 ${f.failed}件が読み込めません。`:`印刷待機：図版 ${f.pending}件の読み込み完了後にもう一度印刷してください。`;return}document.body.classList.toggle('print-answers',answers);document.querySelector('.paper-title').textContent=answers?'数学 解答プリント':'数学 問題プリント';window.print()}
window.addEventListener('afterprint',()=>{document.body.classList.remove('print-answers');document.querySelector('.paper-title').textContent='数学 問題プリント'});
IDS.filter(id=>id!=='search').forEach(id=>$(id).addEventListener('change',()=>{refreshFilters();saveSettings()}));$('search').addEventListener('input',()=>{updateSummary();saveSettings()});
$('draw').onclick=()=>render(selectRows());$('redraw').onclick=()=>render(selectRows());$('toggleAnswers').onclick=()=>{const on=document.body.classList.toggle('show-answers-screen');$('toggleAnswers').textContent=on?'画面の解答を隠す':'画面の解答を表示'};$('printQuestions').onclick=()=>printMode(false);$('printAnswers').onclick=()=>printMode(true);
$('importButton').onclick=()=>$('importFile').click();$('importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());const rs=Array.isArray(obj)?obj:(obj.records||[]);if(!Array.isArray(rs))throw new Error('records array not found');acceptRecords(rs,`手動JSON:${f.name}`)}catch(err){records=[];recordById=new Map();dataSource='読込失敗';$('status').className='status warn';$('status').textContent=`JSON読込失敗：${err.message}`;refreshFilters();showGate({pass:false});clearOutput('JSONの読込に失敗したため、以前の表示を破棄しました。')}finally{e.target.value=''}});
fetch(DATA_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('app-records.json not available');return r.json()}).then(d=>acceptRecords(Array.isArray(d)?d:(d.records||[]),'app-records.json')).catch(e=>{records=[];recordById=new Map();$('status').className='status warn';$('status').textContent='正本データ未接続：最終1231問の再確認後に接続します。手動JSON読込も利用できます。';dataSource='未接続';refreshFilters();showGate({pass:false});clearOutput('正本データを読み込むと、ここに問題が表示されます。');console.warn(e)});
