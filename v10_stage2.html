<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>長文読解問題作成アプリ v10 stage2</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;margin:0;background:#f5f7fb;color:#1f2937}.wrap{max-width:1040px;margin:0 auto;padding:18px}.panel{background:#fff;border:1px solid #d8dee9;border-radius:16px;padding:18px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:5px;min-width:145px}.field label{font-size:12px;font-weight:800;color:#475569}select,button{padding:10px 12px;border-radius:10px;border:1px solid #cbd5e1;background:#fff}button{font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#0f172a;color:#fff}.tabs button.active{background:#0f172a;color:#fff}.muted{color:#667085;font-size:13px;line-height:1.7}.ok{color:#166534;font-weight:800}.warn{color:#92400e;font-weight:800}.en{font-size:18px;line-height:1.9}.slash{padding:10px 0;border-bottom:1px dashed #e5e7eb}.slash .enline{font-weight:700}.slash .jpline{margin-top:4px;color:#374151}.q{padding:12px 0;border-bottom:1px solid #eef2f7}.evidence{background:#f8fafc;border-left:4px solid #94a3b8;padding:10px;margin-top:8px}.hidden{display:none}.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:800}.meta{font-size:13px;color:#475569;line-height:1.8}.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px;line-height:1.7}.fail{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px;margin-top:8px;color:#991b1b;font-size:13px}.controlbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}h1{font-size:24px;margin:0 0 8px}h2{font-size:20px;margin-top:0}@media(max-width:700px){.field{min-width:calc(50% - 8px);flex:1}.wrap{padding:10px}.panel{padding:14px}.en{font-size:16px}}@media print{body{background:#fff}.wrap{max-width:none;padding:0}.panel{border:0;border-radius:0;margin:0}.screen-only,.tabs,#gate,#masterCount{display:none!important}.tabpage{display:block!important;page-break-after:always}.tabpage#audit{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
<section class="panel screen-only">
<h1>長文読解問題作成アプリ v10</h1>
<div class="muted">監修済み本文だけを使用。月フィルタなし。出題型を指定した場合も、選択した大単元の範囲外へ勝手に戻りません。</div>
<div class="row" style="margin-top:12px">
 <div class="field"><label>教科書</label><select id="textbook"><option value="サンシャイン">サンシャイン</option><option value="ニューホライズン">ニューホライズン</option></select></div>
 <div class="field"><label>学年</label><select id="grade"><option value="1">中1</option><option value="2">中2</option></select></div>
 <div class="field"><label>大単元</label><select id="major"></select></div>
 <div class="field"><label>小単元上限</label><select id="section"></select></div>
 <div class="field"><label>出題型</label><select id="pattern"><option value="all">全ジャンル</option><option value="diary">日記・体験記</option><option value="notice">案内・お知らせ</option><option value="email">メール・会話</option><option value="report">説明文・レポート</option></select></div>
</div>
<div class="controlbar"><button id="altSetBtn" type="button">同じ本文で別問題セット</button><button id="printBtn" type="button">印刷</button></div>
<div id="gate" style="margin-top:12px"></div><div id="masterCount" class="muted" style="margin-top:8px"></div>
</section>
<section class="panel tabs row screen-only"><button data-tab="passage" class="active">本文</button><button data-tab="slash">英文解釈</button><button data-tab="questions">問題</button><button data-tab="answers">解答・解説</button><button data-tab="audit">品質監査</button></section>
<section id="passage" class="panel tabpage"></section><section id="slash" class="panel tabpage hidden"></section><section id="questions" class="panel tabpage hidden"></section><section id="answers" class="panel tabpage hidden"></section><section id="audit" class="panel tabpage hidden"></section>
</div>
<script src="v10_vocab_corrections.js"></script>

<script src="v10_data_sunshine_g1.js"></script><script src="v10_data_sunshine_g1_program1.js"></script><script src="v10_data_sunshine_g1_program2.js"></script><script src="v10_data_sunshine_g1_program4.js"></script><script src="v10_data_sunshine_g1_program5.js"></script><script src="v10_data_sunshine_g1_program6.js"></script><script src="v10_data_sunshine_g1_program7.js"></script><script src="v10_data_sunshine_g1_program8.js"></script><script src="v10_data_sunshine_g1_program9.js"></script><script src="v10_data_sunshine_g1_program10.js"></script><script src="v10_data_sunshine_g1_program10_fix.js"></script>
<script>window.V10_SUNSHINE_G1=window.V10_PASSAGES||{};</script>
<script src="v10_data_newhorizon_g1.js"></script><script src="v10_data_newhorizon_g1_unit1_2.js"></script><script src="v10_data_newhorizon_g1_unit1_3.js"></script><script src="v10_data_newhorizon_g1_unit2_1.js"></script><script src="v10_data_newhorizon_g1_unit2_2.js"></script><script src="v10_data_newhorizon_g1_unit2_3.js"></script><script src="v10_data_newhorizon_g1_unit3_1.js"></script><script src="v10_data_newhorizon_g1_unit3_2.js"></script><script src="v10_data_newhorizon_g1_unit4_3.js"></script><script src="v10_data_newhorizon_g1_unit5_1.js"></script><script src="v10_data_newhorizon_g1_unit5_2.js"></script><script src="v10_data_newhorizon_g1_unit5_3.js"></script><script src="v10_data_newhorizon_g1_unit6_1.js"></script><script src="v10_data_newhorizon_g1_unit7_1.js"></script><script src="v10_data_newhorizon_g1_unit8_1.js"></script><script src="v10_data_newhorizon_g1_unit9_1.js"></script><script src="v10_data_newhorizon_g1_unit10_1.js"></script>
<script>window.V10_NEWHORIZON_G1=window.V10_PASSAGES||{};</script>

<script src="v10_data_sunshine_g2_program1.js"></script><script src="v10_data_sunshine_g2_program2.js"></script><script src="v10_data_sunshine_g2_program3.js"></script><script src="v10_data_sunshine_g2_program4.js"></script><script src="v10_data_sunshine_g2_program4_fix.js"></script><script src="v10_data_sunshine_g2_program5.js"></script><script src="v10_data_sunshine_g2_program5_fix.js"></script><script src="v10_data_sunshine_g2_program6.js"></script><script src="v10_data_sunshine_g2_program7.js"></script><script src="v10_data_sunshine_g2_program8.js"></script>
<script src="v10_data_newhorizon_g2_unit0_1.js"></script><script src="v10_data_newhorizon_g2_unit0_1_fix.js"></script><script src="v10_data_newhorizon_g2_unit0_1_fix2.js"></script><script src="v10_data_newhorizon_g2_unit2.js"></script><script src="v10_data_newhorizon_g2_unit3.js"></script><script src="v10_data_newhorizon_g2_unit3_fix.js"></script><script src="v10_data_newhorizon_g2_unit4.js"></script><script src="v10_data_newhorizon_g2_unit4_fix.js"></script><script src="v10_data_newhorizon_g2_unit5.js"></script><script src="v10_data_newhorizon_g2_unit6.js"></script><script src="v10_data_newhorizon_g2_unit6_fix.js"></script><script src="v10_data_newhorizon_g2_unit7.js"></script>

<script src="v10_interaction_metadata.js"></script>
<script src="v10_interaction_metadata_sun_g2_p1.js"></script><script src="v10_interaction_metadata_sun_g2_p2.js"></script><script src="v10_interaction_metadata_sun_g2_p3.js"></script><script src="v10_interaction_metadata_sun_g2_p4.js"></script><script src="v10_interaction_metadata_sun_g2_p4_fix.js"></script><script src="v10_interaction_metadata_sun_g2_p5.js"></script><script src="v10_interaction_metadata_sun_g2_p6.js"></script><script src="v10_interaction_metadata_sun_g2_p7.js"></script><script src="v10_interaction_metadata_sun_g2_p8.js"></script>
<script src="v10_interaction_metadata_nh_g2_u0_u1.js"></script><script src="v10_interaction_metadata_nh_g2_u2.js"></script><script src="v10_interaction_metadata_nh_g2_u3.js"></script><script src="v10_interaction_metadata_nh_g2_u4.js"></script><script src="v10_interaction_metadata_nh_g2_u5.js"></script><script src="v10_interaction_metadata_nh_g2_u6.js"></script><script src="v10_interaction_metadata_nh_g2_u7.js"></script>
<script>
window.V10_INTERACTION_META=window.V10_INTERACTION_META||{};
Object.assign(window.V10_INTERACTION_META,
 window.V10_INTERACTION_META_G2||{},
 window.V10_INTERACTION_META_G2_P2||{},
 window.V10_INTERACTION_META_G2_P3||{},
 window.V10_INTERACTION_META_G2_P4||{},
 window.V10_INTERACTION_META_G2_P4_FIX||{},
 window.V10_INTERACTION_META_G2_P5||{},
 window.V10_INTERACTION_META_G2_P6||{},
 window.V10_INTERACTION_META_G2_P7||{},
 window.V10_INTERACTION_META_G2_P8||{},
 window.V10_INTERACTION_META_G2_NH_U01||{},
 window.V10_INTERACTION_META_G2_NH_U2||{},
 window.V10_INTERACTION_META_G2_NH_U3||{},
 window.V10_INTERACTION_META_G2_NH_U4||{},
 window.V10_INTERACTION_META_G2_NH_U5||{},
 window.V10_INTERACTION_META_G2_NH_U6||{},
 window.V10_INTERACTION_META_G2_NH_U7||{}
);
</script>
<script>
const DATASETS={
 '1':{'サンシャイン':window.V10_SUNSHINE_G1||{},'ニューホライズン':window.V10_NEWHORIZON_G1||{}},
 '2':{'サンシャイン':window.V10_PASSAGES_G2_SS||{},'ニューホライズン':window.V10_PASSAGES_G2_NH||{}}
};
const META=window.V10_INTERACTION_META||{};let questionMode='A';
const GENRE_LABEL={all:'全ジャンル',diary:'日記・体験記',notice:'案内・お知らせ',email:'メール・会話',report:'説明文・レポート'};
function filled(v){return typeof v==='string'&&v.trim().length>0}function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function currentGrade(){return document.getElementById('grade').value}
function passages(){const g=currentGrade(),t=document.getElementById('textbook').value;return(DATASETS[g]&&DATASETS[g][t])||{}}
function majorOf(section,textbook=document.getElementById('textbook').value){if(textbook==='ニューホライズン'){if(section==='Unit 0')return'Unit 0';const m=section.match(/^Unit\s+(\d+)-/);return m?`Unit ${m[1]}`:section}if(section.startsWith('Get Ready '))return'Get Ready';const p=section.match(/^PROGRAM\s+(\d+)-/);return p?`PROGRAM ${p[1]}`:section}
function metaFor(m){if(!m)return{};return META[`${m.textbook}|${m.grade}|${m.section}`]||META[`${m.textbook}|${m.section}`]||{}}
function releaseProblems(m,qs){const p=[];if(!m){p.push('この条件の監修済み本文は未登録');return p}if(!filled(m.id)||!filled(m.title)||!filled(m.fullTranslation))p.push('ID・タイトル・全訳の必須項目不足');if(!Array.isArray(m.sentences)||m.sentences.length<10)p.push('本文が10文未満');if(!Array.isArray(m.slashRows)||m.slashRows.length!==m.sentences.length)p.push('本文文数とスラッシュ行数が不一致');if(!Array.isArray(qs)||qs.length<3)p.push('設問が3問未満');else if(qs.some(q=>!q||!filled(q.prompt)||!filled(q.answer)||!filled(q.evidence)||!filled(q.evidenceJp)||!filled(q.reason)))p.push('設問の必須項目不足');for(const k of ['vocabAudit','manualSlashAudit','manualMeaningAudit','manualQuestionAudit'])if(m[k]!==true)p.push(`${k}未完了`);return p}
function initMajors(){const p=passages(),major=document.getElementById('major'),old=major.value,arr=[];Object.keys(p).forEach(k=>{const m=majorOf(k);if(!arr.includes(m))arr.push(m)});major.innerHTML='';arr.forEach(v=>major.add(new Option(v,v)));if(old&&arr.includes(old))major.value=old;initSections()}
function initSections(){const p=passages(),maj=document.getElementById('major').value,s=document.getElementById('section'),old=s.value,keys=Object.keys(p).filter(k=>majorOf(k)===maj);s.innerHTML='';keys.forEach(v=>s.add(new Option(v,v)));if(old&&keys.includes(old))s.value=old;questionMode='A';render()}
function selected(){const p=passages(),ceil=document.getElementById('section').value,pattern=document.getElementById('pattern').value;if(!ceil)return null;if(pattern==='all')return p[ceil]||null;const keys=Object.keys(p),idx=keys.indexOf(ceil),maj=majorOf(ceil);for(let i=idx;i>=0;i--){const k=keys[i];if(majorOf(k)!==maj)continue;const m=p[k];if(metaFor(m).genre===pattern)return m}return null}
function currentQuestions(m){if(!m)return[];const md=metaFor(m);return questionMode==='B'&&Array.isArray(md.questionSetB)?md.questionSetB:m.questions}
function updateAltButton(m){const b=document.getElementById('altSetBtn'),has=!!(m&&Array.isArray(metaFor(m).questionSetB)&&metaFor(m).questionSetB.length>=3);b.disabled=!has;b.textContent=has?(questionMode==='A'?'同じ本文で別問題セット（Bへ）':'元の問題セット（Aへ）'):'別問題セット未登録'}
function render(){const m=selected(),qs=currentQuestions(m),pattern=document.getElementById('pattern').value,ceil=document.getElementById('section').value;updateAltButton(m);const gradeSets=DATASETS[currentGrade()]||{},gradeTotal=Object.values(gradeSets).reduce((n,d)=>n+Object.keys(d).length,0);document.getElementById('masterCount').textContent=`この教科書：${Object.keys(passages()).length}本 / 中${currentGrade()}合計：${gradeTotal}本 / 問題セット：${questionMode}`;if(!m){document.getElementById('gate').innerHTML=`<span class="warn">この大単元には「${esc(GENRE_LABEL[pattern])}」の監修済み本文がまだありません。</span>`;['passage','slash','questions','answers','audit'].forEach(id=>document.getElementById(id).innerHTML='');return}const problems=releaseProblems(m,qs),fallback=m.section!==ceil;document.getElementById('gate').innerHTML=`${problems.length?'<span class="warn">release:false</span>':'<span class="badge">release:true</span> <span class="ok">品質ゲート通過</span>'}${fallback?` <span class="muted">小単元上限 ${esc(ceil)} → 同じ大単元内の最新${esc(GENRE_LABEL[pattern])}: ${esc(m.section)}</span>`:''}`;document.getElementById('passage').innerHTML=`<h2>${esc(m.title)}</h2><div class="meta">${esc(m.id)} / ${esc(m.textbook)} / 中${esc(m.grade)} / ${esc(m.section)} / ${esc(m.level)} / 出題型: ${esc(GENRE_LABEL[metaFor(m).genre||'all'])}</div><ol class="en">${m.sentences.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><h3>自然な全訳</h3><div>${esc(m.fullTranslation)}</div>`;document.getElementById('slash').innerHTML=`<h2>英文解釈</h2><div class="notice">意味のまとまりごとに手作業で確定したスラッシュです。</div>${m.slashRows.map(r=>`<div class="slash"><div class="enline">${esc(r.en)}</div><div class="jpline">${esc(r.jp)}</div></div>`).join('')}<h3>自然な全訳</h3><div>${esc(m.fullTranslation)}</div>`;document.getElementById('questions').innerHTML=`<h2>問題セット ${questionMode}</h2>${qs.map(q=>`<div class="q">${esc(q.prompt)}</div>`).join('')}`;document.getElementById('answers').innerHTML=`<h2>解答・解説（セット ${questionMode}）</h2>${qs.map(q=>`<div class="q"><strong>${esc(q.prompt)}</strong><div><b>答え：</b>${esc(q.answer)}</div><div class="evidence"><b>根拠英文：</b>${esc(q.evidence)}<br><b>根拠の意味：</b>${esc(q.evidenceJp)}<br><b>なぜ：</b>${esc(q.reason)}</div></div>`).join('')}`;document.getElementById('audit').innerHTML=`<h2>品質監査</h2><ul><li>文数：${m.sentences.length}</li><li>本文文数＝スラッシュ行数：${m.sentences.length===m.slashRows.length?'一致':'不一致'}</li><li>設問数：${qs.length}</li><li>問題セット：${questionMode}</li><li>出題型：${esc(GENRE_LABEL[metaFor(m).genre||'all'])}</li><li>自動水増し：なし</li><li>自動問題生成：なし</li><li>月フィルタ：なし</li></ul>${problems.length?`<div class="fail">${problems.map(esc).join('<br>')}</div>`:'<div class="ok">releaseゲート検出：0件</div>'}<div class="notice">${esc(m.auditNote)}</div>`}
document.getElementById('textbook').addEventListener('change',()=>{questionMode='A';initMajors()});document.getElementById('grade').addEventListener('change',()=>{questionMode='A';initMajors()});document.getElementById('major').addEventListener('change',()=>{questionMode='A';initSections()});document.getElementById('section').addEventListener('change',()=>{questionMode='A';render()});document.getElementById('pattern').addEventListener('change',()=>{questionMode='A';render()});document.getElementById('altSetBtn').addEventListener('click',()=>{const m=selected();if(m&&Array.isArray(metaFor(m).questionSetB)){questionMode=questionMode==='A'?'B':'A';render();document.querySelector('[data-tab="questions"]').click()}});document.getElementById('printBtn').addEventListener('click',()=>window.print());document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tabpage').forEach(p=>p.classList.add('hidden'));document.getElementById(b.dataset.tab).classList.remove('hidden')}));initMajors();
</script>
</body></html>
