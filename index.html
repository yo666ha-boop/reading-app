<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>長文読解問題作成アプリ｜安定版 2026-04-15</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--line:#d8dee9;--text:#1f2937;--muted:#667085;--head:#0f172a;--accent:#1d4ed8;--accent-soft:#dbeafe;--soft:#f8fafc;--ok:#166534;--warn:#92400e;--danger:#b91c1c;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.app{display:grid;grid-template-columns:390px 1fr;gap:16px;padding:16px;min-height:100vh}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px rgba(15,23,42,.05)}
.left{padding:18px;position:sticky;top:16px;height:calc(100vh - 32px);overflow:auto}
.right{padding:14px;display:grid;gap:12px}
h1{margin:0 0 8px;font-size:24px}
.desc{font-size:13px;line-height:1.8;color:var(--muted)}
.sec{font-size:14px;font-weight:800;margin:16px 0 8px}
.field{margin-top:10px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:14px;color:var(--text)}
textarea{min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.small{font-size:12px;line-height:1.7;color:var(--muted)}
.info-box,.summary-box,.status-box{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;line-height:1.75}
.status-box strong{color:var(--head)}
button{border:none;border-radius:10px;padding:11px 12px;font-size:14px;font-weight:800;cursor:pointer}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.primary{background:var(--head);color:#fff}
.blue{background:var(--accent);color:#fff}
.secondary{background:#e5e7eb;color:#111827}
.ghost{background:#eef2ff;color:var(--accent);border:1px solid #c7d2fe}
.danger{background:#fee2e2;color:var(--danger);border:1px solid #fecaca}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{background:#e5e7eb;border-radius:999px;padding:10px 12px;font-size:13px;font-weight:800;cursor:pointer}
.tab.active{background:var(--head);color:#fff}
.page{display:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 30px;min-height:calc(100vh - 120px)}
.page.active{display:block}
.headrow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.title-main{font-size:28px;font-weight:700;font-family:Georgia,"Times New Roman",serif}
.meta{font-size:13px;color:var(--muted);line-height:1.8}
.bar{background:var(--head);color:#fff;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:800;margin:16px 0 12px}
.reading{font-size:18px;line-height:1.95}
.question{font-size:16px;line-height:1.9;margin:14px 0}
.card{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px;align-items:start;margin-top:6px}
.word-box{border:1px solid var(--line);border-radius:12px;background:#fff;max-height:220px;overflow:auto;padding:8px}
.word-item{display:flex;gap:8px;align-items:flex-start;padding:5px 2px;font-size:13px;border-bottom:1px dashed #eef2f7}
.word-item:last-child{border-bottom:none}
.word-meta{font-size:11px;color:var(--muted)}
.word-item input{margin-top:3px}
.note-list li{margin-top:4px}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;border:1px solid #c7d2fe;font-size:12px;font-weight:700;margin-right:6px;margin-bottom:6px}
.db-table-wrap{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--line);padding:8px 10px;font-size:13px;vertical-align:top}th{background:#f3f4f6;text-align:left}
.ok{color:var(--ok);font-weight:800} .warn{color:var(--warn);font-weight:800} .hidden{display:none!important}
@media print{.left,.tabs,.screen-only{display:none!important} .app{display:block;padding:0} .right{padding:0} .page{display:block!important;border:none;min-height:auto;page-break-after:always} }
@media (max-width:1000px){.app{grid-template-columns:1fr} .left{position:static;height:auto} .page{min-height:auto;padding:18px} .title-main{font-size:24px} .reading,.question{font-size:15px} }
</style>
</head>
<body>
<div class="app">
<aside class="panel left">
<h1>長文読解問題作成アプリ</h1>
<div class="desc">
      壊れた版を継ぎ足さず、<strong>安定動作優先</strong>で作り直した版です。<br/>
      本文は<strong>許可語彙セットから先に組む</strong>方式で、未習語が出たら必ず注に出します。<br/>
      本文IDと問題セットIDは分離し、DBはブラウザ内に保存します。
    </div>
<div class="sec">1. 条件</div>
<div class="grid2">
<div class="field"><label for="textbook">教科書</label><select id="textbook"></select></div>
<div class="field"><label for="grade">学年</label><select id="grade"><option value="1">中1</option><option value="2">中2</option><option value="3">中3</option></select></div>
</div>
<div class="grid2">
<div class="field"><label for="period">時期</label><select id="period"><option value="4-6月">4〜6月</option><option value="7-8月">7〜8月</option><option value="9-10月">9〜10月</option><option value="11-12月">11〜12月</option><option value="1-3月">1〜3月</option></select></div>
<div class="field"><label for="pattern">出題型</label><select id="pattern"><option value="diary">日記・体験記</option><option value="notice">案内・お知らせ</option><option value="email">メール・会話</option><option value="report">説明文・レポート</option></select></div>
</div>
<div class="grid2">
<div class="field"><label for="major">大単元</label><select id="major"></select></div>
<div class="field"><label for="section">単元</label><select id="section"></select></div>
</div>
<div class="grid3">
<div class="field"><label for="targetWords">目標語数</label><input id="targetWords" type="number"/></div>
<div class="field"><label for="questionCount">問題数</label><input id="questionCount" type="number"/></div>
<div class="field"><label for="maxNotes">注の上限</label><input id="maxNotes" type="number"/></div>
</div>
<div class="sec">2. 使用語彙</div>
<div class="small">この単元までの語彙を順番通りに並べます。本文はこの許可語彙を優先して作ります。</div>
<div class="btns" style="margin-top:8px">
<button class="ghost" id="selectRecommendedBtn" type="button">推奨語を選択</button>
<button class="ghost" id="selectAllBtn" type="button">全部選択</button>
<button class="secondary" id="clearWordsBtn" type="button">解除</button>
<button class="secondary" id="showAllowedBtn" type="button">許可語を再表示</button>
</div>
<div class="word-box" id="wordChecklist"></div>
<div class="sec">3. 本文生成とDB</div>
<div class="btns">
<button class="primary" id="previewBtn">本文を作る</button>
<button class="blue" id="registerBtn">DBに登録</button>
<button class="secondary" id="randomBtn">条件でDB表示</button>
<button class="secondary" id="newSetBtn">同じ本文で別問題セット</button>
</div>
<div class="sec">4. IDで開く</div>
<div class="grid2">
<div class="field" style="margin-top:0"><label for="masterIdInput">本文ID / 問題セットID</label><input id="masterIdInput" placeholder="RM-0001 / QS-0001-A" type="text"/></div>
<div class="field" style="margin-top:28px"><button class="ghost" id="openIdBtn" type="button">開く</button></div>
</div>
<div class="sec">5. DBメンテ</div>
<div class="btns">
<button class="secondary" id="exportDbBtn" type="button">DBを書き出し</button>
<button class="danger" id="resetDbBtn" type="button">DB初期化</button>
</div>
<div class="summary-box" id="summaryBox" style="margin-top:12px"></div>
<div class="status-box" id="statusBox" style="margin-top:12px"><strong>状態</strong><br/>起動しました。</div>
</aside>
<main class="panel right">
<div class="tabs screen-only">
<div class="tab active" data-page="passagePage">本文</div>
<div class="tab" data-page="questionPage">問題</div>
<div class="tab" data-page="slashPage">英文解釈</div>
<div class="tab" data-page="answerPage">解答・解説</div>
<div class="tab" data-page="dbPage">DB一覧</div>
</div>
<section class="page active" id="passagePage"></section>
<section class="page" id="questionPage"></section>
<section class="page" id="slashPage"></section>
<section class="page" id="answerPage"></section>
<section class="page" id="dbPage"></section>
</main>
</div>

function smartJ(rows,key,fallback){return (rows[key]&&rows[key].length?rows[key][0].japanese:fallback);}
function buildPassage(cfg, rows){const b=bucket(rows); const person=smart(b,'people','my friend'); const personJ=smartJ(b,'people','私の友だち'); const place=smart(b,'places','school'); const placeJ=smartJ(b,'places','学校'); const act=smart(b,'activities','study'); const actJ=smartJ(b,'activities','勉強する'); const obj=smart(b,'objects','book'); const objJ=smartJ(b,'objects','本'); const time=smart(b,'times','today'); const timeJ=smartJ(b,'times','今日'); const qual=smart(b,'qualities','interesting'); const qualJ=smartJ(b,'qualities','おもしろい'); const role=(String(cfg.grade)==='1' && cfg.period==='4-6月')?'I':'We'; const roleJ=(role==='I')?'私は':'私たちは'; const patterns={ diary:[{en:`${time} , ${role.toLowerCase()} go to ${place} .`,jp:`${timeJ}、${roleJ}${placeJ}へ行きます。`},{en:`${role} ${act} with ${person} .`,jp:`${roleJ}${personJ}と${actJ}します。`},{en:`${role} use ${obj} there .`,jp:`${roleJ}そこで${objJ}を使います。`},{en:`${place} is ${qual} for us .`,jp:`${placeJ}は私たちにとって${qualJ}です。`},{en:`After that , ${role.toLowerCase()} talk about the day .`,jp:`そのあと、${roleJ}その日のことを話します。`},{en:`It is a good time for us .`,jp:`それは私たちにとってよい時間です。`}], notice:[{en:`This is a notice about ${place} .`,jp:`これは${placeJ}についてのお知らせです。`},{en:`${time} , we will use ${obj} there .`,jp:`${timeJ}、私たちはそこで${objJ}を使います。`},{en:`You can ${act} with ${person} .`,jp:`あなたは${personJ}と${actJ}できます。`},{en:`The place is ${qual} and safe .`,jp:`その場所は${qualJ}で安全です。`},{en:`Please come to ${place} after school .`,jp:`放課後に${placeJ}へ来てください。`},{en:`We hope you will enjoy it .`,jp:`楽しんでもらえたらうれしいです。`}], email:[{en:`Hello . This is my e-mail about ${place} .`,jp:`こんにちは。これは${placeJ}についての私のメールです。`},{en:`${time} , I went there with ${person} .`,jp:`${timeJ}、私は${personJ}とそこへ行きました。`},{en:`We ${act} and used ${obj} .`,jp:`私たちは${actJ}して、${objJ}を使いました。`},{en:`The time there was ${qual} .`,jp:`そこでの時間は${qualJ}でした。`},{en:`I want to go there again .`,jp:`私はまたそこへ行きたいです。`},{en:`Please write to me soon .`,jp:`ぜひまたすぐに返事を書いてください。`}], report:[{en:`This report is about ${place} .`,jp:`このレポートは${placeJ}についてです。`},{en:`Many students ${act} there .`,jp:`多くの生徒がそこで${actJ}します。`},{en:`They often use ${obj} and work with ${person} .`,jp:`彼らはよく${objJ}を使い、${personJ}と活動します。`},{en:`For them , the place is ${qual} .`,jp:`彼らにとって、その場所は${qualJ}です。`},{en:`${time} is a good time to visit it .`,jp:`${timeJ}はそこを訪れるのによい時です。`},{en:`I think this activity helps our school life .`,jp:`私はこの活動が学校生活に役立つと思います。`}] }; const base=patterns[cfg.pattern]||patterns.diary; const count=Math.min(base.length, cfg.profile.sentenceCount); const chosen=base.slice(0,count); const passage=chosen.map(x=>x.en).join(' '); const translation=chosen.map(x=>x.jp).join(''); const wordCount=passage.trim().split(/\s+/).length; return {sentences:chosen, text:passage, translation, wordCount, facts:{person,personJ,place,placeJ,act,actJ,obj,objJ,time,timeJ,qual,qualJ}};}
function noteList(text, selectedMap, allowedMap, maxNotes){const tokens=(text.match(/[A-Za-z][A-Za-z'.-]*/g)||[]).map(normalize).filter(Boolean); const notes=[]; const seen=new Set(); for(const t of tokens){ if(seen.has(t)) continue; seen.add(t); if(CORE_WORDS.has(t)||SURFACE_SAFE.has(t)) continue; if(selectedMap.has(t)) continue; if(allowedMap.has(t)) continue; notes.push({word:t, meaning:'注が必要な語'}); if(notes.length>=maxNotes) break; } return notes;}
function buildQuestionSet(master, mode){
  const f = master.facts;
  const qs = [];
  const count = master.questionCount;
  const variants = {
    A:['本文の内容に合うものを選びなさい。','日本語で答えなさい。','英語で書きなさい。','本文から抜き出しなさい。','内容一致の正誤を答えなさい。','理由を日本語で答えなさい。'],
    B:['内容に合わないものを選びなさい。','日本語で書きなさい。','英語で答えなさい。','本文中の語を使いなさい。','英問英答で答えなさい。','要点を日本語で書きなさい。']
  };
  const head = variants[mode] || variants.A;
  qs.push({type:'choice', prompt:`1. ${head[0]}`, choices:[`${f.timeJ}にその場所へ行く。`,`その場所は${f.qualJ}である。`,`${f.objJ}を全く使わない。`,`${f.personJ}と関わる。`], answer:'2', explain:`本文では「${f.placeJ}は${f.qualJ}」と書かれている。`});
  if(count>=2) qs.push({type:'jp', prompt:'2. 本文では、だれと関わっていますか。', answer:f.personJ, explain:`本文中の ${f.person} に対応する日本語。`});
  if(count>=3) qs.push({type:'en', prompt:'3. 本文では、どこについて書かれていますか。英語で答えなさい。', answer:f.place, explain:`中心語は本文中の ${f.place}。`});
  if(count>=4) qs.push({type:'pick', prompt:'4. 本文で使われている活動を一つ、英語で抜き出しなさい。', answer:f.act, explain:'本文の行動語を抜き出す。'});
  if(count>=5) qs.push({type:'tf', prompt:'5. 次の文は本文と合っていますか。 The place is important for the writer.', answer:'合う', explain:'本文ではその場所が筆者たちにとってよい・大切な場所として述べられている。'});
  if(count>=6) qs.push({type:'why', prompt:'6. 筆者がその場所をよいと思う理由を、日本語で簡単に書きなさい。', answer:`${f.personJ}と${f.actJ}でき、${f.objJ}も使えるから。`, explain:'本文の情報を二つつなげればよい。'});
  return qs.slice(0,count);
}
function slashSentence(en,jp){const parts=en.replace(/\s+,/g,',').split(/\s+(because|when|after|before|with|for|to|and|but)\s+/i); let out=''; for(let i=0;i<parts.length;i++){const p=parts[i].trim(); if(!p) continue; out += (out?' / ':'') + p; } return {en:out, jp};}
function makeMaster(cfg, selectedRowsList){const selMap=allowMap(selectedRowsList); const allowAll=broaderMap(cfg); const passage=buildPassage(cfg, selectedRowsList); const notes=noteList(passage.text, selMap, allowAll, cfg.maxNotes); return {textbook:cfg.textbook, grade:cfg.grade, period:cfg.period, major:cfg.major, section:cfg.section, pattern:cfg.pattern, targetWords:cfg.targetWords, questionCount:cfg.questionCount, maxNotes:cfg.maxNotes, wordCount:passage.wordCount, text:passage.text, translation:passage.translation, sentences:passage.sentences, notes, facts:passage.facts};}
function registerMaster(db, master, mode){const next=db.masters.length+1; const masterId=toId(next,'RM'); const full={...master, masterId, createdAt:new Date().toISOString()}; db.masters.push(full); const set=registerSet(db, full, mode); return {master:full,set};}
function registerSet(db, master, mode){const existing=db.sets.filter(s=>s.masterId===master.masterId).length; const label=String.fromCharCode(65+existing); const setId=`QS-${master.masterId.split('-')[1]}-${label}`; const set={setId, masterId:master.masterId, mode:label, questions:buildQuestionSet(master,label), createdAt:new Date().toISOString()}; db.sets.push(set); return set;}
function openMaster(master,set){STATE.current=master; STATE.currentSet=set; STATE.preview=null; renderAll();}
function currentDisplay(){return STATE.current||STATE.preview;}
function currentSetDisplay(){return STATE.currentSet || (STATE.preview ? {questions:buildQuestionSet(STATE.preview,'A'), setId:'未登録プレビュー'} : null);}
function renderSummary(){const cfg=currentCfg(); const db=loadDb(); const disp=currentDisplay(); let html=`<strong>基準</strong><br>教科書: ${esc(cfg.textbook)} / 学年: 中${esc(cfg.grade)} / 時期: ${esc(cfg.period)}<br>大単元: ${esc(cfg.major)} / 単元: ${esc(cfg.section)}<br>DB本文数: ${db.masters.length} / 問題セット数: ${db.sets.length}`; if(disp) html += `<br><br><strong>現在表示</strong><br>本文ID: ${esc(disp.masterId||'未登録')} / 語数: ${disp.wordCount} / 問題数: ${disp.questionCount} / 注: ${disp.notes.length}`; document.getElementById('summaryBox').innerHTML=html;}
function renderPassagePage(){const d=currentDisplay(); const page=document.getElementById('passagePage'); if(!d){page.innerHTML='<div class="title-main">本文はまだ作成されていません。</div><div class="card">左の「本文を作る」を押してください。</div>'; return;} const notes=d.notes.map(n=>`<li><strong>${esc(n.word)}</strong> : ${esc(n.meaning)}</li>`).join(''); page.innerHTML=`<div class="headrow"><div><div class="title-main">長文読解問題</div><div class="meta">本文ID: ${esc(d.masterId||'未登録')}<br>教科書: ${esc(d.textbook)} / 中${esc(d.grade)} / ${esc(d.period)}<br>単元: ${esc(d.section)}</div></div><div class="meta">語数: ${d.wordCount}<br>注: ${d.notes.length}</div></div><div class="bar">本文</div><div class="reading">${esc(d.text)}</div><div class="bar">注</div><div class="card">${d.notes.length?`<ul class="note-list">${notes}</ul>`:'未習語注はありません。'}</div>`;}
function renderQuestionPage(){
  const d=currentDisplay(), s=currentSetDisplay();
  const page=document.getElementById('questionPage');
  if(!d||!s){ page.innerHTML='<div class="title-main">問題はまだ作成されていません。</div>'; return; }
  page.innerHTML=`<div class="headrow"><div><div class="title-main">問題</div><div class="meta">問題セットID: ${esc(s.setId||'未登録')}<br>本文ID: ${esc(d.masterId||'未登録')}</div></div></div><div class="bar">設問</div>${s.questions.map(q=>`<div class="question">${esc(q.prompt).split('\n').join('<br>')}${q.choices?'<div class="card">'+q.choices.map((c,i)=>`${i+1}. ${esc(c)}`).join('<br>')+'</div>':''}</div>`).join('')}`;
}
function renderSlashPage(){const d=currentDisplay(); const page=document.getElementById('slashPage'); if(!d){page.innerHTML='<div class="title-main">英文解釈はまだありません。</div>'; return;} page.innerHTML=`<div class="title-main">英文解釈</div><div class="meta">スラッシュリーディング＋実際の読み方</div>${d.sentences.map((s,i)=>{const sl=slashSentence(s.en,s.jp); return `<div class="card"><div><strong>${i+1}.</strong> ${esc(sl.en)}</div><div style="margin-top:8px">${esc(sl.jp)}</div></div>`;}).join('')}`;}
function renderAnswerPage(){const d=currentDisplay(), s=currentSetDisplay(); const page=document.getElementById('answerPage'); if(!d||!s){page.innerHTML='<div class="title-main">解答はまだありません。</div>'; return;} page.innerHTML=`<div class="title-main">解答・解説・全訳</div><div class="bar">解答</div>${s.questions.map((q,i)=>`<div class="card"><strong>${i+1}.</strong> ${q.type==='choice' ? '2' : esc(q.answer)}<div style="margin-top:6px">${esc(q.explain)}</div></div>`).join('')}<div class="bar">全訳</div><div class="card">${esc(d.translation)}</div>`;}
function renderDbPage(){const db=loadDb(); const page=document.getElementById('dbPage'); page.innerHTML=`<div class="headrow"><div><div class="title-main">DB一覧</div><div class="meta">本文マスターと問題セットを分けて管理しています。</div></div></div><div class="db-table-wrap"><table><thead><tr><th>本文ID</th><th>教科書</th><th>学年</th><th>時期</th><th>単元</th><th>語数</th><th>操作</th></tr></thead><tbody>${db.masters.map(m=>`<tr><td>${esc(m.masterId)}</td><td>${esc(m.textbook)}</td><td>中${esc(m.grade)}</td><td>${esc(m.period)}</td><td>${esc(m.section)}</td><td>${m.wordCount}</td><td><button class="ghost open-master" data-id="${esc(m.masterId)}">開く</button></td></tr>`).join('') || '<tr><td colspan="7">まだ登録はありません。</td></tr>'}</tbody></table></div><div class="bar">問題セット</div><div class="db-table-wrap"><table><thead><tr><th>問題セットID</th><th>本文ID</th><th>種別</th><th>作成日時</th></tr></thead><tbody>${db.sets.map(s=>`<tr><td>${esc(s.setId)}</td><td>${esc(s.masterId)}</td><td>${esc(s.mode)}</td><td>${esc((s.createdAt||'').slice(0,16).replace('T',' '))}</td></tr>`).join('') || '<tr><td colspan="4">まだ問題セットはありません。</td></tr>'}</tbody></table></div>`; page.querySelectorAll('.open-master').forEach(btn=>btn.addEventListener('click',()=>{const id=btn.dataset.id; const db=loadDb(); const m=db.masters.find(x=>x.masterId===id); const s=db.sets.find(x=>x.masterId===id); if(m){openMaster(m,s||null); activateTab('passagePage');} }));}
function renderAll(){renderPassagePage(); renderQuestionPage(); renderSlashPage(); renderAnswerPage(); renderDbPage(); renderSummary();}
function activateTab(pageId){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); const tab=document.querySelector(`.tab[data-page="${pageId}"]`); if(tab) tab.classList.add('active'); const page=document.getElementById(pageId); if(page) page.classList.add('active');}
function doPreview(){const cfg=currentCfg(); const selected=selectedRows(); const master=makeMaster(cfg, selected); STATE.preview=master; STATE.current=null; STATE.currentSet=null; renderAll(); activateTab('passagePage'); status('本文プレビューを作成しました。');}
function doRegister(){const cfg=currentCfg(); const db=loadDb(); const selected=selectedRows(); const draft=makeMaster(cfg, selected); const pair=registerMaster(db, draft, 'A'); saveDb(db); STATE.preview=null; openMaster(pair.master, pair.set); activateTab('passagePage'); status(`DBに登録しました。本文ID: ${pair.master.masterId} / 問題セットID: ${pair.set.setId}`);}
function doRandom(){const cfg=currentCfg(); const db=loadDb(); const candidates=db.masters.filter(m=>(!cfg.textbook||m.textbook===cfg.textbook)&&(!cfg.grade||m.grade===cfg.grade)&&(!cfg.period||m.period===cfg.period)&&(!cfg.section||m.section===cfg.section)); if(!candidates.length){status('条件に合うDB本文がありません。'); return;} const master=candidates[Math.floor(Math.random()*candidates.length)]; const set=db.sets.find(s=>s.masterId===master.masterId)||null; openMaster(master,set); activateTab('passagePage'); status(`DBから本文を開きました。本文ID: ${master.masterId}`);}
function doNewSet(){const db=loadDb(); const m=STATE.current; if(!m || !m.masterId){status('DB登録済みの本文を先に開いてください。'); return;} const set=registerSet(db, m, 'B'); saveDb(db); STATE.currentSet=set; renderAll(); activateTab('questionPage'); status(`別問題セットを追加しました。問題セットID: ${set.setId}`);}
function doOpenById(){const id=document.getElementById('masterIdInput').value.trim(); const db=loadDb(); if(!id){status('IDを入力してください。'); return;} if(id.startsWith('RM-')){const m=db.masters.find(x=>x.masterId===id); if(!m){status('その本文IDはありません。'); return;} const s=db.sets.find(x=>x.masterId===id)||null; openMaster(m,s); activateTab('passagePage'); status(`本文ID ${id} を開きました。`); return;} if(id.startsWith('QS-')){const s=db.sets.find(x=>x.setId===id); if(!s){status('その問題セットIDはありません。'); return;} const m=db.masters.find(x=>x.masterId===s.masterId); if(!m){status('対応する本文が見つかりません。'); return;} openMaster(m,s); activateTab('questionPage'); status(`問題セットID ${id} を開きました。`); return;} status('RM- または QS- から始まるIDを入力してください。');}
function doExport(){const db=loadDb(); const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='reading_db_export_20260415.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); status('DBを書き出しました。');}
function doResetDb(){saveDb({masters:[],sets:[]}); STATE.current=null; STATE.currentSet=null; STATE.preview=null; renderAll(); status('DBを初期化しました。');}
function bind(){document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>activateTab(tab.dataset.page))); document.getElementById('textbook').addEventListener('change',refreshControls); document.getElementById('grade').addEventListener('change',refreshControls); document.getElementById('period').addEventListener('change',refreshControls); document.getElementById('major').addEventListener('change',()=>{setSelectOptions('section', sectionsFor(document.getElementById('textbook').value, document.getElementById('grade').value, document.getElementById('major').value), false); refreshAllowedWords(); renderSummary();}); document.getElementById('section').addEventListener('change',()=>{refreshAllowedWords(); renderSummary();}); document.getElementById('selectRecommendedBtn').addEventListener('click',()=>refreshAllowedWords('recommended')); document.getElementById('selectAllBtn').addEventListener('click',()=>refreshAllowedWords('all')); document.getElementById('clearWordsBtn').addEventListener('click',()=>refreshAllowedWords('clear')); document.getElementById('showAllowedBtn').addEventListener('click',()=>refreshAllowedWords()); document.getElementById('previewBtn').addEventListener('click',doPreview); document.getElementById('registerBtn').addEventListener('click',doRegister); document.getElementById('randomBtn').addEventListener('click',doRandom); document.getElementById('newSetBtn').addEventListener('click',doNewSet); document.getElementById('openIdBtn').addEventListener('click',doOpenById); document.getElementById('masterIdInput').addEventListener('keydown',e=>{ if(e.key==='Enter') doOpenById(); }); document.getElementById('exportDbBtn').addEventListener('click',doExport); document.getElementById('resetDbBtn').addEventListener('click',doResetDb); }
function init(){bind(); refreshControls(); renderAll(); status('起動しました。本文作成ボタンを押すと、許可語彙から本文を組み立てます。');}
init();
</script>
