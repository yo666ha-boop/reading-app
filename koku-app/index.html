<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>国語トレーニング v3</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#222;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #ddd;padding:12px 16px}main{max-width:980px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}label{font-size:13px;color:#555}select,input,textarea,button{font:inherit}select,input,textarea{width:100%;padding:10px;border:1px solid #bbb;border-radius:8px;background:#fff}textarea{min-height:110px}button{border:0;border-radius:9px;padding:10px 14px;background:#222;color:#fff;cursor:pointer}.sub{background:#fff;color:#222;border:1px solid #aaa}.choices button{display:block;width:100%;text-align:left;margin:7px 0;background:#fff;color:#222;border:1px solid #bbb}.choices button.sel{outline:3px solid #222}.muted{color:#666;font-size:13px}.ok{color:#087b35;font-weight:700}.ng{color:#b00020;font-weight:700}.passage{white-space:pre-wrap;line-height:1.9}.hidden{display:none}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:12px;padding:4px 7px;border-radius:999px;background:#eef0f3}.teacher-tools{display:flex;gap:8px;align-items:end;margin-top:10px}.teacher-tools>div{flex:1}@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}main{padding:10px}.card{padding:13px}.teacher-tools{display:block}.teacher-tools button{margin-top:8px;width:100%}}
@media print{header,.controls,.answer-actions,.teacher-tools{display:none!important}body{background:#fff}.card{border:0;break-inside:avoid}}
</style></head><body>
<header><b>国語トレーニング</b> <span id="count" class="muted"></span></header>
<main>
<section class="card controls">
<div class="grid">
<div><label>セット</label><select id="set"><option value="">すべて</option></select></div>
<div><label>技能</label><select id="skill"><option value="">すべて</option></select></div>
<div><label>難度</label><select id="diff"><option value="">すべて</option></select></div>
<div><label>出題順</label><select id="order"><option value="seq">順番</option><option value="random">ランダム</option><option value="weak">苦手優先</option></select></div>
</div>
<p><button id="start">出題開始</button> <button id="review" class="sub">復習対象</button> <button id="teacher" class="sub">教師モード</button> <button id="weakBtn" class="sub">弱点診断</button></p>
<div id="teacherTools" class="teacher-tools hidden"><div><label>問題ID検索</label><input id="pid" placeholder="例 KOKU-SEL-B1-001"></div><button id="pidGo" class="sub">開く</button><button id="printBtn" class="sub">印刷</button></div>
</section>
<section id="problem" class="hidden">
<div class="card"><div class="tags" id="meta"></div><h2 id="ptitle"></h2><div id="passage" class="passage"></div></div>
<div class="card"><h3 id="question"></h3><div id="answer"></div><div class="answer-actions"><p><button id="submit">採点する</button> <button id="next" class="sub">次の問題</button></p></div></div>
<div id="result" class="card hidden"></div>
</section>
<section id="weakness" class="card hidden"></section>
</main>
<script src="boot.js"></script>
</body></html>
