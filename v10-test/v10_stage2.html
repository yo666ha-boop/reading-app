<script>
const DATASETS={'1':{'サンシャイン':window.V10_SUNSHINE_G1||{},'ニューホライズン':window.V10_NEWHORIZON_G1||{}},'2':{'サンシャイン':window.V10_PASSAGES_G2_SS||{},'ニューホライズン':window.V10_PASSAGES_G2_NH||{}},'3':{'サンシャイン':window.V10_PASSAGES_G3_SS||{},'ニューホライズン':window.V10_PASSAGES_G3_NH||{}}};
const META=window.V10_INTERACTION_META||{};let current=null,currentKey='',setIndex=0;const $=id=>document.getElementById(id);function majorOf(s){const m=s.match(/(?:PROGRAM|Unit)\s*([0-9]+)/i);return m?m[1]:s.split(/\s*[-/]\s*/)[0]}function entries(){return Object.entries(DATASETS[$('grade').value][$('textbook').value]||{})}function refreshMajor(){const vals=[...new Set(entries().map(([k])=>majorOf(k)))];$('major').innerHTML=vals.map(v=>`<option>${v}</option>`).join('');refreshSection()}function refreshSection(){const m=$('major').value,ks=entries().map(([k])=>k).filter(k=>majorOf(k)===m);$('section').innerHTML=ks.map(k=>`<option>${k}</option>`).join('');render()}function choose(){const ds=DATASETS[$('grade').value][$('textbook').value]||{},k=$('section').value,p=$('pattern').value;let keys=Object.keys(ds).filter(x=>majorOf(x)===$('major').value);const upto=keys.indexOf(k);if(upto>=0)keys=keys.slice(0,upto+1);if(p!=='all'){const f=keys.filter(x=>(META[$('textbook').value+'|'+x]?.genre||'')===p);if(f.length)keys=f}const key=keys[keys.length-1]||k;current=ds[key];currentKey=key;return current}function render(){const d=choose();if(!d)return;const meta=META[$('textbook').value+'|'+currentKey]||{};const qs=setIndex%2&&meta.questionSetB?meta.questionSetB:d.questions||[];$('passage').innerHTML=`<h2>${d.title}</h2><div class="meta">${d.id} / ${d.textbook} / 中${d.grade} / ${d.section}</div><div class="en">${d.sentences.join(' ')}</div><h3>自然な全訳</h3><div>${d.fullTranslation}</div>`;$('slash').innerHTML='<h2>英文解釈</h2>'+d.slashRows.map(r=>`<div class="slash"><div class="enline">${r.en}</div><div class="jpline">${r.jp}</div></div>`).join('');$('questions').innerHTML='<h2>問題</h2>'+qs.map((x,i)=>`<div class="q">${i+1}. ${x.prompt.replace(/^\d+\.\s*/,'')}</div>`).join('');$('answers').innerHTML='<h2>解答・解説</h2>'+qs.map((x,i)=>`<div class="q"><b>${i+1}. ${x.answer}</b><div class="evidence">根拠英文：${x.evidence}<br>根拠の意味：${x.evidenceJp}<br>なぜ：${x.reason}</div></div>`).join('');$('audit').innerHTML=`<h2>品質監査</h2><span class="badge">監修済み</span><div class="meta">本文文数=${d.sentences.length} / スラッシュ行数=${d.slashRows.length}<br>${d.auditNote||''}</div>`}
['textbook','grade'].forEach(id=>$(id).addEventListener('change',refreshMajor));$('major').addEventListener('change',refreshSection);$('section').addEventListener('change',()=>{setIndex=0;render()});$('pattern').addEventListener('change',render);$('altSetBtn').addEventListener('click',()=>{setIndex++;render()});$('printBtn').addEventListener('click',()=>window.print());document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tabpage').forEach(x=>x.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden')}));refreshMajor();
</script></body></html>
