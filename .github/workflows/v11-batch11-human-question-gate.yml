name: v11 Batch11 human question gate
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch11_question_human_rewrite_r*.js'
      - 'v11_batch11_human_question_gate.js'
      - '.github/workflows/v11-batch11-human-question-gate.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run final human question gate
        run: node v11_batch11_human_question_gate.js
      - name: Persist gate report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f V11_BATCH11_HUMAN_QUESTION_GATE.json || true
          git diff --cached --quiet || git commit -m "v11: persist Batch11 human question gate [skip ci]"
          for n in 1 2 3; do
            git pull --rebase origin v11-1000passage-easy-notes && git push origin HEAD:v11-1000passage-easy-notes && exit 0
            sleep $((n*2))
          done
          exit 1
