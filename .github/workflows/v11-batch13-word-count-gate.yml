name: V11 Batch13 Word Count Gate
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch13_word_count_gate.js'
      - 'v11_batch13_build_final_candidate.js'
      - '.github/workflows/v11-batch13-word-count-gate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  word-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Batch13 word-count gate
        id: audit
        shell: bash
        run: |
          set +e
          node v11_batch13_word_count_gate.js
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist report safely
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f V11_BATCH13_WORD_COUNT_GATE.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "v11: persist Batch13 word-count gate"
          git pull --rebase origin v11-1000passage-easy-notes
          git push origin HEAD:v11-1000passage-easy-notes
      - name: Enforce word-count gate
        if: always()
        run: test "${{ steps.audit.outputs.rc }}" = "0"
