name: v11 Batch12 slash boundary repairs
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch12_apply_slash_boundary_repairs.js'
      - '.github/workflows/v11-batch12-slash-boundary-repairs.yml'
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply human slash-boundary repairs
        run: node v11_batch12_apply_slash_boundary_repairs.js
      - name: Persist repaired Batch12 draft
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f v11_batch12_assembled_draft.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'bot: persist Batch12 human slash-boundary repairs [skip ci]'
          git push