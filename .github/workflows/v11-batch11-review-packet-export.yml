name: v11 Batch11 review packet export
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch11_review_packet_export.js'
      - '.github/workflows/v11-batch11-review-packet-export.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node v11_batch11_review_packet_export.js
      - name: Persist packets safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f V11_BATCH11_REVIEW_PACKET_*.json
          git diff --cached --quiet || git commit -m "v11: persist Batch11 review packets"
          for n in 1 2 3; do
            git pull --rebase origin v11-1000passage-easy-notes && git push origin HEAD:v11-1000passage-easy-notes && exit 0
            sleep $((n*2))
          done
          exit 1
