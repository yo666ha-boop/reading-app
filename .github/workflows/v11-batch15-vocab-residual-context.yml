name: v11 Batch15 vocab residual context
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths: ['v11_batch15_vocab_residual_context.js','.github/workflows/v11-batch15-vocab-residual-context.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: v11-1000passage-easy-notes, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node v11_batch15_vocab_residual_context.js | tee v11_batch15_vocab_residual_context.log
      - run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f v11_batch15_vocab_residual_context_*.json v11_batch15_vocab_residual_context.log
          if ! git diff --cached --quiet; then
            git commit -m 'audit(v11): persist Batch15 residual vocabulary contexts [skip ci]'
            for attempt in 1 2 3; do
              if git push origin HEAD:v11-1000passage-easy-notes; then exit 0; fi
              git fetch origin v11-1000passage-easy-notes
              git rebase origin/v11-1000passage-easy-notes
            done
            exit 1
          fi
