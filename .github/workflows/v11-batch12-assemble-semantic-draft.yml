name: v11 Batch12 assemble semantic draft
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch12_authoring_plan.json'
      - 'v11_batch12_g1_body_draft.json'
      - 'v11_batch12_g2_body_draft.json'
      - 'v11_batch12_g3_body_draft.json'
      - 'v11_batch12_body_semantic_repair_r1.json'
      - 'v11_batch12_assemble_semantic_draft.js'
      - '.github/workflows/v11-batch12-assemble-semantic-draft.yml'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assemble repaired 50-passage draft
        run: node v11_batch12_assemble_semantic_draft.js
      - name: Persist assembled draft
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f v11_batch12_assembled_draft.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'bot: persist Batch12 assembled semantic draft [skip ci]'
          git push
