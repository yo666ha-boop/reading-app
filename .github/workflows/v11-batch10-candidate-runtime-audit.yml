name: v11 Batch10 candidate runtime audit
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch10_candidate_runtime_audit.js'
      - 'v11_batch10_human_semantic_review_r1.js'
      - 'v11_batch10_question_human_rewrite.js'
      - 'v11_batch10_question_human_rewrite_r2.js'
      - 'v11_batch10_vocab_residual_r2_apply.js'
      - '.github/workflows/v11-batch10-candidate-runtime-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Run candidate audit
        id: candidate
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/v11-b10-candidate-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          set +e
          node v11_batch10_candidate_runtime_audit.js 2>&1 | tee V11_BATCH10_CANDIDATE_RUNTIME_LOG.txt
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist runtime log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f V11_BATCH10_CANDIDATE_RUNTIME_LOG.txt
          if [ -f V11_BATCH10_CANDIDATE_RUNTIME_AUDIT.json ]; then git add -f V11_BATCH10_CANDIDATE_RUNTIME_AUDIT.json; fi
          git diff --cached --quiet || git commit -m "v11: persist Batch10 candidate runtime result"
          for n in 1 2 3; do
            git pull --rebase origin v11-1000passage-easy-notes && git push origin HEAD:v11-1000passage-easy-notes && exit 0
            sleep $((n*2))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-batch10-candidate-runtime
          path: |
            V11_BATCH10_CANDIDATE_RUNTIME_AUDIT.json
            V11_BATCH10_CANDIDATE_RUNTIME_LOG.txt
            /tmp/v11-b10-candidate-a4/*.pdf
          if-no-files-found: warn
      - name: Enforce candidate gate
        if: always()
        run: test "${{ steps.candidate.outputs.rc }}" = "0"
