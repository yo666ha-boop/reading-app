name: V11 Batch13 Candidate Runtime Audit
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch11_bootstrap.js'
      - 'v11_batch12_bootstrap.js'
      - 'v11_batch13_build_runtime_bundle.js'
      - 'v11_batch13_register.js'
      - 'v11_batch13_candidate_runtime_audit.js'
      - 'v11_batch13_manual_gloss_r1.js'
      - 'v11_batch13_apply_prior_verified_gloss.js'
      - 'v11_batch13_slash_human_review_manifest.json'
      - '.github/workflows/v11-batch13-candidate-runtime-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  candidate-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build fail-closed Batch13 runtime bundle
        id: build
        shell: bash
        run: |
          set +e
          node v11_batch13_build_runtime_bundle.js |& tee V11_BATCH13_RUNTIME_BUNDLE_LOG.txt
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Install Playwright
        if: steps.build.outputs.rc == '0'
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start static server
        if: steps.build.outputs.rc == '0'
        run: python3 -m http.server 8000 >/tmp/v11-b13-candidate-http.log 2>&1 &
      - name: Run Batch13 full candidate runtime audit
        if: steps.build.outputs.rc == '0'
        id: audit
        shell: bash
        run: |
          set +e
          node v11_batch13_candidate_runtime_audit.js |& tee V11_BATCH13_CANDIDATE_RUNTIME_LOG.txt
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist actuals
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in \
            v11_batch13_runtime_bundle.js \
            V11_BATCH13_RUNTIME_BUNDLE_STATUS.json \
            V11_BATCH13_RUNTIME_BUNDLE_LOG.txt \
            V11_BATCH13_REQUIRED_GLOSS_FAIL.json \
            V11_BATCH13_CANDIDATE_RUNTIME_AUDIT.json \
            V11_BATCH13_CANDIDATE_RUNTIME_LOG.txt \
            v11_batch13_slash_human_gate.json \
            v11_batch13_slash_review_packet.json; do
            test -e "$f" && git add -f "$f"
          done
          git diff --cached --quiet || git commit -m 'v11: persist Batch13 818 candidate runtime actuals'
          git pull --rebase origin v11-1000passage-easy-notes
          git push origin HEAD:v11-1000passage-easy-notes
      - name: Enforce full candidate gate
        if: always()
        run: test "${{ steps.build.outputs.rc }}" = "0" -a "${{ steps.audit.outputs.rc }}" = "0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-batch13-candidate-runtime-audit
          path: |
            V11_BATCH13_RUNTIME_BUNDLE_STATUS.json
            V11_BATCH13_RUNTIME_BUNDLE_LOG.txt
            V11_BATCH13_REQUIRED_GLOSS_FAIL.json
            V11_BATCH13_CANDIDATE_RUNTIME_AUDIT.json
            V11_BATCH13_CANDIDATE_RUNTIME_LOG.txt
          if-no-files-found: warn
# rerun after preview-chain and persistent-runtime repair; persist each existing actual independently
