name: v10 slash quality
on:
  push:
    branches: [v10-slash-rebuild, v10-reference-slash-audit]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  slash-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --no-package-lock jsdom@24.1.3 playwright@1.55.0
      - name: Authoritative reference sample gate
        run: node v10_reference_slash_gate.js
      - name: Dump all current 168 slash rows for reference re-audit
        run: node v10_reference_runtime_dump.js
      - name: Existing semantic runtime regression
        run: node v10_semantic_runtime_audit.js
      - name: Legacy meaning-chunk slash quality gate
        run: node v10_slash_quality_audit.js
      - name: Consolidated 091-168 final audit coverage
        run: node v10_final_audit_091_168_static_test.js
      - name: Stage2 full 168 coverage
        run: node v10_stage2_full_coverage_test.js
      - name: Stage2 DOM regression
        run: node v10_stage2_dom_test.js
      - name: Install browser engines
        run: |
          npx playwright install-deps chromium firefox webkit
          npx playwright install chromium firefox webkit
      - name: Cross-browser and print validation
        run: node v10_final_browser_print_test.js
      - name: Public GitHub Pages runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-delay 5 https://yo666ha-boop.github.io/reading-app/v10_vocab_slash_manual_091_168.js -o /tmp/audit.js
          grep -q 'Expected 78 audited passages' /tmp/audit.js
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage();
            const errs=[];
            p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});
            p.on('pageerror',e=>errs.push(String(e)));
            const r=await p.goto('https://yo666ha-boop.github.io/reading-app/',{waitUntil:'networkidle',timeout:60000});
            if(!r||!r.ok())throw new Error('public page HTTP '+(r&&r.status()));
            await p.waitForFunction(()=>window.V10_RUNTIME_LOAD_PROGRESS==='complete',{timeout:60000});
            const state=await p.evaluate(()=>({progress:window.V10_RUNTIME_LOAD_PROGRESS,error:window.V10_RUNTIME_LOAD_ERROR||'',audit:window.V10_FINAL_AUDIT_091_168||null,title:document.title,body:document.body&&document.body.innerText.slice(0,200)}));
            console.log(JSON.stringify(state));
            if(state.error)throw new Error('runtime loader error '+state.error);
            if(!state.audit||state.audit.audited!==78)throw new Error('public audit marker missing');
            if(errs.length)throw new Error('public browser errors '+errs.join(' | '));
            await b.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
