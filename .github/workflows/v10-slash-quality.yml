name: v10 slash quality
on:
  push:
    branches: [v10-slash-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  slash-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --no-package-lock jsdom@24.1.3
      - name: Existing semantic runtime regression
        run: node v10_semantic_runtime_audit.js
      - name: Meaning-chunk slash quality gate
        run: node v10_slash_quality_audit.js
      - name: Stage2 full 168 coverage
        run: node v10_stage2_full_coverage_test.js
      - name: Stage2 DOM regression
        run: node v10_stage2_dom_test.js
