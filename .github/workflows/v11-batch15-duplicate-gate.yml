name: v11 Batch15 duplicate gate
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - '.github/workflows/v11-batch15-duplicate-gate.yml'
      - 'scripts/v11_batch15_duplicate_gate.js'
      - 'V11_BATCH15_*.js'
      - 'V11_BATCH15_*.json'
      - 'V11_BATCH15_*.txt'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: v11-1000passage-easy-notes, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: git pull --rebase origin v11-1000passage-easy-notes
      - name: Run Batch15 duplicate gate
        run: node scripts/v11_batch15_duplicate_gate.js
      - name: Persist duplicate gate
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V11_BATCH15_DUPLICATE_GATE_STATUS.txt V11_BATCH15_DUPLICATE_GATE_REPORT.json || true
          git diff --cached --quiet || git commit -m 'audit(v11): persist Batch15 duplicate gate'
          git pull --rebase origin v11-1000passage-easy-notes
          git push origin HEAD:v11-1000passage-easy-notes
