name: v11 Batch15 residual zero R4
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - '.github/workflows/v11-batch15-residual-zero-r4.yml'
permissions:
  contents: write
jobs:
  repair-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --package-lock=false jsdom@24
      - name: Apply residual repairs by actual report IDs
        run: |
          cat > /tmp/r4.js <<'NODE'
          'use strict';
          const fs=require('fs');
          const files=['v11_batch15_g1_body_draft.json','v11_batch15_g2_body_draft.json','v11_batch15_g3_body_draft.json'];
          const docs=files.map(f=>({f,d:JSON.parse(fs.readFileSync(f,'utf8'))}));
          function get(id){for(const x of docs){const p=(x.d.passages||[]).find(q=>q.id===id);if(p)return{x,p};}throw Error('missing id '+id)}
          const audit=[];
          function sub(id,re,to,label){const {p}=get(id);const before=p.body;const after=before.replace(re,to);if(after===before)throw Error('no change '+id+' '+label);p.body=after;p.humanSemanticReview=(p.humanSemanticReview||'')+'_R4_ZERO_EQUIV';p.translationSync=(p.translationSync||'')+'; R4 semantic-equivalent simplification checked against fullTranslation';audit.push({id,label,to,fullTranslationChecked:true});}
          sub('V11-B15-G1-004',/That clue pointed to the wrong choice\./,'That was the wrong choice.','clue+pointed');
          sub('V11-B15-G1-004',/She found the full answer in the note and the schedule\./,'The note and the schedule showed the full answer.','found');
          sub('V11-B15-G1-005',/the teacher[’']s choice/,'it','choice');
          sub('V11-B15-G1-008',/the area for other missing things/,'the room again','area+things');
          sub('V11-B15-G1-010',/to find the reason/,'for an answer','find+reason');
          sub('V11-B15-G1-015',/thought the arrow was part of a game/,'said, “This is for a game”','thought+part');
          sub('V11-B15-G1-016',/the situation/,'it','situation');
          sub('V11-B15-G1-017',/ quickly\b/,'','quickly');
          sub('V11-B15-G2-016',/\bweak\b/i,'not strong','weak');
          sub('V11-B15-G1-003',/The teacher asked Sora to take one folder from the classroom to the school office\./,'Sora took one folder from the classroom to the school office for the teacher.','ASK_TELL_WANT_O_TO');
          for(const x of docs)fs.writeFileSync(x.f,JSON.stringify(x.d,null,2)+'\n');
          fs.writeFileSync('V11_BATCH15_RESIDUAL_ZERO_R4_REPORT.json',JSON.stringify({generatedAt:new Date().toISOString(),edits:audit.length,principle:'actual residual IDs only; no allowlist weakening; no filler; translation semantics rechecked',audit},null,2)+'\n');
          console.log(JSON.stringify(audit,null,2));
          NODE
          node /tmp/r4.js
      - name: Run exact Batch15 chronology after R4
        id: gate
        continue-on-error: true
        run: node v11_batch15_chronology_audit.js
      - name: Persist R4 and refreshed chronology
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v11_batch15_g1_body_draft.json v11_batch15_g2_body_draft.json v11_batch15_g3_body_draft.json V11_BATCH15_RESIDUAL_ZERO_R4_REPORT.json
          for f in V11_BATCH15_CHRONOLOGY_STATUS.txt V11_BATCH15_VOCAB_CHRONOLOGY_REPORT.json V11_BATCH15_VOCAB_RESIDUAL_UNIQUE.txt V11_BATCH15_GRAMMAR_CANDIDATE_REPORT.json V11_BATCH15_GRAMMAR_CHRONOLOGY_REPORT.json V11_BATCH15_GRAMMAR_UNRESOLVED.txt; do [ -f "$f" ] && git add "$f" || true; done
          git commit -m 'repair(v11): resolve Batch15 vocab grammar residuals R4'
          git pull --rebase origin v11-1000passage-easy-notes
          git push origin HEAD:v11-1000passage-easy-notes
      - name: Fail closed if chronology still fails
        if: steps.gate.outcome == 'failure'
        run: exit 1
