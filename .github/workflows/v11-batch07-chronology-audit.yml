name: v11 Batch07 chronology audit
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch07_passages_draft_g1.js'
      - 'v11_batch07_g1_semantic_repair.js'
      - 'v11_batch07_passages_draft_g2.js'
      - 'v11_batch07_g2_semantic_repair.js'
      - 'v11_batch07_standard_draft_g3.js'
      - 'v11_batch07_standard_semantic_repair.js'
      - 'v11_batch07_long_draft_g3.js'
      - 'v11_batch07_long_semantic_repair.js'
      - 'v11_batch07_yamaguchi_exam_draft_g3.js'
      - 'v11_batch07_yamaguchi_semantic_repair.js'
      - 'v11_batch07_yamaguchi_exam_evidence_sync.js'
      - 'v11_batch07_chronology_audit.js'
      - '.github/workflows/v11-batch07-chronology-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node v11_batch07_chronology_audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-batch07-chronology
          path: |
            V11_BATCH07_VOCAB_CHRONOLOGY_REPORT.json
            V11_BATCH07_GRAMMAR_CANDIDATE_REPORT.json
            V11_BATCH07_GRAMMAR_CHRONOLOGY_REPORT.json
            V11_BATCH07_CHRONOLOGY_STATUS.txt
