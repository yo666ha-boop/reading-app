name: v11 Batch16 formal grammar chronology
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'scripts/v11_batch16_formal_grammar_chronology.js'
      - 'V11_BATCH16_BODY_TRANSLATION_DRAFT_G1_001_010.json'
      - 'V11_BATCH16_BODY_TRANSLATION_DRAFT_G1_011_017.json'
      - 'V11_BATCH16_BODY_TRANSLATION_DRAFT_G2_001_008.json'
      - 'V11_BATCH16_BODY_TRANSLATION_DRAFT_G2_009_017.json'
      - 'V11_BATCH16_BODY_TRANSLATION_DRAFT_G3_001_008.json'
      - 'V11_BATCH16_BODY_TRANSLATION_DRAFT_G3_009_016.json'
      - '.github/workflows/v11-batch16-formal-grammar.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run fail-closed Batch16 formal grammar chronology
        run: |
          set +e
          node scripts/v11_batch16_formal_grammar_chronology.js
          code=$?
          test -f V11_BATCH16_FORMAL_GRAMMAR_CHRONOLOGY_REPORT.json
          echo "audit_exit=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Persist formal report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V11_BATCH16_FORMAL_GRAMMAR_CHRONOLOGY_REPORT.json
          if git diff --cached --quiet; then
            echo 'No report change'
          else
            git commit -m 'audit(v11): persist Batch16 formal grammar chronology report [skip ci]'
            git push origin HEAD:v11-1000passage-easy-notes
          fi
      - name: Enforce formal gate
        run: |
          node - <<'NODE'
          const r=require('./V11_BATCH16_FORMAL_GRAMMAR_CHRONOLOGY_REPORT.json');
          console.log(JSON.stringify({passages:r.passages,detected:r.detectedOccurrences,unresolved:r.unresolvedOccurrences,future:r.futureGrammarLeak,finalPass:r.finalPass}));
          if(!r.finalPass) process.exit(2);
          NODE
