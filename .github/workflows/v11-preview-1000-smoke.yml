name: v11 Preview 1000 Smoke
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'scripts/v11_preview_1000_smoke.js'
      - '.github/workflows/v11-preview-1000-smoke.yml'
      - 'v11_batch16_register.js'
      - 'v11_final32_bootstrap.js'
      - 'v11_final32_runtime_bundle.js'
      - 'v11_final32_register.js'
      - '.github/workflows/v11-preview-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v11-preview-1000-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Verify public preview persistent 1000
        run: |
          EXPECTED_SOURCE_SHA="${GITHUB_SHA}" \
          V11_PREVIEW_URL="https://yo666ha-boop.github.io/reading-app/v11-preview/" \
          node scripts/v11_preview_1000_smoke.js
      - name: Persist smoke report
        if: always()
        run: |
          cp V11_PREVIEW_1000_SMOKE_REPORT.json /tmp/V11_PREVIEW_1000_SMOKE_REPORT.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for n in 1 2 3; do
            git fetch origin v11-1000passage-easy-notes
            git reset --hard origin/v11-1000passage-easy-notes
            cp /tmp/V11_PREVIEW_1000_SMOKE_REPORT.json V11_PREVIEW_1000_SMOKE_REPORT.json
            git add V11_PREVIEW_1000_SMOKE_REPORT.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'audit(v11): persist public preview 1000 smoke [skip ci]'
            git push origin HEAD:v11-1000passage-easy-notes && exit 0
            sleep $((n*2))
          done
          exit 1
