name: v11 Batch10 chronology audit
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch10_chronology_audit.js'
      - 'v11_batch10_passages_draft_g1.js'
      - 'v11_batch10_passages_draft_g2.js'
      - 'v11_batch10_passages_draft_g3.js'
      - 'v11_batch10_length_repair_r1.js'
      - 'v11_batch10_grammar_repair_r1.js'
      - 'v11_batch10_vocab_inventory.js'
      - 'v11_batch10_prior_verified_gloss.js'
      - 'v11_batch10_manual_gloss_r1.js'
      - 'v11_batch10_gloss_apply.js'
      - 'v11_batch10_question_human_rewrite.js'
      - '.github/workflows/v11-batch10-chronology-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --package-lock=false jsdom@24
      - name: Run Batch10 chronology audit and preserve status
        id: chrono
        shell: bash
        run: |
          set +e
          node v11_batch10_chronology_audit.js
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist chronology reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f V11_BATCH10_VOCAB_CHRONOLOGY_REPORT.json V11_BATCH10_GRAMMAR_CHRONOLOGY_REPORT.json V11_BATCH10_CHRONOLOGY_STATUS.txt
          git diff --cached --quiet || git commit -m "v11: persist Batch10 chronology reports"
          git push origin HEAD:v11-1000passage-easy-notes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-batch10-chronology
          path: |
            V11_BATCH10_VOCAB_CHRONOLOGY_REPORT.json
            V11_BATCH10_GRAMMAR_CHRONOLOGY_REPORT.json
            V11_BATCH10_CHRONOLOGY_STATUS.txt
      - name: Enforce chronology gate
        if: always()
        run: test "${{ steps.chrono.outputs.rc }}" = "0"
