name: Math 2140 Checkpoint Fast Recovery

on:
  push:
    branches: [math-problem-bank-bootstrap]
    paths:
      - '.github/workflows/math-checkpoint-recovery-fast.yml'
  workflow_dispatch:

concurrency:
  group: math-2140-checkpoint-fast-recovery
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search full branch and tag paths for the 2140 checkpoint and normalized datasets
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from datetime import datetime,timezone
          needles=['みかみ塾数学問題バンク_継続チェックポイント_20260819_2140.zip','winpass_verified_union570_authoritative_norm_20260820','jitsuren_verified_union225_complete27_20260820','FINAL_INVENTORY.md','FULL_AUDIT.md','QUALITY_REPORT.md','QUALITY_SUMMARY.md']
          text=subprocess.check_output(['git','rev-list','--objects','--all'],text=True)
          hits=[]
          for line in text.splitlines():
            x=line.split(' ',1)
            if len(x)==2 and any(n.lower() in x[1].lower() for n in needles):hits.append({'oid':x[0],'path':x[1]})
          out={'scope':'all fetched branch heads and tags','needles':needles,'path_hits':hits,'recorded_at_utc':datetime.now(timezone.utc).isoformat()}
          Path('/tmp/math-2140-fast-git-path-hits.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          d=Path('/tmp/recovered-2140-fast'); d.mkdir(parents=True,exist_ok=True)
          for h in hits:
            if Path(h['path']).name=='みかみ塾数学問題バンク_継続チェックポイント_20260819_2140.zip':
              (d/'みかみ塾数学問題バンク_継続チェックポイント_20260819_2140.zip').write_bytes(subprocess.check_output(['git','cat-file','blob',h['oid']]))
              break
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Scan every unexpired Actions artifact recursively for checkpoint filename or normalized dataset names
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib,io,json,os,urllib.request,zipfile
          from pathlib import Path
          from datetime import datetime,timezone
          repo=os.environ['REPO']; token=os.environ['GITHUB_TOKEN']; checkpoint='みかみ塾数学問題バンク_継続チェックポイント_20260819_2140.zip'
          hints=['winpass_verified_union570_authoritative_norm_20260820','jitsuren_verified_union225_complete27_20260820','FINAL_INVENTORY.md','FULL_AUDIT.md','QUALITY_REPORT.md','QUALITY_SUMMARY.md']
          base_headers={'Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'mikami-math-2140-fast'}
          def fetch(url,accept):
            h=dict(base_headers);h['Accept']=accept
            with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=180) as r:return r.read()
          def jget(url):return json.loads(fetch(url,'application/vnd.github+json'))
          def scan(data,prefix='',depth=0):
            hits=[]; recovered=[]
            if depth>3:return hits,recovered
            try:
              with zipfile.ZipFile(io.BytesIO(data)) as z:
                for i in z.infolist():
                  if i.is_dir() or i.file_size>500*1024*1024:continue
                  name=prefix+i.filename; base=Path(i.filename).name
                  interesting=base==checkpoint or any(x.lower() in name.lower() for x in hints)
                  nested_candidate=i.file_size<=250*1024*1024
                  if not interesting and not nested_candidate:continue
                  payload=z.read(i)
                  if interesting:
                    hits.append({'name':name,'bytes':len(payload),'sha256':hashlib.sha256(payload).hexdigest(),'depth':depth})
                    if base==checkpoint:recovered.append((name,payload))
                  if nested_candidate and payload[:2]==b'PK':
                    try:
                      if zipfile.is_zipfile(io.BytesIO(payload)):
                        h,r=scan(payload,name+'!/',depth+1);hits+=h;recovered+=r
                    except:pass
            except:pass
            return hits,recovered
          arts=[]
          for page in range(1,11):
            o=jget(f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}'); b=o.get('artifacts') or [];arts+=b
            if len(b)<100:break
          out={'artifacts_seen':len(arts),'artifacts_downloaded':0,'download_failures':0,'hits':[],'checkpoint_recovered':False,'recorded_at_utc':None}
          dest=Path('/tmp/recovered-2140-fast');dest.mkdir(parents=True,exist_ok=True)
          for a in arts:
            if a.get('expired'):continue
            try:
              data=fetch(a['archive_download_url'],'application/octet-stream');out['artifacts_downloaded']+=1
              h,r=scan(data,f"artifact:{a['id']}:{a['name']}!/")
              if h:out['hits'].append({'artifact_id':a['id'],'artifact_name':a['name'],'workflow_run':a.get('workflow_run'),'members':h})
              if r and not out['checkpoint_recovered']:
                n,p=r[0];q=dest/checkpoint;q.write_bytes(p);out['checkpoint_recovered']=True;out['checkpoint_source']={'artifact_id':a['id'],'artifact_name':a['name'],'member':n,'bytes':len(p),'sha256':hashlib.sha256(p).hexdigest()}
            except Exception as e:out['download_failures']+=1
          out['recorded_at_utc']=datetime.now(timezone.utc).isoformat()
          Path('/tmp/math-2140-fast-actions-scan.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Inspect recovered checkpoint if present
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          from datetime import datetime,timezone
          p=Path('/tmp/recovered-2140-fast/みかみ塾数学問題バンク_継続チェックポイント_20260819_2140.zip')
          if not p.is_file():
            print('NO_2140_CHECKPOINT_RECOVERED');raise SystemExit(0)
          rows=[]
          with zipfile.ZipFile(p) as z:
            for i in z.infolist():
              if i.is_dir():continue
              b=z.read(i);rows.append({'name':i.filename,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          out={'checkpoint_filename':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'member_count':len(rows),'members':rows,'promoted':False,'recorded_at_utc':datetime.now(timezone.utc).isoformat()}
          Path('/tmp/math-2140-fast-checkpoint-inspection.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8');print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Upload evidence and recovered checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-2140-checkpoint-fast-recovery-evidence
          path: |
            /tmp/math-2140-fast-git-path-hits.json
            /tmp/math-2140-fast-actions-scan.json
            /tmp/math-2140-fast-checkpoint-inspection.json
            /tmp/recovered-2140-fast/
          if-no-files-found: warn
          retention-days: 30
      - name: Persist fast checkpoint recovery state
        if: always()
        run: |
          mkdir -p /tmp/math-2140-fast-state
          cp /tmp/math-2140-fast-*.json /tmp/math-2140-fast-state/ 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin math-problem-bank-bootstrap
          git reset --hard origin/math-problem-bank-bootstrap
          mkdir -p math-bank/state
          cp /tmp/math-2140-fast-state/*.json math-bank/state/ 2>/dev/null || true
          git add math-bank/state/math-2140-fast-*.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'record fast math 2140 checkpoint recovery scan'
            git push origin HEAD:math-problem-bank-bootstrap
          fi
