name: v11 Batch03 postchronology quality
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch03_passages_draft_g1.js'
      - 'v11_batch03_g1_length_repair.js'
      - 'v11_batch03_passages_draft_g2.js'
      - 'v11_batch03_passages_draft_g3.js'
      - 'v11_batch03_length_repair.js'
      - 'v11_batch03_chronology_repair.js'
      - 'v11_batch03_chronology_repair_r2.js'
      - 'v11_batch03_postchronology_quality_audit.js'
      - '.github/workflows/v11-batch03-postchronology-quality.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node v11_batch03_postchronology_quality_audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-batch03-postchronology-quality
          path: V11_BATCH03_POSTCHRONOLOGY_QUALITY_AUDIT.json
