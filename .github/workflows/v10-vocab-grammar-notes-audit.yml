name: v10 vocab grammar notes audit

on:
  push:
    branches: [v10-vocab-grammar-notes-audit]
    paths:
      - 'v10_vocab_notes_candidate_audit.js'
      - 'v10_v7_lexicon_loader.js'
      - 'v10_v7_lexicon_snapshot.b64.part*'
      - 'v10_grammar_chronology_candidate_audit.js'
      - 'v10_grammar_chronology_gate.json'
      - 'v10_notes_ui_test.js'
      - 'v10_vocab_corrections.js'
      - 'v10_stage2.html'
      - 'v10_data_*.js'
      - 'v10_semantic_*.js'
      - 'v10_interaction_metadata*.js'
      - '.github/workflows/v10-vocab-grammar-notes-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v10_vocab_notes_candidate_audit.js'
      - 'v10_v7_lexicon_loader.js'
      - 'v10_v7_lexicon_snapshot.b64.part*'
      - 'v10_grammar_chronology_candidate_audit.js'
      - 'v10_grammar_chronology_gate.json'
      - 'v10_notes_ui_test.js'
      - 'v10_vocab_corrections.js'
      - 'v10_stage2.html'
      - 'v10_data_*.js'
      - 'v10_semantic_*.js'
      - 'v10_interaction_metadata*.js'
      - '.github/workflows/v10-vocab-grammar-notes-audit.yml'
  workflow_dispatch:

concurrency:
  # push and pull_request runs for the same work branch must never race each other.
  group: v10-vocab-grammar-notes-audit-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install audit dependency
        run: npm install --no-save --no-package-lock jsdom@24.1.3
      - name: Verify canonical v7 snapshot
        shell: bash
        run: |
          node - <<'NODE'
          const {loadCanonicalV7}=require('./v10_v7_lexicon_loader');
          const v7=loadCanonicalV7();
          if(v7.source[2]!==3975) throw new Error(`expected 3975 canonical records, got ${v7.source[2]}`);
          if(Object.keys(v7.lex||{}).length<2500) throw new Error('canonical lexicon snapshot unexpectedly small');
          console.log(`CANONICAL V7 SNAPSHOT PASS records=${v7.source[2]} lexKeys=${Object.keys(v7.lex).length} modified=${v7.source[3]}`);
          NODE
      - name: Run all-168 canonical v7 vocabulary chronology audit
        shell: bash
        run: |
          set -o pipefail
          timeout 180s node v10_vocab_notes_candidate_audit.js | tee v10_vocab_notes_candidate_audit.log
      - name: Run all-168 grammar structure candidate audit
        shell: bash
        run: |
          set -o pipefail
          timeout 180s node v10_grammar_chronology_candidate_audit.js | tee v10_grammar_chronology_candidate_audit.log
      - name: Write core audit status
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('v10_vocab_notes_candidate_report.json','utf8')).summary;
          const g=JSON.parse(fs.readFileSync('v10_grammar_chronology_candidate_report.json','utf8'));
          const c=r.counts||{};
          const lines=[
            'phase=canonical_v7_vocab_chronology_then_grammar_chronology',
            `canonical_v7_records=${r.canonicalSource&&r.canonicalSource.records}`,
            `passages_audited=${r.passages}/168`,
            `v7_chronology_allowed_occurrences=${c.V7_CHRONOLOGY_ALLOWED||0}`,
            `morphology_to_grammar_occurrences=${c.MORPHOLOGY_TO_GRAMMAR||0}`,
            `contraction_to_grammar_occurrences=${c.CONTRACTION_TO_GRAMMAR||0}`,
            `explicit_function_to_grammar_occurrences=${c.EXPLICIT_FUNCTION_TO_GRAMMAR||0}`,
            `future_v7_leak_occurrences=${c.FUTURE_V7_LEAK||0}`,
            `unregistered_v7_occurrences=${c.UNREGISTERED_V7||0}`,
            `unregistered_proper_occurrences=${c.UNREGISTERED_PROPER||0}`,
            `unique_unresolved=${r.uniqueUnresolved||0}`,
            `future_vocab_leak=${r.futureVocabLeakOccurrences||0}`,
            `vocabulary_chronology=${r.chronologyPass?'PASS':'FAIL'}`,
            `notes_present=${r.notesPresent}`,
            `missing_gloss=${r.missingGloss}`,
            `grammar_candidate_passages=${g.passages}/168`,
            `grammar_detected_feature_types=${Object.keys(g.featureSummary||{}).length}`,
            'grammar_candidate_status=CANDIDATES_NOT_PASS_FAIL_REQUIRE_EVIDENCE_BACKED_SECTION_CHRONOLOGY',
            'notes_ui_gate=PENDING_BOUNDED_TEST',
            'vocab_rule=canonical v7 earliest textbook+grade+PDF-order+subunit boundary; previous grades cumulative; future boundaries forbidden; morphology/function forms handed to grammar',
            'next=resolve remaining canonical future/unregistered tokens; then populate evidence-backed grammar introduction boundaries and run final browser/slash/print gates'
          ];
          fs.writeFileSync('VOCAB_GRAMMAR_NOTES_AUDIT_STATUS.txt',lines.join('\n')+'\n');
          NODE
          cat VOCAB_GRAMMAR_NOTES_AUDIT_STATUS.txt
      - name: Persist core reports before UI gate
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f v10_vocab_notes_candidate_report.json v10_vocab_notes_candidate_audit.log v10_grammar_chronology_candidate_report.json v10_grammar_chronology_candidate_audit.log VOCAB_GRAMMAR_NOTES_AUDIT_STATUS.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record canonical v7 vocabulary and grammar audits [skip ci]'
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:v10-vocab-grammar-notes-audit; then pushed=1; break; fi
              git fetch origin v10-vocab-grammar-notes-audit
              git rebase origin/v10-vocab-grammar-notes-audit
            done
            test "$pushed" = 1
          fi
      - name: Verify v7 correction and gloss UI
        id: notes_ui
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          timeout 120s node v10_notes_ui_test.js | tee v10_notes_ui_test.log
      - name: Finalize UI status
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='VOCAB_GRAMMAR_NOTES_AUDIT_STATUS.txt';
          let s=fs.existsSync(p)?fs.readFileSync(p,'utf8'):'';
          const ui=fs.existsSync('v10_notes_ui_test.log')&&/NOTES UI PASS/.test(fs.readFileSync('v10_notes_ui_test.log','utf8'))?'PASS':'FAIL_OR_TIMEOUT';
          s=s.replace(/notes_ui_gate=.*\n/,`notes_ui_gate=${ui}\n`);
          fs.writeFileSync(p,s);
          NODE
          cat VOCAB_GRAMMAR_NOTES_AUDIT_STATUS.txt
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-vocab-grammar-notes-candidate-report
          path: |
            v10_vocab_notes_candidate_report.json
            v10_vocab_notes_candidate_audit.log
            v10_grammar_chronology_candidate_report.json
            v10_grammar_chronology_candidate_audit.log
            v10_notes_ui_test.log
            VOCAB_GRAMMAR_NOTES_AUDIT_STATUS.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Persist final UI evidence
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f VOCAB_GRAMMAR_NOTES_AUDIT_STATUS.txt v10_notes_ui_test.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Record bounded notes UI audit [skip ci]'
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:v10-vocab-grammar-notes-audit; then pushed=1; break; fi
              git fetch origin v10-vocab-grammar-notes-audit
              git rebase origin/v10-vocab-grammar-notes-audit
            done
            test "$pushed" = 1
          fi
