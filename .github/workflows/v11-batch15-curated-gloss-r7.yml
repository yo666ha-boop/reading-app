name: v11 Batch15 curated gloss R7
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch15_curated_required_gloss_r7.js'
      - '.github/workflows/v11-batch15-curated-gloss-r7.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply R7 required-local glosses
        run: node v11_batch15_curated_required_gloss_r7.js
      - name: Run independent R6 vocab gate on repaired drafts
        id: gate
        continue-on-error: true
        run: node v11_batch15_vocab_gate_r6.js
      - name: Commit repaired drafts and exact gate outputs
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v11_batch15_g1_body_draft.json v11_batch15_g2_body_draft.json v11_batch15_g3_body_draft.json V11_BATCH15_CURATED_GLOSS_R7_REPORT.json V11_BATCH15_VOCAB_GATE_R6_REPORT.json V11_BATCH15_VOCAB_GATE_R6_STATUS.txt V11_BATCH15_VOCAB_GATE_R6_RESIDUAL.txt
          git commit -m 'repair(v11): apply Batch15 R7 and persist vocab truth'
          git pull --rebase origin v11-1000passage-easy-notes
          git push origin HEAD:v11-1000passage-easy-notes
      - name: Fail closed if vocab residual remains
        if: steps.gate.outcome == 'failure'
        run: exit 1
