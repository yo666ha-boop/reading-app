name: v11 Batch11 question quality audit
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch11_question_quality_audit.js'
      - 'v11_batch11_question_human_rewrite*.js'
      - 'v11_batch11_*repair*.js'
      - '.github/workflows/v11-batch11-question-quality-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run question quality audit
        id: audit
        shell: bash
        run: |
          set +e
          node v11_batch11_question_quality_audit.js
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist report without rolling back concurrent work
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f V11_BATCH11_QUESTION_QUALITY_REPORT.json
          git diff --cached --quiet || git commit -m "v11: persist Batch11 question quality report"
          for n in 1 2 3; do
            git pull --rebase origin v11-1000passage-easy-notes && git push origin HEAD:v11-1000passage-easy-notes && exit 0
            sleep $((n*2))
          done
          exit 1
      - name: Enforce gate
        if: always()
        run: test "${{ steps.audit.outputs.rc }}" = "0"
