name: v11 Batch13 human question gate
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch13_question_human_review_*.json'
      - 'v11_batch13_question_human_corrections_*.json'
      - 'v11_batch13_question_human_gate_*.js'
      - 'v11_batch13_build_body_candidate.js'
      - 'v11_batch13_*_body_draft.json'
      - 'v11_batch13_semantic_repair_*.json'
      - '.github/workflows/v11_batch13_question_human_gate.yml'
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fail-closed Batch13 question gates
        id: gate
        shell: bash
        run: |
          set +e
          : > V11_BATCH13_QUESTION_GATE.log
          node v11_batch13_question_human_gate_r1.js >> V11_BATCH13_QUESTION_GATE.log 2>&1; r1=$?
          node v11_batch13_question_human_gate_g1_complete.js >> V11_BATCH13_QUESTION_GATE.log 2>&1; g1=$?
          node v11_batch13_question_human_gate_g2_r4.js >> V11_BATCH13_QUESTION_GATE.log 2>&1; g2a=$?
          node v11_batch13_question_human_gate_g2_complete.js >> V11_BATCH13_QUESTION_GATE.log 2>&1; g2b=$?
          node v11_batch13_question_human_gate_g3_r6.js >> V11_BATCH13_QUESTION_GATE.log 2>&1; g3a=$?
          cat V11_BATCH13_QUESTION_GATE.log
          if [ "$r1" -ne 0 ] || [ "$g1" -ne 0 ] || [ "$g2a" -ne 0 ] || [ "$g2b" -ne 0 ] || [ "$g3a" -ne 0 ]; then code=1; else code=0; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload gate diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-batch13-question-gate-diagnostic
          path: V11_BATCH13_QUESTION_GATE.log
          if-no-files-found: error
      - name: Enforce fail-closed result
        if: steps.gate.outputs.exit_code != '0'
        run: exit 1
