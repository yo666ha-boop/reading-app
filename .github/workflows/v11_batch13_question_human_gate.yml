name: v11 Batch13 human question gate
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch13_question_human_review_*.json'
      - 'v11_batch13_question_human_corrections_*.json'
      - 'v11_batch13_question_human_gate_*.js'
      - 'v11_batch13_build_body_candidate.js'
      - 'v11_batch13_*_body_draft.json'
      - 'v11_batch13_semantic_repair_*.json'
      - '.github/workflows/v11_batch13_question_human_gate.yml'
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fail-closed Batch13 question gate
        id: gate
        shell: bash
        run: |
          set +e
          node v11_batch13_question_human_gate_r1.js > V11_BATCH13_QUESTION_GATE_R1.log 2>&1
          code=$?
          cat V11_BATCH13_QUESTION_GATE_R1.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload gate diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-batch13-question-gate-r1-diagnostic
          path: V11_BATCH13_QUESTION_GATE_R1.log
          if-no-files-found: error
      - name: Enforce fail-closed result
        if: steps.gate.outputs.exit_code != '0'
        run: exit 1
