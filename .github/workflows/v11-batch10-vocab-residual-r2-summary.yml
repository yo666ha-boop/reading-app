name: v11 Batch10 vocab residual r2 summary
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch10_vocab_residual_r2_summary.js'
      - '.github/workflows/v11-batch10-vocab-residual-r2-summary.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node v11_batch10_vocab_residual_r2_summary.js
      - name: Persist summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f V11_BATCH10_VOCAB_RESIDUAL_R2_SUMMARY.json
          git diff --cached --quiet || git commit -m "v11: persist Batch10 vocab residual r2 summary"
          git push origin HEAD:v11-1000passage-easy-notes
