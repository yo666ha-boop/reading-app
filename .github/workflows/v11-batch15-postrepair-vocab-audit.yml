name: v11 Batch15 postrepair vocab audit
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - '.github/workflows/v11-batch15-postrepair-vocab-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --package-lock=false jsdom@24
      - name: Run current Batch15 chronology and force postrepair snapshot
        continue-on-error: true
        run: |
          node v11_batch15_chronology_audit.js
          true
      - name: Force copy current outputs under immutable postrepair names
        run: |
          cp V11_BATCH15_CHRONOLOGY_STATUS.txt V11_BATCH15_POSTREPAIR_STATUS.txt
          cp V11_BATCH15_VOCAB_CHRONOLOGY_REPORT.json V11_BATCH15_POSTREPAIR_VOCAB_REPORT.json
          cp V11_BATCH15_VOCAB_RESIDUAL_UNIQUE.txt V11_BATCH15_POSTREPAIR_VOCAB_RESIDUAL_UNIQUE.txt
          printf '\nsource_head=%s\n' "$(git rev-parse HEAD)" >> V11_BATCH15_POSTREPAIR_STATUS.txt
      - name: Persist postrepair truth
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V11_BATCH15_POSTREPAIR_STATUS.txt V11_BATCH15_POSTREPAIR_VOCAB_REPORT.json V11_BATCH15_POSTREPAIR_VOCAB_RESIDUAL_UNIQUE.txt
          git commit -m 'audit(v11): persist Batch15 postrepair vocab truth'
          git pull --rebase origin v11-1000passage-easy-notes
          git push origin HEAD:v11-1000passage-easy-notes
