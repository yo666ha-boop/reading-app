name: v11 Batch15 numeric gloss repair
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch15_numeric_gloss_repair.js'
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: git pull --rebase origin v11-1000passage-easy-notes
      - name: Repair numeric-only Japanese glosses
        run: node v11_batch15_numeric_gloss_repair.js
      - name: Re-run Batch15 notes gate
        run: node v11_batch15_notes_gate.js
      - name: Persist repair and notes gate
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v11_batch15_g1_body_draft.json v11_batch15_g2_body_draft.json v11_batch15_g3_body_draft.json V11_BATCH15_NOTES_GATE_REPORT.json V11_BATCH15_NOTES_GATE_STATUS.txt
          if ! git diff --cached --quiet; then
            git commit -m 'repair(v11): fix Batch15 numeric-only Japanese glosses'
            git push origin HEAD:v11-1000passage-easy-notes
          fi
