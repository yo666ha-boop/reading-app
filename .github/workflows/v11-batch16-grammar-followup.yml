name: v11 Batch16 grammar followup
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'scripts/v11_batch16_apply_grammar_followup.js'
      - '.github/workflows/v11-batch16-grammar-followup.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  followup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply final grammar fixes and audit
        run: |
          node scripts/v11_batch16_apply_grammar_followup.js
          node scripts/v11_batch16_formal_grammar_chronology.js
      - name: Persist final grammar fixes and report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V11_BATCH16_BODY_TRANSLATION_DRAFT_G1_001_010.json V11_BATCH16_BODY_TRANSLATION_DRAFT_G1_011_017.json V11_BATCH16_FORMAL_GRAMMAR_CHRONOLOGY_REPORT.json
          git commit -m 'fix(v11): clear Batch16 formal grammar chronology'
          git push