name: v11 Batch15 vocab final R8
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch15_vocab_final_r8.js'
      - '.github/workflows/v11-batch15-vocab-final-r8.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node v11_batch15_vocab_final_r8.js
      - name: Rerun independent vocab gate
        id: gate
        continue-on-error: true
        run: node v11_batch15_vocab_gate_r6.js
      - name: Persist exact zero-or-residual truth
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v11_batch15_g1_body_draft.json v11_batch15_g2_body_draft.json V11_BATCH15_VOCAB_FINAL_R8_REPORT.json V11_BATCH15_VOCAB_GATE_R6_REPORT.json V11_BATCH15_VOCAB_GATE_R6_STATUS.txt V11_BATCH15_VOCAB_GATE_R6_RESIDUAL.txt
          git commit -m 'repair(v11): finalize Batch15 vocab chronology R8'
          git pull --rebase origin v11-1000passage-easy-notes
          git push origin HEAD:v11-1000passage-easy-notes
      - name: Fail closed unless zero
        if: steps.gate.outcome == 'failure'
        run: exit 1
