name: v11 UNIT supplemental curriculum scope QA (24 passages)
on:
  push:
    branches:
      - work/english-reading-unit-expansion-20261114
    paths:
      - 'v11_multi_passage_architecture.js'
      - 'v11_unit_supplemental_20261114.js'
      - 'v11_unit_supplemental_wave2_20261114.js'
      - 'v11_unit_supplemental_wave3_20261114.js'
      - 'v11_unit_supplemental_wave4_20261114.js'
      - 'scripts/v11_unit_supplemental_audit.cjs'
      - 'scripts/v11_unit_browser_smoke.cjs'
      - 'scripts/v11_unit_coverage_inventory.cjs'
      - '.github/workflows/v11-unit-supplemental-audit.yml'
  pull_request:
    branches:
      - v11-1000passage-easy-notes
    paths:
      - 'v11_multi_passage_architecture.js'
      - 'v11_unit_supplemental_20261114.js'
      - 'v11_unit_supplemental_wave2_20261114.js'
      - 'v11_unit_supplemental_wave3_20261114.js'
      - 'v11_unit_supplemental_wave4_20261114.js'
      - 'scripts/v11_unit_supplemental_audit.cjs'
      - 'scripts/v11_unit_browser_smoke.cjs'
      - 'scripts/v11_unit_coverage_inventory.cjs'
      - '.github/workflows/v11-unit-supplemental-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit reading integrity and future-unit protection
        run: node scripts/v11_unit_supplemental_audit.cjs
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve local source
        run: |
          python3 -m http.server 4177 --bind 127.0.0.1 >/tmp/v11-unit-http.log 2>&1 &
          sleep 2
      - name: Chromium 24 UNIT checkpoints and six-course integration smoke
        run: node scripts/v11_unit_browser_smoke.cjs
      - name: Inventory actual UNIT coverage of 1000+24 candidate texts
        run: node scripts/v11_unit_coverage_inventory.cjs
      - name: Preserve UNIT-by-UNIT coverage report
        uses: actions/upload-artifact@v4
        with:
          name: v11-unit-coverage-report
          path: V11_UNIT_COVERAGE_REPORT_20261114.json
          if-no-files-found: error
