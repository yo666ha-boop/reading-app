name: Math Exact1323 Git Data Transport Progress 20260902
on:
  push:
    branches: [math-problem-bank-bootstrap]
    paths: ['.github/workflows/math-exact1323-git-data-progress-20260902.yml']
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 0
      - name: Verify and sync 71k
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('math-bank/transfer/app1323-exact-br-b64/chunks'); fs=sorted(root.glob('*.txt')); nums=[int(p.stem) for p in fs]
          assert nums==list(range(45)),nums[-5:]
          sizes={int(p.stem):len(p.read_text()) for p in fs}; assert sizes[0]==12000 and sizes[1]==7000 and sizes[2]==7000 and sizes[3]==4000 and all(sizes[i]==1000 for i in range(4,45)); total=sum(sizes.values()); assert total==71000,total
          def gsha(p):
            b=p.read_bytes(); return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert gsha(root/'043.txt')=='1dd24bf7ff5e8c6dda294597898ccc25626f9f9f'; assert gsha(root/'044.txt')=='cf2b94d1ad61fedd23f8a5faf73d0d8a5ba61790'
          cp=Path('math-bank/state/checkpoint.json'); d=json.loads(cp.read_text()); d['recorded_at_jst']='2026-09-02T11:05:00+09:00'; d['current_stage']='APP1323_EXACT_TRUE_BYTE_TRANSFER_GIT_DATA_BLOB_CHANNEL_PROVEN_PARTIAL'
          st=d['downstream']['github_exact_byte_staging']; st.update({'durable_chunks':45,'durable_base64_chars':71000,'next_offset':71000,'latest_verified_range':'chunks000-044 contiguous; 71000 base64 chars; exact-size and Git blob SHA gates retained','release_credit':False,'chunk043_git_blob_sha1':'1dd24bf7ff5e8c6dda294597898ccc25626f9f9f','chunk043_git_sha_precompute_match':True,'chunk044_git_blob_sha1':'cf2b94d1ad61fedd23f8a5faf73d0d8a5ba61790','chunk044_git_sha_precompute_match':True})
          d['publication_ready']=False; d['downstream']['release']['publication_ready']=False; d['exact_stop']='Partial byte transport is not release credit. Full reconstruction must equal 6,819,806 bytes and SHA256 47893e010514fffa44d45dac3832cf502aee075345b1ecdf378f69d764b32521.'; d['next_start']='Continue from base64 offset 71000 with exact-size plus independently precomputed Git blob SHA. After all 5,231,888 chars: decode/decompress and verify exact source, then isolated remote/browser/Fire/release/public verification.'
          ev=Path('math-bank/state/app1323-git-data-blob-channel-20260902T1105JST.json'); ev.write_text(json.dumps({'recorded_at_jst':'2026-09-02T11:05:00+09:00','durable_chunks':45,'durable_base64_chars':71000,'next_offset':71000,'source_bytes':6819806,'source_sha256':'47893e010514fffa44d45dac3832cf502aee075345b1ecdf378f69d764b32521','chunk043_sha':'1dd24bf7ff5e8c6dda294597898ccc25626f9f9f','chunk044_sha':'cf2b94d1ad61fedd23f8a5faf73d0d8a5ba61790','release_credit':False,'publication_ready':False},indent=2)+'\n'); d['latest_audits'].append(str(ev)) if str(ev) not in d['latest_audits'] else None; cp.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add math-bank/state/checkpoint.json math-bank/state/app1323-git-data-blob-channel-20260902T1105JST.json
          git commit -m 'Update exact1323 Git Data transport checkpoint to 71k'
          git pull --rebase origin math-problem-bank-bootstrap
          git push origin HEAD:math-problem-bank-bootstrap
