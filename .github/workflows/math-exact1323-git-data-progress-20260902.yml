name: Math Exact1323 Git Data Transport Progress 20260902
on:
  push:
    branches: [math-problem-bank-bootstrap]
    paths: ['.github/workflows/math-exact1323-git-data-progress-20260902.yml']
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 0
      - name: Verify manifest-bound exact byte staging and sync checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import hashlib,json
          manifest_path=Path('math-bank/transfer/app1323-exact-br-b64/bulk7k/manifest.json')
          m=json.loads(manifest_path.read_text())
          assert m['base_offset']==97000
          items=[m['probe']]+m['segments']
          expected=97000
          verified=[]
          for x in items:
            assert x['start']==expected,(expected,x)
            assert x['end']-x['start']==x['chars'],x
            p=Path(x.get('path') or ('math-bank/transfer/app1323-exact-br-b64/bulk7k/'+x['file']))
            b=p.read_bytes()
            assert len(b)==x['chars'],(p,len(b),x['chars'])
            sha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
            assert sha==x['git_blob_sha1'],(p,sha,x['git_blob_sha1'])
            verified.append({'path':str(p),'start':x['start'],'end':x['end'],'chars':len(b),'git_blob_sha1':sha})
            expected=x['end']
          assert expected==m['durable_end_offset']
          assert m.get('release_credit') is False
          now=datetime.now(ZoneInfo('Asia/Tokyo')).isoformat(timespec='seconds')
          cp=Path('math-bank/state/checkpoint.json'); d=json.loads(cp.read_text())
          st=d['downstream']['github_exact_byte_staging']
          st.update({
            'durable_base64_chars':expected,
            'next_offset':expected,
            'bulk7k_extra_chars':expected-97000,
            'git_data_blob_channel':f'PROVEN_FOR_SHA_BOUND_BRANCH_ATTACHED_BYTES_THROUGH_OFFSET_{expected}',
            'latest_verified_range':f'legacy through 97000 plus manifest-bound SHA verified extension through {expected}',
            'release_credit':False,
            'bulk7k_manifest':str(manifest_path)
          })
          d['recorded_at_jst']=now
          d['current_stage']='APP1323_EXACT_TRUE_BYTE_TRANSFER_GIT_DATA_BLOB_CHANNEL_PROVEN_PARTIAL'
          d['publication_ready']=False
          d['downstream']['release']['publication_ready']=False
          d['next_start']=f'Continue exact SHA-bound staging from base64 offset {expected}. After all 5,231,888 chars, decode/decompress and verify exact 6,819,806 bytes + SHA256 47893e010514fffa44d45dac3832cf502aee075345b1ecdf378f69d764b32521, then isolated remote/browser/physical Fire/release/public verification.'
          ev=Path('math-bank/state/app1323-byte-transfer-manifest-audit-latest.json')
          ev.write_text(json.dumps({'recorded_at_jst':now,'manifest':str(manifest_path),'base_offset':97000,'durable_end_offset':expected,'verified_entries':verified,'failed_attempts':m.get('failed_attempts',[]),'source_bytes':6819806,'source_sha256':'47893e010514fffa44d45dac3832cf502aee075345b1ecdf378f69d764b32521','brotli_bytes':3923915,'brotli_sha256':'8f78b6dc4e26b5349d9a6dedc7b6d6efad931c7ed3da58d0767ce6b8d36dc003','base64_chars':5231888,'release_credit':False,'publication_ready':False},ensure_ascii=False,indent=2)+'\n')
          if str(ev) not in d.get('latest_audits',[]): d.setdefault('latest_audits',[]).append(str(ev))
          cp.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit audit and checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add math-bank/state/checkpoint.json math-bank/state/app1323-byte-transfer-manifest-audit-latest.json
          git commit -m 'Sync exact1323 manifest-bound byte staging checkpoint' || exit 0
          git pull --rebase origin math-problem-bank-bootstrap
          git push origin HEAD:math-problem-bank-bootstrap
# trigger: exact1323 manifest audit through 377000 on 2026-09-03 JST
