name: Math Exact1323 Git Data Transport Progress 20260902

on:
  push:
    branches: [math-problem-bank-bootstrap]
    paths:
      - '.github/workflows/math-exact1323-git-data-progress-20260902.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 0
      - name: Patch checkpoint fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('math-bank/state/checkpoint.json')
          d=json.loads(p.read_text())
          d['recorded_at_jst']='2026-09-02T09:25:00+09:00'
          d['current_stage']='APP1323_EXACT_TRUE_BYTE_TRANSFER_GIT_DATA_BLOB_CHANNEL_PROVEN_PARTIAL'
          st=d['downstream']['github_exact_byte_staging']
          st['status']='PARTIAL_TRANSFER_GIT_DATA_BLOB_CHANNEL_PROVEN_NOT_RELEASE_CREDIT'
          st['operational_chunk_chars']=4000
          st['planned_total_chunks']=None
          st['planning_note']='Mixed verified staging: chunk000=12000, chunk001/002=7000, chunk003=4000. Do not infer total chunk count until stable route size is established.'
          st['durable_chunks']=4
          st['durable_base64_chars']=30000
          st['next_offset']=30000
          st['chunk001_git_blob_sha1']='b2325e6cc8b37a4aa7ac8e4da500392327ecd83a'
          st['chunk001_git_sha_precompute_match']=True
          st['chunk002_git_blob_sha1']='f44316a09027caa9ebc526d586fcccb5d68dbd55'
          st['chunk002_git_sha_precompute_match']=True
          st['chunk003_git_blob_sha1']='f1ad437af470a7d2ffc47161b00c70a2ead42587'
          st['chunk003_git_sha_precompute_match']=True
          st['git_data_blob_channel']='PROVEN_FOR_VERIFIED_BRANCH_ATTACHED_CHUNKS_THROUGH_OFFSET_30000'
          st['chunk003_7000_attempt']='FAIL_PRECOMPUTED_SHA_MISMATCH_DETACHED_NO_CREDIT'
          st['chunk003_4000_retry']='PASS_PRECOMPUTED_SHA_MATCH_BRANCH_ATTACHED'
          st['large_12000_git_blob_attempt']='BLOCKED_BY_TOOL_SAFETY_NO_CREDIT'
          st['release_credit']=False
          audit='math-bank/state/app1323-git-data-blob-channel-20260902T0915JST.json'
          if audit not in d['latest_audits']:
              d['latest_audits'].append(audit)
          d['exact_stop']='Do not credit remote/browser/release from partial transport. Branch-attached chunks are byte-exact through base64 offset 30000. The 7000-char attempt at offset 26000 failed SHA and stayed detached; the 4000-char retry passed independently precomputed Git blob SHA and is attached. Full reconstruction must equal 6,819,806 bytes and SHA256 47893e010514fffa44d45dac3832cf502aee075345b1ecdf378f69d764b32521 before isolated deploy credit.'
          d['next_start']='Continue exact-byte staging from base64 offset 30000, initially using 4000-char Git Data blobs with exact character count plus independently precomputed Git blob SHA. Only matching blobs may be attached. After full reconstruction verify original length/SHA, then isolated Vercel remote body identity, exact-origin Chromium/Firefox/WebKit-iPhone/localStorage/A4, physical Fire, strict release, and final public isolated verification.'
          d['publication_ready']=False
          d['downstream']['release']['publication_ready']=False
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add math-bank/state/checkpoint.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update exact1323 Git Data transport checkpoint'
          git pull --rebase origin math-problem-bank-bootstrap
          git push origin HEAD:math-problem-bank-bootstrap
