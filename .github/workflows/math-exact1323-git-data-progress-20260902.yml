name: Math Exact1323 Git Data Transport Progress 20260902

on:
  push:
    branches: [math-problem-bank-bootstrap]
    paths:
      - '.github/workflows/math-exact1323-git-data-progress-20260902.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 0
      - name: Audit attached chunks and patch checkpoint fail-closed
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          root=Path('math-bank/transfer/app1323-exact-br-b64/chunks')
          files=sorted(root.glob('*.txt'))
          nums=[int(x.stem) for x in files]
          if not nums or nums != list(range(nums[-1]+1)):
              raise SystemExit(f'non-contiguous chunks: {nums[:5]}...{nums[-5:] if nums else []}')
          expected_sizes={0:12000,1:7000,2:7000,3:4000}
          sizes={int(x.stem):len(x.read_text()) for x in files}
          for i,n in sizes.items():
              want=expected_sizes.get(i,1000)
              if n != want: raise SystemExit(f'chunk size mismatch {i}: {n} != {want}')
          total=sum(sizes.values()); last=nums[-1]
          if total < 69000 or last < 42 or len(files) < 43:
              raise SystemExit(f'expected at least 43 chunks through 042 / 69000 chars, got files={len(files)} last={last} total={total}')
          known={20:'b583ea6cf50df61b9491a22dbdfb9475c0093319',21:'76c625f3f3b174d2a1014c257de45b0c9a2a44ed',22:'7e51a3f8fa9351aa8b99f12d4d9bd11ba6de6b13',23:'8fd77f8f6305e9f932a9e8e808048e12ce4daeb9',24:'e6c02a81a652cf861b722cf8218b9d81a93a8f8a',25:'c84454bfc030b6c20372b088ecfefadea54f7668',26:'57278475e3750398e34a0565478c863d7707ed8f',27:'f06f35e248d68dddd212ffc1269b8a96b00df417',28:'e55166d6f99145743c8b07d6d55aaad7f3f1282c',29:'2a9897f853b83ab7f6ec578431c440a9f4e6c80d',30:'0056bd130f9dedd50b72b13bf9fdc5fbc7233283',31:'a1eb36bb12758f223f4ebc5aeb0123d7d43081d0',32:'2b64335cb0614fd53d148ad1ede072318db7cf1b',33:'ae1edc65cb087fbb7f2554298f23c27a7b4de936',34:'e8ab0bbdeb408cb73390440b33172dc34ec0d67a',35:'ec6895c0c71fb9917e39c2c6766d53c3c2e9a581',36:'44a5a974c8644fdc28e0cb5a8e01e5cfc4eb963a',37:'452c7c032580dd78a4a4252723dbb5c9ece66066',38:'f0298a9fd90d7ab7680d326d94dc3dc49c3af89f',39:'9d85106d5d986081f018a1a975835c8685a00a09',40:'ab22c487df86bff995d78ae4d82addf68af7d904',41:'36f6e92e9ffdd6abd0dae21b57184e05189eb573',42:'e8c48e16af1fc9e70eb8f0cdbc6cb2f1de4e5ea2'}
          def gitsha(text):
              b=text.encode('utf-8'); return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          for i,want in known.items():
              got=gitsha((root/f'{i:03d}.txt').read_text())
              if got != want: raise SystemExit(f'git blob SHA mismatch {i}: {got} != {want}')
          p=Path('math-bank/state/checkpoint.json'); d=json.loads(p.read_text())
          d['recorded_at_jst']='2026-09-02T11:00:00+09:00'; d['current_stage']='APP1323_EXACT_TRUE_BYTE_TRANSFER_GIT_DATA_BLOB_CHANNEL_PROVEN_PARTIAL'
          st=d['downstream']['github_exact_byte_staging']; st['status']='PARTIAL_TRANSFER_GIT_DATA_BLOB_CHANNEL_PROVEN_NOT_RELEASE_CREDIT'; st['operational_chunk_chars']=1000; st['durable_chunks']=len(files); st['durable_base64_chars']=total; st['next_offset']=total; st['git_data_blob_channel']=f'PROVEN_FOR_VERIFIED_BRANCH_ATTACHED_CHUNKS_THROUGH_OFFSET_{total}'; st['release_credit']=False; st['latest_verified_range']=f'chunks000-{last:03d} contiguous; {total} base64 chars; exact-size gate and independent Git blob SHA checks retained'
          for i,want in known.items(): st[f'chunk{i:03d}_git_blob_sha1']=want; st[f'chunk{i:03d}_git_sha_precompute_match']=True
          audit='math-bank/state/app1323-git-data-blob-channel-20260902T1100JST.json'
          evidence={'recorded_at_jst':'2026-09-02T11:00:00+09:00','source_bytes':6819806,'source_sha256':'47893e010514fffa44d45dac3832cf502aee075345b1ecdf378f69d764b32521','brotli_bytes':3923915,'brotli_sha256':'8f78b6dc4e26b5349d9a6dedc7b6d6efad931c7ed3da58d0767ce6b8d36dc003','base64_chars':5231888,'durable_chunks':len(files),'durable_base64_chars':total,'next_offset':total,'last_chunk':last,'sizes':sizes,'independently_verified_git_blob_shas_20_42':known,'release_credit':False,'main_touched':False,'publication_ready':False}
          Path(audit).write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          if audit not in d['latest_audits']: d['latest_audits'].append(audit)
          d['exact_stop']=f'Do not credit remote/browser/release from partial transport. Branch-attached chunks are byte-exact through base64 offset {total}. Full reconstruction must equal 6,819,806 bytes and SHA256 47893e010514fffa44d45dac3832cf502aee075345b1ecdf378f69d764b32521 before isolated deploy credit.'
          d['next_start']=f'Continue exact-byte staging from base64 offset {total} using 1000-char Git Data blobs with exact character count plus independently precomputed Git blob SHA. Only matching blobs may be attached. After full reconstruction verify original length/SHA, then isolated Vercel remote body identity, exact-origin Chromium/Firefox/WebKit-iPhone/localStorage/A4, physical Fire, strict release, and final public isolated verification.'
          d['publication_ready']=False; d['downstream']['release']['publication_ready']=False
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit checkpoint and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add math-bank/state/checkpoint.json math-bank/state/app1323-git-data-blob-channel-20260902T1100JST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update exact1323 Git Data transport checkpoint to 69k'
          git pull --rebase origin math-problem-bank-bootstrap
          git push origin HEAD:math-problem-bank-bootstrap
