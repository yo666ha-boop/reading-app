name: Math Exact1323 Git Data Transport Progress 20260902

on:
  push:
    branches: [math-problem-bank-bootstrap]
    paths:
      - '.github/workflows/math-exact1323-git-data-progress-20260902.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 0
      - name: Patch checkpoint fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('math-bank/state/checkpoint.json')
          d=json.loads(p.read_text())
          d['recorded_at_jst']='2026-09-02T09:38:00+09:00'
          d['current_stage']='APP1323_EXACT_TRUE_BYTE_TRANSFER_GIT_DATA_BLOB_CHANNEL_PROVEN_PARTIAL'
          st=d['downstream']['github_exact_byte_staging']
          st['status']='PARTIAL_TRANSFER_GIT_DATA_BLOB_CHANNEL_PROVEN_NOT_RELEASE_CREDIT'
          st['operational_chunk_chars']=1000
          st['planned_total_chunks']=None
          st['planning_note']='Verified mixed staging: 000=12000, 001/002=7000, 003=4000, 004-009=1000. 4000-char copied attempt at offset30000 failed precomputed SHA and stayed detached; 1000-char route then passed six consecutive independently precomputed Git object SHA checks.'
          st['durable_chunks']=10
          st['durable_base64_chars']=36000
          st['next_offset']=36000
          shas={
            '004':'5b38eed6b5a32808921125b00fa574277a8adbc2',
            '005':'79add0bf6ed76bf59a70caa3238b9862053ea92e',
            '006':'08b5c7b13b6bbeb9b4de4313dbda9511e71d04fe',
            '007':'784b20867fadf7e14d5209e62942fb3363c3f2c7',
            '008':'c77edd325ee28856cfd011f8aaad40bf959e9c13',
            '009':'b414061ef7147a9e614b1ac48f5d0a3df0637562'}
          for n,s in shas.items():
              st[f'chunk{n}_git_blob_sha1']=s
              st[f'chunk{n}_git_sha_precompute_match']=True
          st['chunk004_4000_attempt']='FAIL_PRECOMPUTED_SHA_MISMATCH_DETACHED_NO_CREDIT'
          st['chunk004_1000_retry']='PASS_PRECOMPUTED_SHA_MATCH_BRANCH_ATTACHED'
          st['git_data_blob_channel']='PROVEN_FOR_VERIFIED_BRANCH_ATTACHED_CHUNKS_THROUGH_OFFSET_36000'
          st['release_credit']=False
          audit='math-bank/state/app1323-git-data-blob-channel-20260902T0938JST.json'
          evidence={
            'recorded_at_jst':'2026-09-02T09:38:00+09:00',
            'source_bytes':6819806,
            'source_sha256':'47893e010514fffa44d45dac3832cf502aee075345b1ecdf378f69d764b32521',
            'brotli_bytes':3923915,
            'brotli_sha256':'8f78b6dc4e26b5349d9a6dedc7b6d6efad931c7ed3da58d0767ce6b8d36dc003',
            'base64_chars':5231888,
            'durable_chunks':10,
            'durable_base64_chars':36000,
            'next_offset':36000,
            'operational_chunk_chars':1000,
            'new_chunks':shas,
            'failed_attempts':['offset30000_len4000_precomputed_sha_mismatch_detached_no_credit'],
            'release_credit':False,
            'main_touched':False,
            'publication_ready':False}
          Path(audit).write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          if audit not in d['latest_audits']:
              d['latest_audits'].append(audit)
          d['exact_stop']='Do not credit remote/browser/release from partial transport. Branch-attached chunks are byte-exact through base64 offset 36000. Full reconstruction must equal 6,819,806 bytes and SHA256 47893e010514fffa44d45dac3832cf502aee075345b1ecdf378f69d764b32521 before isolated deploy credit.'
          d['next_start']='Continue exact-byte staging from base64 offset 36000 using 1000-char Git Data blobs with exact character count plus independently precomputed Git blob SHA. Only matching blobs may be attached. After full reconstruction verify original length/SHA, then isolated Vercel remote body identity, exact-origin Chromium/Firefox/WebKit-iPhone/localStorage/A4, physical Fire, strict release, and final public isolated verification.'
          d['publication_ready']=False
          d['downstream']['release']['publication_ready']=False
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit checkpoint and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add math-bank/state/checkpoint.json math-bank/state/app1323-git-data-blob-channel-20260902T0938JST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update exact1323 Git Data transport checkpoint to 36k'
          git pull --rebase origin math-problem-bank-bootstrap
          git push origin HEAD:math-problem-bank-bootstrap
