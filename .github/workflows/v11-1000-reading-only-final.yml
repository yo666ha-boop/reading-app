name: v11 1000 reading-only final gate
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_final_release_reading_only_overlay.js'
      - 'scripts/v11_1000_reading_only_final_gate.js'
      - '.github/workflows/v11-1000-reading-only-final.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: v11-1000passage-easy-notes}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4176 --bind 127.0.0.1 >/tmp/v11-reading-only.log 2>&1 &
          sleep 2
      - name: Run reading-only gate
        run: |
          set +e
          V11_LOCAL_URL="http://127.0.0.1:4176/index.html" node scripts/v11_1000_reading_only_final_gate.js
          code=$?
          echo "audit_exit=$code" >> "$GITHUB_ENV"
          test -f V11_1000_READING_ONLY_FINAL_GATE.json
          exit 0
      - name: Persist report
        run: |
          cp V11_1000_READING_ONLY_FINAL_GATE.json /tmp/V11_1000_READING_ONLY_FINAL_GATE.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin v11-1000passage-easy-notes
          git reset --hard origin/v11-1000passage-easy-notes
          cp /tmp/V11_1000_READING_ONLY_FINAL_GATE.json V11_1000_READING_ONLY_FINAL_GATE.json
          git add V11_1000_READING_ONLY_FINAL_GATE.json
          git diff --cached --quiet || (git commit -m 'audit(v11): persist 1000 reading-only gate [skip ci]' && git push origin HEAD:v11-1000passage-easy-notes)
      - name: Enforce
        run: node -e "const r=require('./V11_1000_READING_ONLY_FINAL_GATE.json'); if(!r.pass)process.exit(2)"
