name: koku public validation
on:
  push:
    branches: [main]
    paths:
      - 'koku-app/**'
      - '.github/workflows/koku-public-validation.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: koku-public-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Validate live Japanese app
        shell: bash
        run: |
          set +e
          node > /tmp/koku-public.txt 2>&1 <<'NODE'
          const {chromium,webkit}=require('playwright');
          const base='https://yo666ha-boop.github.io/reading-app/koku-app/';
          function assert(c,m){if(!c)throw new Error(m)}
          async function openReady(p,label){
            let last='';
            for(let i=0;i<16;i++){
              try{
                const r=await p.goto(base+'?v='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
                last='HTTP '+(r&&r.status());
                if(r&&r.ok()){
                  await p.waitForFunction(()=>document.querySelector('#count')?.textContent?.includes('102/102問 active'),{timeout:15000});
                  const n=await p.evaluate(()=>Array.isArray(window.KOKU_DATA)?window.KOKU_DATA.length:0);
                  if(n===102)return;
                  last='data='+n;
                }
              }catch(e){last=String(e)}
              await p.waitForTimeout(10000);
            }
            throw new Error(label+' not ready: '+last);
          }
          function canonical(p){
            const ca=p.correct_answer;
            if(p.item_type==='ordering')return Array.isArray(ca)?ca.join(','):(ca?.correct_order||p.correct_order||[]).join(',');
            if(p.item_type==='insertion')return p.correct_position||ca?.correct_position||ca?.canonical||ca;
            if(p.item_type==='extract')return ca?.exact_answer||p.exact_answer||ca;
            return typeof ca==='string'?ca:String(ca??'');
          }
          async function gradeAll(p,label){
            const data=await p.evaluate(()=>window.KOKU_DATA.map(x=>({problem_id:x.problem_id,item_type:x.item_type,correct_answer:x.correct_answer,correct_order:x.correct_order,correct_position:x.correct_position,exact_answer:x.exact_answer,choices:x.choices})));
            assert(data.length===102,label+' data count '+data.length);
            await p.click('#teacher');
            let pass=0;
            for(const q of data){
              await p.fill('#pid',q.problem_id);await p.click('#pidGo');
              const choice=Array.isArray(q.choices)&&q.choices.length;
              if(choice){
                const want=String(q.correct_answer);
                const btns=p.locator('#answer .choices button');
                const n=await btns.count();let hit=false;
                for(let i=0;i<n;i++){
                  const t=(await btns.nth(i).innerText()).trim();
                  if(t===want||t.startsWith(want+' ')||t.startsWith(want+'　')){await btns.nth(i).click();hit=true;break;}
                }
                assert(hit,label+' choice missing '+q.problem_id+' '+want);
              }else{
                await p.fill('#written',String(canonical(q)));
              }
              await p.click('#submit');
              const result=(await p.locator('#result h3').innerText()).trim();
              assert(result.includes('正解'),label+' grade fail '+q.problem_id+' '+result);
              pass++;
            }
            return pass;
          }
          async function extra(p,label){
            // wrong-answer/history/weakness/review paths
            await p.fill('#pid',(await p.evaluate(()=>window.KOKU_DATA[0].problem_id)));await p.click('#pidGo');
            const btns=p.locator('#answer .choices button');
            if(await btns.count()>1){await btns.nth(0).click();const ca=await p.evaluate(()=>window.KOKU_DATA[0].correct_answer);const t=(await btns.nth(0).innerText()).trim();if(t.startsWith(String(ca)))await btns.nth(1).click();await p.click('#submit');assert((await p.locator('#result h3').innerText()).includes('要確認'),label+' wrong path');}
            await p.click('#weakBtn');assert((await p.locator('#weakness').innerText()).includes('弱点診断'),label+' weakness');
            const ov=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,w:innerWidth}));assert(ov.sw<=ov.w+4,label+' overflow '+JSON.stringify(ov));
          }
          async function run(browserType,label,viewport){
            const b=await browserType.launch({headless:true});const p=await b.newPage({viewport});const errs=[];p.on('pageerror',e=>errs.push(String(e)));p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});
            await openReady(p,label);const n=await gradeAll(p,label);await extra(p,label);assert(errs.length===0,label+' errors '+errs.join(' | '));let pdfBytes=0;
            if(label==='desktop'){
              await p.emulateMedia({media:'print'});const pdf=await p.pdf({format:'A4',printBackground:true,margin:{top:'10mm',right:'10mm',bottom:'10mm',left:'10mm'}});pdfBytes=pdf.length;assert(pdfBytes>5000,'A4 PDF too small '+pdfBytes);
            }
            await b.close();return {n,pdfBytes};
          }
          (async()=>{const d=await run(chromium,'desktop',{width:1280,height:900});console.log('DESKTOP_PASS '+JSON.stringify(d));const i=await run(webkit,'iphone',{width:390,height:844});console.log('IPHONE_PASS '+JSON.stringify(i));console.log('KOKU_PUBLIC_PASS_102_102_DESKTOP_IPHONE_A4')})().catch(e=>{console.error('KOKU_PUBLIC_FAIL '+(e.stack||e));process.exitCode=1});
          NODE
          code=$?
          if grep -q 'KOKU_PUBLIC_PASS_102_102_DESKTOP_IPHONE_A4' /tmp/koku-public.txt && [ "$code" -eq 0 ]; then result='KOKU_PUBLIC_PASS_102_102_DESKTOP_IPHONE_A4'; else result='KOKU_PUBLIC_FAIL'; fi
          {
            echo "checked_at_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "source_sha=${GITHUB_SHA}"
            echo "public_url=https://yo666ha-boop.github.io/reading-app/koku-app/"
            echo "result=$result"
            cat /tmp/koku-public.txt
          } > KOKU_PUBLIC_VALIDATION.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add KOKU_PUBLIC_VALIDATION.txt
          git commit -m 'Record koku public validation [skip ci]' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
          if [ "$result" = 'KOKU_PUBLIC_PASS_102_102_DESKTOP_IPHONE_A4' ]; then exit 0; else exit 1; fi
