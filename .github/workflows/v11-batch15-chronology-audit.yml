name: v11 Batch15 chronology audit
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch15_g1_body_draft.json'
      - 'v11_batch15_g2_body_draft.json'
      - 'v11_batch15_g3_body_draft.json'
      - 'v11_batch15_chronology_audit.js'
      - '.github/workflows/v11-batch15-chronology-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Batch15 vocab and grammar chronology
        id: gate
        continue-on-error: true
        run: node v11_batch15_chronology_audit.js
      - name: Persist exact Batch15 chronology reports
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V11_BATCH15_CHRONOLOGY_STATUS.txt V11_BATCH15_VOCAB_CHRONOLOGY_REPORT.json V11_BATCH15_GRAMMAR_CANDIDATE_REPORT.json V11_BATCH15_GRAMMAR_CHRONOLOGY_REPORT.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit(v11): persist Batch15 chronology reports'
            git pull --rebase origin v11-1000passage-easy-notes
            git push origin HEAD:v11-1000passage-easy-notes
          fi
      - name: Upload chronology reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-batch15-chronology
          path: |
            V11_BATCH15_CHRONOLOGY_STATUS.txt
            V11_BATCH15_VOCAB_CHRONOLOGY_REPORT.json
            V11_BATCH15_GRAMMAR_CANDIDATE_REPORT.json
            V11_BATCH15_GRAMMAR_CHRONOLOGY_REPORT.json
      - name: Fail if chronology failed
        if: steps.gate.outcome == 'failure'
        run: exit 1
