name: Math Source Rebuild Contract

on:
  workflow_dispatch:
  push:
    branches:
      - math-problem-bank-bootstrap
    paths:
      - 'math-bank/scripts/verify_source_archives.py'
      - 'math-bank/scripts/test_verify_source_archives.py'
      - '.github/workflows/math-source-rebuild-contract.yml'

permissions:
  contents: write

jobs:
  source-identity-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout math branch
        uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile verifier
        run: python -m py_compile math-bank/scripts/verify_source_archives.py math-bank/scripts/test_verify_source_archives.py

      - name: Run renamed-copy exact SHA and fail-closed regression
        run: python math-bank/scripts/test_verify_source_archives.py

      - name: Confirm real-source verification stays blocked when source ZIPs are not committed
        shell: bash
        run: |
          set +e
          python math-bank/scripts/verify_source_archives.py --source-dir math-bank/source --report /tmp/math-source-verification.json --strict
          rc=$?
          set -e
          if find math-bank/source -maxdepth 1 -type f -name '*.zip' -print -quit 2>/dev/null | grep -q .; then
            if [ "$rc" -ne 0 ]; then
              echo 'FAIL: committed source ZIPs exist but exact historical SHA verification failed'
              cat /tmp/math-source-verification.json
              exit 1
            fi
            echo 'PASS_REAL_SOURCE_ARCHIVES_EXACT_SHA'
          else
            if [ "$rc" -ne 2 ]; then
              echo "FAIL: absent real source ZIPs must fail closed with rc=2, got $rc"
              exit 1
            fi
            echo 'PASS_REAL_SOURCE_ARCHIVES_ABSENT_FAIL_CLOSED'
          fi

      - name: Persist source rebuild contract PASS
        if: success()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          TRIGGERING_SHA: ${{ github.sha }}
        run: |
          git pull --rebase origin math-problem-bank-bootstrap
          mkdir -p math-bank/state
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
            'workflow': 'Math Source Rebuild Contract',
            'status': 'PASS_CI',
            'run_id': os.environ['RUN_ID'],
            'triggering_sha': os.environ['TRIGGERING_SHA'],
            'tested_head_after_rebase': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
            'renamed_copy_suffix_supported': True,
            'exact_historical_sha_required': True,
            'hash_mismatch_fail_closed': True,
            'real_source_archives_committed': any(Path('math-bank/source').glob('*.zip')),
            'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          Path('math-bank/state/source-rebuild-contract-latest.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add math-bank/state/source-rebuild-contract-latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'record math source rebuild contract PASS [skip ci]'
            git push origin HEAD:math-problem-bank-bootstrap
          fi
