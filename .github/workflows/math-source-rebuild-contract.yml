name: Math Source Rebuild Contract

on:
  workflow_dispatch:
  push:
    branches: [math-problem-bank-bootstrap]
    paths:
      - 'math-bank/scripts/verify_source_archives.py'
      - 'math-bank/scripts/test_verify_source_archives.py'
      - 'math-bank/scripts/profile_source_archives.py'
      - 'math-bank/scripts/test_profile_source_archives.py'
      - 'math-bank/scripts/build_source_member_manifest.py'
      - 'math-bank/scripts/test_build_source_member_manifest.py'
      - 'math-bank/scripts/profile_math_json_paths.py'
      - 'math-bank/scripts/test_profile_math_json_paths.py'
      - 'math-bank/scripts/validate_rebuilt_raw_records.py'
      - 'math-bank/scripts/test_validate_rebuilt_raw_records.py'
      - 'math-bank/scripts/create_winpass_review_queue.py'
      - 'math-bank/scripts/test_create_winpass_review_queue.py'
      - 'math-bank/scripts/audit_winpass_normalization.py'
      - 'math-bank/scripts/test_audit_winpass_normalization.py'
      - 'math-bank/scripts/apply_winpass_normalization.py'
      - 'math-bank/scripts/test_apply_winpass_normalization.py'
      - 'math-bank/scripts/validate_rebuilt_originals.py'
      - 'math-bank/scripts/test_validate_rebuilt_originals.py'
      - 'math-bank/scripts/validate_rebuilt_app_mapping.py'
      - 'math-bank/scripts/test_validate_rebuilt_app_mapping.py'
      - 'math-bank/scripts/freeze_rebuilt_originals.py'
      - 'math-bank/scripts/test_freeze_rebuilt_originals.py'
      - 'math-bank/scripts/validate_frozen_rebuilt_originals.py'
      - 'math-bank/scripts/test_validate_frozen_rebuilt_originals.py'
      - '.github/workflows/math-source-rebuild-contract.yml'

permissions:
  contents: write

jobs:
  source-rebuild-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile rebuild tools
        run: |
          python -m py_compile \
            math-bank/scripts/verify_source_archives.py math-bank/scripts/test_verify_source_archives.py \
            math-bank/scripts/profile_source_archives.py math-bank/scripts/test_profile_source_archives.py \
            math-bank/scripts/build_source_member_manifest.py math-bank/scripts/test_build_source_member_manifest.py \
            math-bank/scripts/profile_math_json_paths.py math-bank/scripts/test_profile_math_json_paths.py \
            math-bank/scripts/validate_rebuilt_raw_records.py math-bank/scripts/test_validate_rebuilt_raw_records.py \
            math-bank/scripts/create_winpass_review_queue.py math-bank/scripts/test_create_winpass_review_queue.py \
            math-bank/scripts/audit_winpass_normalization.py math-bank/scripts/test_audit_winpass_normalization.py \
            math-bank/scripts/apply_winpass_normalization.py math-bank/scripts/test_apply_winpass_normalization.py \
            math-bank/scripts/validate_rebuilt_originals.py math-bank/scripts/test_validate_rebuilt_originals.py \
            math-bank/scripts/validate_rebuilt_app_mapping.py math-bank/scripts/test_validate_rebuilt_app_mapping.py \
            math-bank/scripts/freeze_rebuilt_originals.py math-bank/scripts/test_freeze_rebuilt_originals.py \
            math-bank/scripts/validate_frozen_rebuilt_originals.py math-bank/scripts/test_validate_frozen_rebuilt_originals.py
      - name: Run source identity and structure tests
        run: |
          python math-bank/scripts/test_verify_source_archives.py
          python math-bank/scripts/test_profile_source_archives.py
          python math-bank/scripts/test_build_source_member_manifest.py
          python math-bank/scripts/test_profile_math_json_paths.py
      - name: Run raw and Winpass evidence tests
        run: |
          python math-bank/scripts/test_validate_rebuilt_raw_records.py
          python math-bank/scripts/test_create_winpass_review_queue.py
          python math-bank/scripts/test_audit_winpass_normalization.py
          python math-bank/scripts/test_apply_winpass_normalization.py
      - name: Run final 1124 mapping freeze binding tests
        run: |
          python math-bank/scripts/test_validate_rebuilt_originals.py
          python math-bank/scripts/test_validate_rebuilt_app_mapping.py
          python math-bank/scripts/test_freeze_rebuilt_originals.py
          python math-bank/scripts/test_validate_frozen_rebuilt_originals.py
      - name: Confirm real source path remains fail-closed without exact ZIP bytes
        shell: bash
        run: |
          set +e
          python math-bank/scripts/verify_source_archives.py --source-dir math-bank/source --report /tmp/id.json --strict; verify_rc=$?
          python math-bank/scripts/profile_source_archives.py --source-dir math-bank/source --report /tmp/profile.json --strict; profile_rc=$?
          python math-bank/scripts/build_source_member_manifest.py --source-dir math-bank/source --report /tmp/manifest.json --strict; manifest_rc=$?
          python math-bank/scripts/profile_math_json_paths.py --source-dir math-bank/source --report /tmp/paths.json --strict; paths_rc=$?
          set -e
          python - "$verify_rc" "$profile_rc" "$manifest_rc" "$paths_rc" <<'PY'
          import json,pathlib,sys
          vr,pr,mr,xr=map(int,sys.argv[1:5]); identity=json.loads(pathlib.Path('/tmp/id.json').read_text()); profile=json.loads(pathlib.Path('/tmp/profile.json').read_text()); manifest=json.loads(pathlib.Path('/tmp/manifest.json').read_text()); paths=json.loads(pathlib.Path('/tmp/paths.json').read_text())
          if identity.get('promotable_to_historical_canonical_without_revalidation') is not False: raise SystemExit('FAIL old canonical masquerade guard')
          if identity.get('policy',{}).get('raw_diagnostic_records_never_promote_directly') is not True: raise SystemExit('FAIL raw direct promotion guard')
          exact=bool(identity.get('ready_for_rebuild_pipeline'))
          if vr != (0 if exact else 2): raise SystemExit(f'FAIL verify rc {vr}')
          if exact:
              ep=0 if profile.get('ready_for_record_extraction') else 3; em=0 if manifest.get('ready_for_raw_extraction') else 5; ex=0 if paths.get('ready_for_schema_specific_extractor') else 6
              if (pr,mr,xr)!=(ep,em,ex): raise SystemExit(f'FAIL downstream {(pr,mr,xr)} expected {(ep,em,ex)}')
          elif (pr,mr,xr)!=(3,5,6): raise SystemExit(f'FAIL absent source downstream {(pr,mr,xr)}')
          print('PASS_SOURCE_REBUILD_FAIL_CLOSED_REAL_INPUT_GATE')
          PY
      - name: Persist source rebuild contract terminal
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          TRIGGERING_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          tested=$(git rev-parse HEAD 2>/dev/null || true)
          git fetch origin math-problem-bank-bootstrap
          git checkout -B math-problem-bank-bootstrap origin/math-problem-bank-bootstrap
          git pull --rebase origin math-problem-bank-bootstrap
          mkdir -p math-bank/state
          python - "$tested" <<'PY'
          import json,os,sys
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path('math-bank/state/source-rebuild-contract-latest.json'); current={}
          if p.exists():
              try: current=json.loads(p.read_text(encoding='utf-8'))
              except Exception: current={}
          run=int(os.environ['RUN_ID']); prior=int(current.get('run_id',0) or 0)
          if prior>run:
              print(f'STALE_SKIP prior run {prior} > current {run}'); raise SystemExit(0)
          tested=sys.argv[1]; exact=(tested==os.environ['TRIGGERING_SHA']); ok=os.environ['JOB_STATUS']=='success' and exact
          payload={'workflow':'Math Source Rebuild Contract','status':'PASS_CI' if ok else 'FAIL_CI_DIAGNOSTIC','mode':'AUDITED_RECONSTRUCTION_FROM_EXACT_SOURCE_INPUTS','run_id':str(run),'triggering_sha':os.environ['TRIGGERING_SHA'],'tested_checkout_sha':tested,'tested_checkout_equals_triggering_sha':exact,'job_status':os.environ['JOB_STATUS'],'stale_run_overwrite_guard':True,'exact_historical_source_sha_required':True,'raw_record_count_qa_fingerprint_gate_required':True,'winpass_decision_exact_record_fingerprint_binding_required':True,'winpass_normalization_materialization_gate_required':True,'rebuilt_1124_originals_global_validation_required':True,'rebuilt_app_mapping_evidence_required_before_freeze':True,'mapping_defaults_without_source_evidence_forbidden':True,'immutable_rebuilt_originals_freeze_required':True,'immutable_rebuilt_originals_full_record_sha_sequence_required':True,'immutable_rebuilt_originals_manifest_revalidation_required_before_variants':True,'winpass_count_forcing_forbidden':True,'raw_1271_direct_promotion_forbidden':True,'required_rebuild_targets':{'documents':140,'raw':{'Winpass':717,'実力錬成':237,'Standard':317},'validated_originals':{'Winpass':570,'実力錬成':237,'Standard':317,'total':1124}},'recorded_at_utc':datetime.now(timezone.utc).isoformat()}
          p.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add math-bank/state/source-rebuild-contract-latest.json
          if ! git diff --cached --quiet; then git commit -m 'record math source rebuild contract terminal [skip ci]'; git pull --rebase origin math-problem-bank-bootstrap; git push origin HEAD:math-problem-bank-bootstrap; fi
