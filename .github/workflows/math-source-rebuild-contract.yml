name: Math Source Rebuild Contract

on:
  workflow_dispatch:
  push:
    branches:
      - math-problem-bank-bootstrap
    paths:
      - 'math-bank/scripts/verify_source_archives.py'
      - 'math-bank/scripts/test_verify_source_archives.py'
      - 'math-bank/scripts/profile_source_archives.py'
      - 'math-bank/scripts/test_profile_source_archives.py'
      - 'math-bank/scripts/build_source_member_manifest.py'
      - 'math-bank/scripts/test_build_source_member_manifest.py'
      - 'math-bank/scripts/profile_math_json_paths.py'
      - 'math-bank/scripts/test_profile_math_json_paths.py'
      - 'math-bank/scripts/validate_rebuilt_raw_records.py'
      - 'math-bank/scripts/test_validate_rebuilt_raw_records.py'
      - 'math-bank/scripts/create_winpass_review_queue.py'
      - 'math-bank/scripts/test_create_winpass_review_queue.py'
      - 'math-bank/scripts/audit_winpass_normalization.py'
      - 'math-bank/scripts/test_audit_winpass_normalization.py'
      - '.github/workflows/math-source-rebuild-contract.yml'

permissions:
  contents: write

jobs:
  source-rebuild-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout math branch
        uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile rebuild tools
        run: |
          python -m py_compile \
            math-bank/scripts/verify_source_archives.py \
            math-bank/scripts/test_verify_source_archives.py \
            math-bank/scripts/profile_source_archives.py \
            math-bank/scripts/test_profile_source_archives.py \
            math-bank/scripts/build_source_member_manifest.py \
            math-bank/scripts/test_build_source_member_manifest.py \
            math-bank/scripts/profile_math_json_paths.py \
            math-bank/scripts/test_profile_math_json_paths.py \
            math-bank/scripts/validate_rebuilt_raw_records.py \
            math-bank/scripts/test_validate_rebuilt_raw_records.py \
            math-bank/scripts/create_winpass_review_queue.py \
            math-bank/scripts/test_create_winpass_review_queue.py \
            math-bank/scripts/audit_winpass_normalization.py \
            math-bank/scripts/test_audit_winpass_normalization.py

      - name: Run exact source identity rebuild gate tests
        run: python math-bank/scripts/test_verify_source_archives.py

      - name: Run source structure profile tests
        run: python math-bank/scripts/test_profile_source_archives.py

      - name: Run exact source member manifest tests
        run: python math-bank/scripts/test_build_source_member_manifest.py

      - name: Run recursive MATH.json schema path profiler tests
        run: python math-bank/scripts/test_profile_math_json_paths.py

      - name: Run rebuilt raw record validation tests
        run: python math-bank/scripts/test_validate_rebuilt_raw_records.py

      - name: Run Winpass fingerprint review queue tests
        run: python math-bank/scripts/test_create_winpass_review_queue.py

      - name: Run evidence-bound Winpass normalization tests
        run: python math-bank/scripts/test_audit_winpass_normalization.py

      - name: Confirm real source rebuild stays fail-closed until exact source ZIPs are available in runner
        shell: bash
        run: |
          set +e
          python math-bank/scripts/verify_source_archives.py --source-dir math-bank/source --report /tmp/math-source-verification.json --strict
          verify_rc=$?
          python math-bank/scripts/profile_source_archives.py --source-dir math-bank/source --report /tmp/math-source-profile.json --strict
          profile_rc=$?
          python math-bank/scripts/build_source_member_manifest.py --source-dir math-bank/source --report /tmp/math-source-member-manifest.json --strict
          manifest_rc=$?
          python math-bank/scripts/profile_math_json_paths.py --source-dir math-bank/source --report /tmp/math-source-json-paths.json --strict
          paths_rc=$?
          set -e
          python - "$verify_rc" "$profile_rc" "$manifest_rc" "$paths_rc" <<'PY'
          import json, pathlib, sys
          verify_rc, profile_rc, manifest_rc, paths_rc = map(int, sys.argv[1:5])
          identity=json.loads(pathlib.Path('/tmp/math-source-verification.json').read_text(encoding='utf-8'))
          profile=json.loads(pathlib.Path('/tmp/math-source-profile.json').read_text(encoding='utf-8'))
          manifest=json.loads(pathlib.Path('/tmp/math-source-member-manifest.json').read_text(encoding='utf-8'))
          paths=json.loads(pathlib.Path('/tmp/math-source-json-paths.json').read_text(encoding='utf-8'))
          if identity.get('promotable_to_historical_canonical_without_revalidation') is not False:
              raise SystemExit('FAIL: source inputs may not masquerade as old canonical bytes')
          if identity.get('policy',{}).get('raw_diagnostic_records_never_promote_directly') is not True:
              raise SystemExit('FAIL: raw diagnostic direct-promotion guard missing')
          exact=bool(identity.get('ready_for_rebuild_pipeline'))
          expected_verify=0 if exact else 2
          if verify_rc != expected_verify:
              raise SystemExit(f'FAIL source identity strict rc={verify_rc}, expected {expected_verify}')
          if exact:
              expected_profile=0 if profile.get('ready_for_record_extraction') else 3
              expected_manifest=0 if manifest.get('ready_for_raw_extraction') else 5
              expected_paths=0 if paths.get('ready_for_schema_specific_extractor') else 6
              if profile_rc != expected_profile:
                  raise SystemExit(f'FAIL source profile rc={profile_rc}, expected {expected_profile}')
              if manifest_rc != expected_manifest:
                  raise SystemExit(f'FAIL source member manifest rc={manifest_rc}, expected {expected_manifest}')
              if paths_rc != expected_paths:
                  raise SystemExit(f'FAIL source schema paths rc={paths_rc}, expected {expected_paths}')
          else:
              if profile_rc != 3 or manifest_rc != 5 or paths_rc != 6:
                  raise SystemExit(f'FAIL absent/nonexact source must block profile/manifest/paths: {profile_rc}/{manifest_rc}/{paths_rc}')
          print('PASS_SOURCE_REBUILD_INPUT_MEMBER_SHA_SCHEMA_PATHS_FAIL_CLOSED_AND_FULL_REAUDIT_REQUIRED')
          PY

      - name: Persist source rebuild contract PASS
        if: success()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          TRIGGERING_SHA: ${{ github.sha }}
        run: |
          git pull --rebase origin math-problem-bank-bootstrap
          mkdir -p math-bank/state
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          real_sources = any(Path('math-bank/source').glob('*.zip'))
          payload = {
            'workflow': 'Math Source Rebuild Contract',
            'status': 'PASS_CI',
            'mode': 'AUDITED_RECONSTRUCTION_FROM_EXACT_SOURCE_INPUTS',
            'run_id': os.environ['RUN_ID'],
            'triggering_sha': os.environ['TRIGGERING_SHA'],
            'tested_head_after_rebase': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
            'renamed_copy_suffix_supported': True,
            'exact_historical_source_sha_required': True,
            'member_sha256_manifest_required_before_extraction': True,
            'recursive_schema_path_profile_required_before_extractor': True,
            'raw_record_count_qa_fingerprint_gate_required': True,
            'raw_figure_resolution_gate_required': True,
            'winpass_fingerprint_bound_review_queue_required': True,
            'hash_mismatch_fail_closed': True,
            'raw_1271_direct_promotion_forbidden': True,
            'historical_canonical_byte_claim_without_old_zip_forbidden': True,
            'source_reconstruction_allowed_after_full_reaudit': True,
            'winpass_717_decision_coverage_required': True,
            'winpass_exclusion_evidence_required': True,
            'winpass_count_forcing_forbidden': True,
            'required_rebuild_targets': {
              'documents': 140,
              'raw': {'Winpass':717,'実力錬成':237,'Standard':317},
              'validated_originals': {'Winpass':570,'実力錬成':237,'Standard':317,'total':1124},
            },
            'real_source_archives_committed': real_sources,
            'next_if_sources_available': 'identity -> member SHA manifest -> 140-doc profile -> recursive schema paths -> raw 717/237/317 -> raw QA/figure/fingerprint gate -> Winpass fingerprint review queue -> evidence decisions for all 717 -> full 1124 validation',
            'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          Path('math-bank/state/source-rebuild-contract-latest.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add math-bank/state/source-rebuild-contract-latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'record math source rebuild contract PASS [skip ci]'
            git push origin HEAD:math-problem-bank-bootstrap
          fi
