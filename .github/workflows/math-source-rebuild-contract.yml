name: Math Source Archive Identity Contract

on:
  workflow_dispatch:
  push:
    branches:
      - math-problem-bank-bootstrap
    paths:
      - 'math-bank/scripts/verify_source_archives.py'
      - 'math-bank/scripts/test_verify_source_archives.py'
      - '.github/workflows/math-source-rebuild-contract.yml'

permissions:
  contents: write

jobs:
  source-identity-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout math branch
        uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile verifier
        run: python -m py_compile math-bank/scripts/verify_source_archives.py math-bank/scripts/test_verify_source_archives.py

      - name: Run renamed-copy exact SHA diagnostic-only and fail-closed regression
        run: python math-bank/scripts/test_verify_source_archives.py

      - name: Confirm source identity verification never authorizes canonical rebuild
        shell: bash
        run: |
          set +e
          python math-bank/scripts/verify_source_archives.py --source-dir math-bank/source --report /tmp/math-source-verification.json --strict
          rc=$?
          set -e
          python - "$rc" <<'PY'
          import json, pathlib, sys
          rc=int(sys.argv[1])
          obj=json.loads(pathlib.Path('/tmp/math-source-verification.json').read_text(encoding='utf-8'))
          if obj.get('promotable_to_canonical') is not False:
              raise SystemExit('FAIL source archive verification became canonical-promotable')
          if obj.get('ready_for_real_rebuild') is not False:
              raise SystemExit('FAIL source archive verification authorized canonical rebuild')
          if obj.get('mode') != 'DIAGNOSTIC_ONLY_NON_CANONICAL':
              raise SystemExit('FAIL source archive verification mode is not diagnostic-only')
          exact=bool(obj.get('exact_source_archives_verified_for_diagnostics'))
          expected_rc=0 if exact else 2
          if rc != expected_rc:
              raise SystemExit(f'FAIL strict diagnostic rc={rc}, expected {expected_rc}')
          print('PASS_SOURCE_IDENTITY_DIAGNOSTIC_ONLY_NO_CANONICAL_REBUILD')
          PY

      - name: Persist source identity contract PASS
        if: success()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          TRIGGERING_SHA: ${{ github.sha }}
        run: |
          git pull --rebase origin math-problem-bank-bootstrap
          mkdir -p math-bank/state
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
            'workflow': 'Math Source Archive Identity Contract',
            'status': 'PASS_CI',
            'mode': 'DIAGNOSTIC_ONLY_NON_CANONICAL',
            'run_id': os.environ['RUN_ID'],
            'triggering_sha': os.environ['TRIGGERING_SHA'],
            'tested_head_after_rebase': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
            'renamed_copy_suffix_supported': True,
            'exact_historical_sha_required': True,
            'hash_mismatch_fail_closed': True,
            'promotable_to_canonical': False,
            'ready_for_real_rebuild': False,
            'no_reconstruction_from_source_archives': True,
            'canonical_base_requires_exact_recorded_zip_audit_pair': True,
            'real_source_archives_committed': any(Path('math-bank/source').glob('*.zip')),
            'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          Path('math-bank/state/source-rebuild-contract-latest.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add math-bank/state/source-rebuild-contract-latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'record math source identity contract PASS [skip ci]'
            git push origin HEAD:math-problem-bank-bootstrap
          fi
