name: v10 reference minimum rule audit
on:
  push:
    branches: [v10-reference-slash-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --no-package-lock jsdom@24.1.3
      - name: Reference minimum-rule full 168 audit
        run: node v10_reference_minimum_rule_audit.js
