name: v11 Batch15 vocab gate R6
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch15_vocab_gate_r6.js'
      - '.github/workflows/v11-batch15-vocab-gate-r6.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run independent vocab gate
        id: gate
        continue-on-error: true
        run: node v11_batch15_vocab_gate_r6.js
      - name: Persist R6 truth
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V11_BATCH15_VOCAB_GATE_R6_REPORT.json V11_BATCH15_VOCAB_GATE_R6_STATUS.txt V11_BATCH15_VOCAB_GATE_R6_RESIDUAL.txt
          git commit -m 'audit(v11): persist Batch15 vocab gate R6 truth'
          git pull --rebase origin v11-1000passage-easy-notes
          git push origin HEAD:v11-1000passage-easy-notes
      - name: Fail closed when residual remains
        if: steps.gate.outcome == 'failure'
        run: exit 1
