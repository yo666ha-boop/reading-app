name: v11 Batch14 G1 length repair
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch14_g1_length_repair.js'
      - '.github/workflows/v11-batch14-g1-length-repair.yml'
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Sync latest branch before repair
        run: git pull --rebase origin v11-1000passage-easy-notes
      - name: Apply reviewed semantic repairs
        run: node v11_batch14_g1_length_repair.js
      - name: Verify repaired draft
        run: node v11_batch14_g1_draft_audit.js
      - name: Persist repaired draft and audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v11_batch14_g1_body_draft.json V11_BATCH14_G1_DRAFT_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m 'v11: repair Batch14 G1 long passage lengths'
            git push origin HEAD:v11-1000passage-easy-notes
          fi
