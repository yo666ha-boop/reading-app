name: Math Checkpoint Protected Preview SSO Audit 20260902

on:
  push:
    branches: [math-problem-bank-bootstrap]
    paths:
      - '.github/workflows/math-checkpoint-protected-preview-sso-audit-20260902.yml'

permissions:
  contents: write

jobs:
  sync-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 1
      - name: Update checkpoint without overwriting a newer branch state
        shell: bash
        run: |
          set -euo pipefail
          START_SHA="$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('math-bank/state/checkpoint.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['current_stage']='APP1323_EXACT_PREVIEW_SSO_AUTOMATION_BYPASS_PENDING'
          d['current_bucket']='EXACT_1323_PREVIEW_READY_SOURCE_VERIFIED_SSO_AUTOMATION_ACCESS_BLOCKED_PHYSICAL_FIRE_PENDING'
          d['recorded_at_jst']='2026-09-02T03:04:00+09:00'
          audit={
            'artifact':'math-bank/state/app1323-protected-preview-automation-access-audit-20260902T0303JST.json',
            'deployment_id':'dpl_EpduWwwW1xvyr6v7MrXhA5ad4ecm',
            'deployment_ready':True,
            'source_bytes':6819806,
            'source_sha256':'47893e010514fffa44d45dac3832cf502aee075345b1ecdf378f69d764b32521',
            'curl_run_id':33540686258,
            'curl_result':'SSO_PAGE_NOT_APP',
            'playwright_run_id':33540791689,
            'playwright_job_id':99966233027,
            'playwright_artifact_id':9813600789,
            'playwright_result':'SSO_LOGIN_BOUNDARY',
            'origin_document_status':302,
            'remote_body_identity':'PENDING',
            'supported_next_route':'VERCEL_AUTOMATION_BYPASS_SECRET',
            'connector_bypass_mutation_available':False,
            'progress_credit':0
          }
          d.setdefault('downstream',{})['protected_preview_automation_access_audit']=audit
          la=d.setdefault('latest_audits',[])
          if audit['artifact'] not in la: la.append(audit['artifact'])
          d['exact_stop']='The isolated exact1323 preview remains READY and the authenticated Drive source rechecks byte-for-byte. Both a curl cookie-jar attempt and a fresh Playwright Chromium session were redirected to Vercel Login before the app document could be served; the browser evidence artifact proves the origin returned HTTP 302 and final URL was Vercel Login. This is a Deployment Protection automation-access blocker, not an app-content failure. Do not credit remote body identity. The supported route is a VERCEL_AUTOMATION_BYPASS_SECRET, but the currently exposed Vercel connector does not provide a mutation to generate/update it. Physical Fire remains mandatory. PUBLICATION_READY=false.'
          d['next_start']='Do not redeploy or repeat Winpass review. Keep dpl_EpduWwwW1xvyr6v7MrXhA5ad4ecm. Establish supported automation bypass access for isolated project prj_klR6v3xfehqPFqb2BPwZaaoy9m3A, then verify served body against 6,819,806 bytes / SHA256 47893e010514fffa44d45dac3832cf502aee075345b1ecdf378f69d764b32521 and run exact-origin Chromium/Firefox/WebKit-iPhone/localStorage/A4. Physical Fire must pass before strict release/public isolated verification.'
          d['main_untouched']=True
          d['downstream']['publication_ready']=False
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git fetch origin math-problem-bank-bootstrap
          REMOTE_SHA=$(git rev-parse origin/math-problem-bank-bootstrap)
          if [ "$REMOTE_SHA" != "$START_SHA" ]; then
            echo "A newer branch state exists ($REMOTE_SHA != $START_SHA); refusing stale checkpoint write."
            exit 75
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add math-bank/state/checkpoint.json
          git commit -m 'math: advance checkpoint to SSO automation bypass pending'
          git push origin HEAD:math-problem-bank-bootstrap
