name: v11 Batch10 question quality audit
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch10_question_human_rewrite.js'
      - 'v11_batch10_question_quality_audit.js'
      - '.github/workflows/v11-batch10-question-quality-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node v11_batch10_question_quality_audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-batch10-question-quality
          path: V11_BATCH10_QUESTION_QUALITY_REPORT.json
