name: v11 Batch15 chronology rerun after grammar R2
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - '.github/workflows/v11-batch15-chronology-rerun-after-grammar-r2.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --package-lock=false jsdom@24
      - name: Run exact Batch15 chronology gate
        id: gate
        continue-on-error: true
        run: node v11_batch15_chronology_audit.js
      - name: Persist reports
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in V11_BATCH15_CHRONOLOGY_STATUS.txt V11_BATCH15_VOCAB_CHRONOLOGY_REPORT.json V11_BATCH15_GRAMMAR_CANDIDATE_REPORT.json V11_BATCH15_GRAMMAR_CHRONOLOGY_REPORT.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'audit(v11): rerun Batch15 chronology after grammar R2'
            git pull --rebase origin v11-1000passage-easy-notes
            git push origin HEAD:v11-1000passage-easy-notes
          fi
      - name: Preserve fail-closed result
        if: steps.gate.outcome == 'failure'
        run: exit 1
