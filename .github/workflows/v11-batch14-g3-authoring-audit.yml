name: v11 Batch14 G3 authoring audit
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch14_g3_body_draft_part*.json'
      - 'v11_batch14_g3_merge_parts.js'
      - 'v11_batch14_g3_draft_audit.js'
      - 'v11_batch14_g3_chronology_audit.js'
      - '.github/workflows/v11-batch14-g3-authoring-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --package-lock=false jsdom@24
      - name: Merge G3 parts
        id: merge
        run: node v11_batch14_g3_merge_parts.js
      - name: Run G3 draft audit
        id: draft
        continue-on-error: true
        run: node v11_batch14_g3_draft_audit.js
      - name: Run G3 chronology audit
        id: chronology
        continue-on-error: true
        run: node v11_batch14_g3_chronology_audit.js
      - name: Summarize G3 missing vocab
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='V11_BATCH14_G3_VOCAB_CHRONOLOGY_REPORT.json';
          if(!fs.existsSync(p)) process.exit(0);
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          function compact(rows){
            const m=new Map();
            for(const x of rows||[]){
              const w=String(x.word||'').toLowerCase();
              if(!w)continue;
              if(!m.has(w))m.set(w,{word:w,count:0,passages:new Set(),books:new Set(),sections:new Set(),intro:x.intro||null,base:x.base||null});
              const y=m.get(w); y.count++; y.passages.add(x.id); y.books.add(x.book); y.sections.add(x.section); if(!y.intro&&x.intro)y.intro=x.intro;if(!y.base&&x.base)y.base=x.base;
            }
            return [...m.values()].map(x=>({...x,passages:[...x.passages],books:[...x.books],sections:[...x.sections]})).sort((a,b)=>a.word.localeCompare(b.word));
          }
          const out={generatedAt:new Date().toISOString(),unregisteredOccurrences:r.unregisteredOccurrences,futureVocabLeakOccurrences:r.futureVocabLeakOccurrences,unregisteredUnique:compact(r.unresolved),futureUnique:compact(r.future)};
          out.unregisteredUniqueCount=out.unregisteredUnique.length; out.futureUniqueCount=out.futureUnique.length;
          fs.writeFileSync('V11_BATCH14_G3_MISSING_VOCAB_UNIQUE.json',JSON.stringify(out,null,2)+'\n');
          console.log(`g3_missing_unique unregistered=${out.unregisteredUniqueCount} future=${out.futureUniqueCount}`);
          NODE
      - name: Persist G3 master and actuals
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for f in v11_batch14_g3_body_draft.json V11_BATCH14_G3_DRAFT_AUDIT.json V11_BATCH14_G3_CHRONOLOGY_STATUS.txt V11_BATCH14_G3_VOCAB_CHRONOLOGY_REPORT.json V11_BATCH14_G3_GRAMMAR_CANDIDATE_REPORT.json V11_BATCH14_G3_GRAMMAR_CHRONOLOGY_REPORT.json V11_BATCH14_G3_MISSING_VOCAB_UNIQUE.json; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m 'v11: persist Batch14 G3 authoring actuals'
            git push origin HEAD:v11-1000passage-easy-notes
          fi
      - name: Enforce G3 gates
        if: steps.merge.outcome != 'success' || steps.draft.outcome != 'success' || steps.chronology.outcome != 'success'
        run: exit 1
