name: V11 Batch16 Formal Grammar
on:
  push:
    branches:
      - v11-1000passage-easy-notes
    paths:
      - '.github/workflows/v11-b16-formal-grammar.yml'
      - 'scripts/v11_batch16_formal_grammar_chronology.js'
      - 'V11_BATCH16_BODY_TRANSLATION_DRAFT_G1_001_010.json'
      - 'V11_BATCH16_BODY_TRANSLATION_DRAFT_G1_011_017.json'
      - 'V11_BATCH16_BODY_TRANSLATION_DRAFT_G2_001_008.json'
      - 'V11_BATCH16_BODY_TRANSLATION_DRAFT_G2_009_017.json'
      - 'V11_BATCH16_BODY_TRANSLATION_DRAFT_G3_001_008.json'
      - 'V11_BATCH16_BODY_TRANSLATION_DRAFT_G3_009_016.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  formal-grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run formal grammar chronology
        run: node scripts/v11_batch16_formal_grammar_chronology.js
        continue-on-error: true
      - name: Persist report
        run: |
          test -f V11_BATCH16_FORMAL_GRAMMAR_CHRONOLOGY_REPORT.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V11_BATCH16_FORMAL_GRAMMAR_CHRONOLOGY_REPORT.json
          if git diff --cached --quiet; then
            echo 'No report changes'
          else
            git commit -m 'audit(v11): persist Batch16 formal grammar chronology'
            git push origin HEAD:v11-1000passage-easy-notes
          fi
      - name: Enforce gate result
        run: |
          node -e "const r=require('./V11_BATCH16_FORMAL_GRAMMAR_CHRONOLOGY_REPORT.json'); console.log(JSON.stringify({passages:r.passages,unresolved:r.unresolvedOccurrences,future:r.futureGrammarLeak,finalPass:r.finalPass},null,2)); if(!r.finalPass) process.exit(2)"
