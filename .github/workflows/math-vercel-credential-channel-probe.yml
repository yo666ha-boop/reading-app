name: Math Deployment Credential Channel Probe

on:
  push:
    branches:
      - math-problem-bank-bootstrap
    paths:
      - '.github/workflows/math-vercel-credential-channel-probe.yml'
      - 'math-bank/state/vercel-credential-probe-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe credential presence without exposing secret values
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              echo "$name=AVAILABLE"
            else
              echo "$name=MISSING"
            fi
          }
          probe MATH_VERCEL_CREDENTIAL_CHANNEL "${VERCEL_TOKEN:-}"
          probe MATH_GOOGLE_DRIVE_TOKEN_CHANNEL "${GOOGLE_DRIVE_TOKEN:-}"
          probe MATH_GDRIVE_TOKEN_CHANNEL "${GDRIVE_TOKEN:-}"
          probe MATH_DRIVE_TOKEN_CHANNEL "${DRIVE_TOKEN:-}"
          probe MATH_GOOGLE_SERVICE_ACCOUNT_JSON_CHANNEL "${GOOGLE_SERVICE_ACCOUNT_JSON:-}"
          probe MATH_GDRIVE_SERVICE_ACCOUNT_JSON_CHANNEL "${GDRIVE_SERVICE_ACCOUNT_JSON:-}"
          probe MATH_GOOGLE_CREDENTIALS_CHANNEL "${GOOGLE_CREDENTIALS:-}"
          probe MATH_GOOGLE_APPLICATION_CREDENTIALS_JSON_CHANNEL "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}"
