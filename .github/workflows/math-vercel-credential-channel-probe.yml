name: Math Vercel Credential Channel Probe

on:
  push:
    branches:
      - math-problem-bank-bootstrap
    paths:
      - '.github/workflows/math-vercel-credential-channel-probe.yml'
      - 'math-bank/state/vercel-credential-probe-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe credential presence without exposing secret
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo 'MATH_VERCEL_CREDENTIAL_CHANNEL=AVAILABLE'
          else
            echo 'MATH_VERCEL_CREDENTIAL_CHANNEL=MISSING'
          fi
