name: v11 cross-batch quality audit
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch*_passages_*.js'
      - 'v11_batch*_uniqueness_repair.js'
      - 'v11_batch02_bootstrap.js'
      - 'v11_batch03_bootstrap.js'
      - 'v11_batch03_register.js'
      - '.github/workflows/v11-cross-batch-quality-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Cross-batch semantic diversity gate
        run: |
          python3 -m http.server 8000 >/tmp/v11-cross-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright');
          function assert(c,m){if(!c)throw new Error(m)}
          function jac(a,b){a=new Set(a);b=new Set(b);let i=0;for(const x of a)if(b.has(x))i++;return i/(a.size+b.size-i)}
          (async()=>{let b;try{
            b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1280,height:900}});
            const errs=[];p.on('pageerror',e=>errs.push(String(e)));
            const r=await p.goto('http://127.0.0.1:8000/index.html?cross='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});assert(r&&r.ok(),'HTTP '+(r&&r.status()));
            await p.waitForFunction(()=>window.V10_RUNTIME_LOAD_PROGRESS==='complete',{timeout:120000});
            await p.waitForFunction(()=>window.V11_BATCH03_LOADED===true,{timeout:120000});
            const all=await p.evaluate(()=>{const out=[];for(const k of Object.keys(window)){if(/^V11_BATCH\d+_PASSAGES$/.test(k)&&Array.isArray(window[k]))for(const x of window[k])out.push({id:x.id,textbook:x.textbook,grade:x.grade,section:x.section,sentences:x.sentences||[]});}return out;});
            const ids=new Set(),bodies=new Map(),bad=[];for(const x of all){if(ids.has(x.id))bad.push('duplicate-id:'+x.id);ids.add(x.id);const body=x.sentences.join(' ');if(bodies.has(body))bad.push('duplicate-body:'+bodies.get(body)+':'+x.id);else bodies.set(body,x.id);}
            const severe=[];for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){const a=all[i],c=all[j];if(a.textbook!==c.textbook||a.grade!==c.grade||a.section!==c.section)continue;const s=jac(a.sentences,c.sentences);if(s>=0.85)severe.push({a:a.id,b:c.id,score:+s.toFixed(3)});}
            console.log(JSON.stringify({count:all.length,bad,severe:severe.slice(0,100)},null,2));assert(all.length===150,'expected 150 v11 additions, got '+all.length);assert(bad.length===0,bad.join(' | '));assert(severe.length===0,'cross-batch near duplicates '+JSON.stringify(severe.slice(0,20)));assert(errs.length===0,errs.join(' | '));console.log('V11_CROSS_BATCH_QUALITY_150_PASS');
          }finally{if(b)await b.close().catch(()=>{})}})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
