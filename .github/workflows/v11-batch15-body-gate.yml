name: v11 Batch15 Body Gate
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch15_authoring_plan.json'
      - 'v11_batch15_g1_body_draft.json'
      - 'v11_batch15_g2_body_draft.json'
      - 'v11_batch15_g3_body_draft.json'
      - 'v11_batch15_body_gate.js'
      - '.github/workflows/v11-batch15-body-gate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run fail-closed Batch15 body gate and retain result
        id: gate
        continue-on-error: true
        run: node v11_batch15_body_gate.js
      - name: Commit exact gate report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V11_BATCH15_BODY_GATE.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit(v11): persist Batch15 body gate report after R2'
            git pull --rebase origin v11-1000passage-easy-notes
            git push origin HEAD:v11-1000passage-easy-notes
          fi
      - name: Upload gate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-batch15-body-gate
          path: V11_BATCH15_BODY_GATE.json
          if-no-files-found: error
      - name: Fail if gate failed
        if: steps.gate.outcome == 'failure'
        run: exit 1
