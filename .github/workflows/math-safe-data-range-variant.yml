name: Math Safe Data Range Variant Engine

on:
  push:
    branches: [math-problem-bank-bootstrap]
    paths:
      - 'math-bank/app/safe_data_range_variant_engine.py'
      - 'math-bank/app/test_safe_data_range_variant_engine.py'
      - 'math-bank/app/test_data_range_unified_adapter.py'
      - 'math-bank/app/generate_all_safe_verified_variants.py'
      - '.github/workflows/math-safe-data-range-variant.yml'
  workflow_dispatch:

concurrency:
  group: math-safe-data-range-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: |
          python -m py_compile \
            math-bank/app/safe_data_range_variant_engine.py \
            math-bank/app/test_safe_data_range_variant_engine.py \
            math-bank/app/test_data_range_unified_adapter.py \
            math-bank/app/generate_all_safe_verified_variants.py
      - name: Run exact data-range engine and unified adapter regressions
        working-directory: math-bank/app
        run: |
          python test_safe_data_range_variant_engine.py
          python test_data_range_unified_adapter.py
      - name: Persist verified data-range engine state
        env:
          RUN_ID: ${{ github.run_id }}
          TRIGGERING_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload={
            'status':'PASS_CI',
            'run_id':os.environ['RUN_ID'],
            'triggering_sha':os.environ['TRIGGERING_SHA'],
            'recorded_at_utc':datetime.now(timezone.utc).isoformat(),
            'engine':'data_range',
            'actual_base_variants_generated':0,
            'base_required_before_actual_generation':True,
            'parent_record_sha256_required':True,
            'independent_identity':'min+range == max',
            'parent_metadata_and_audit_contract_verified':True,
            'empty_list_non_choice_supported':True,
            'table_frequency_multi_stat_figure_real_choice_fail_closed':True,
            'strict_validator_remains_promotion_gate':True,
          }
          p=Path('math-bank/state/data-range-variant-engine-latest.json')
          p.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- math-bank/state/data-range-variant-engine-latest.json
          git commit -m 'record data range variant engine CI' || exit 0
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin math-problem-bank-bootstrap && git push origin HEAD:math-problem-bank-bootstrap && exit 0
            sleep $((i*4))
          done
          exit 1
