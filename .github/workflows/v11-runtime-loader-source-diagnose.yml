name: v11 runtime loader source diagnose
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - '.github/workflows/v11-runtime-loader-source-diagnose.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});try{const p=await b.newPage();await p.goto('http://127.0.0.1:8000/index.html?srcdiag='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});await p.waitForFunction(()=>window.V10_RUNTIME_LOAD_PROGRESS==='complete',{timeout:120000});await p.waitForTimeout(1000);const x=await p.evaluate(()=>({scripts:[...document.scripts].map((s,i)=>({i,src:s.src,async:s.async,defer:s.defer,text:!s.src?s.textContent.slice(0,4000):''})).filter(x=>x.src.includes('v11')||x.text.includes('v11')||x.text.includes('V11')),html:document.documentElement.outerHTML.match(/.{0,300}v11_batch01.{0,800}/is)?.[0]||'NO_HTML_MATCH'}));console.log(JSON.stringify(x,null,2));}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
