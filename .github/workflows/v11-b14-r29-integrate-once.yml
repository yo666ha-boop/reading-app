name: v11 Batch14 R29 integrate once

on:
  push:
    branches:
      - v11-1000passage-easy-notes
    paths:
      - '.github/workflows/v11-b14-r29-integrate-once.yml'

permissions:
  contents: write

# rerun-marker: r30-g3-011-pm-fix
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Re-run R29 idempotently
        run: node v11_batch14_integrate_question_overlays_r29_20260909.js
      - name: Apply human semantic slash R30
        run: node v11_batch14_apply_g3_slash_r30_20260909.js
      - name: Verify questions and slash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('v11_batch14_assembled_draft.json','utf8'));
          const ps = j.passages || [];
          const slashExpected={4:10,6:26,9:24,10:14,11:21,12:10,13:13,14:26,15:10};
          let slashTotal=0;
          for (let n=4;n<=16;n++) {
            const id=`V11-B14-G3-${String(n).padStart(3,'0')}`;
            const p=ps.find(x=>x.id===id);
            if(!p) throw new Error(`missing ${id}`);
            const A=p.questions||[], B=p.questionSetB||[];
            if(A.length!==5 || B.length!==5) throw new Error(`A/B count fail ${id}: ${A.length}/${B.length}`);
            for(const q of [...A,...B]){
              if(!q.answer || !q.reason || !q.evidence || !q.evidenceJp) throw new Error(`missing field ${id} ${q.id}`);
              if(!p.body.includes(q.evidence)) throw new Error(`evidence exact fail ${id} ${q.id}`);
              if(!p.fullTranslation.includes(q.evidenceJp)) throw new Error(`evidenceJp exact fail ${id} ${q.id}`);
            }
            if(slashExpected[n]!==undefined){
              const rows=p.slashRows||[];
              if(rows.length!==slashExpected[n]) throw new Error(`slash count fail ${id}: ${rows.length}`);
              for(const r of rows){
                if(!r.english || !r.japanese || !r.humanReview) throw new Error(`slash field fail ${id}`);
                if(!p.body.includes(r.english)) throw new Error(`slash EN exact fail ${id}`);
                if(!p.fullTranslation.includes(r.japanese)) throw new Error(`slash JP exact fail ${id}`);
              }
              slashTotal += rows.length;
            }
          }
          if(slashTotal!==154) throw new Error(`slash total ${slashTotal}`);
          console.log('G3 questions exact PASS; human slash PASS total=154');
          NODE
      - name: Commit assembled only
        run: |
          if git diff --quiet -- v11_batch14_assembled_draft.json; then
            echo 'No assembled changes'; exit 0
          fi
          git config user.name 'chatgpt-batch14-worker'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v11_batch14_assembled_draft.json
          git commit -m 'Batch14: apply G3 human slash maps to assembled'
          git push origin HEAD:v11-1000passage-easy-notes
