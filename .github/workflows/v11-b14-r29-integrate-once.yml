name: v11 Batch14 finalize assembled R35 R36

on:
  push:
    branches:
      - v11-1000passage-easy-notes
    paths:
      - '.github/workflows/v11-b14-r29-integrate-once.yml'

permissions:
  contents: write

# rerun-marker: r36-finalize-assembled-20260910-0022
jobs:
  finalize-assembled:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply R29 R30 R34 R32 chain
        run: node v11_batch14_post_assembly_r35.js
      - name: Apply contextual required-local gloss R36
        run: node v11_batch14_apply_gloss_r36.js
      - name: Fail-closed verify assembled core
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('v11_batch14_assembled_draft.json','utf8'));
          const ps=j.passages||[];
          if(ps.length!==50) throw new Error(`passages=${ps.length}`);
          const compact=s=>String(s||'').replace(/\s+/g,'');
          let qBad=0, fieldBad=0, evidenceBad=0, slashBad=0, slashCoverageBad=0;
          for(const p of ps){
            const A=p.questions||[], B=p.questionSetB||[];
            if(A.length!==5||B.length!==5){qBad++; console.error('QCOUNT',p.id,A.length,B.length);}
            for(const q of [...A,...B]){
              if(!q.answer||!q.reason||!q.evidence||!q.evidenceJp){fieldBad++; console.error('QFIELD',p.id,q.id); continue;}
              const eok=p.body.includes(q.evidence)||q.evidence.split(' / ').every(s=>p.body.includes(s));
              const jok=p.fullTranslation.includes(q.evidenceJp)||q.evidenceJp.split(' / ').every(s=>p.fullTranslation.includes(s));
              if(!eok||!jok){evidenceBad++; console.error('EVIDENCE',p.id,q.id,eok,jok);}
            }
            const rows=p.slashRows||[];
            if(!rows.length||rows.some(r=>!r.english||!r.japanese)){slashBad++; console.error('SLASHFIELD',p.id,rows.length); continue;}
            for(const r of rows){
              if(!p.body.includes(r.english)||!p.fullTranslation.includes(r.japanese)){slashBad++; console.error('SLASHEXACT',p.id); break;}
            }
            if(compact(rows.map(r=>r.english).join(' '))!==compact(p.body)||compact(rows.map(r=>r.japanese).join(''))!==compact(p.fullTranslation)){
              slashCoverageBad++; console.error('SLASHCOVERAGE',p.id);
            }
          }
          console.log(JSON.stringify({passages:ps.length,qBad,fieldBad,evidenceBad,slashBad,slashCoverageBad,status:j.status,r34:j.r34ApplySummary,r36:j.r36ApplySummary&&j.r36ApplySummary.appliedCount}));
          if(qBad||fieldBad||evidenceBad||slashBad||slashCoverageBad) process.exit(1);
          NODE
      - name: Write core gate checkpoint
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('v11_batch14_assembled_draft.json','utf8'));
          const out={batch:'V11-B14',checkedAt:new Date().toISOString(),passages:j.passages.length,status:'ASSEMBLED_CORE_PASS_PENDING_CHRONOLOGY_NOTES_DUP_RUNTIME',registered:false,headBefore:process.env.GITHUB_SHA,r34ApplySummary:j.r34ApplySummary||null,r36ApplySummary:j.r36ApplySummary||null};
          fs.writeFileSync('v11_batch14_core_gate_r37_20260910.json',JSON.stringify(out,null,2)+'\n');
          NODE
      - name: Commit assembled and core checkpoint
        run: |
          if git diff --quiet -- v11_batch14_assembled_draft.json v11_batch14_core_gate_r37_20260910.json; then
            echo 'No changes'; exit 0
          fi
          git config user.name 'chatgpt-batch14-worker'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v11_batch14_assembled_draft.json v11_batch14_core_gate_r37_20260910.json
          git commit -m 'Batch14: apply R35 R36 to assembled and pass core gate'
          git push origin HEAD:v11-1000passage-easy-notes
