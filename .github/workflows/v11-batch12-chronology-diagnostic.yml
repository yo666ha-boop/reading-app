name: V11 Batch12 Chronology Diagnostic
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'V11_BATCH12_VOCAB_CHRONOLOGY_REPORT.json'
      - 'V11_BATCH12_GRAMMAR_CHRONOLOGY_REPORT.json'
      - 'v11_batch12_chronology_diagnostic.js'
      - '.github/workflows/v11-batch12-chronology-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
          fetch-depth: 0
      - run: node v11_batch12_chronology_diagnostic.js
      - name: Persist diagnostic without rolling back concurrent work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V11_BATCH12_CHRONOLOGY_DIAGNOSTIC.json
          git diff --cached --quiet || git commit -m "v11: persist Batch12 chronology diagnostic"
          git pull --rebase origin v11-1000passage-easy-notes
          git push origin HEAD:v11-1000passage-easy-notes
