name: v11 Preview Live Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - v11-1000passage-easy-notes
    paths:
      - '.github/workflows/v11-preview-live-smoke.yml'
      - 'v11_batch13_runtime_bundle.js'
      - 'V11_BATCH13_RUNTIME_BUNDLE_STATUS.json'

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PREVIEW_URL: https://yo666ha-boop.github.io/reading-app/v11-preview/
      EXPECTED_TOTAL: '818'
    steps:
      - name: Wait for exact GitHub Pages preview publication
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            body="$(curl -fsSL --max-time 20 "${PREVIEW_URL}PREVIEW_SOURCE.txt?ts=$(date +%s)" || true)"
            echo "attempt=$i"
            echo "$body"
            if echo "$body" | grep -q "expected_registered_total=${EXPECTED_TOTAL}" && echo "$body" | grep -q "source_sha=${GITHUB_SHA}"; then
              exit 0
            fi
            sleep 5
          done
          echo "Preview did not publish exact source_sha=${GITHUB_SHA} with expected_registered_total=${EXPECTED_TOTAL}" >&2
          exit 1

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify live 818 runtime in Chromium
        shell: bash
        run: |
          cat > v11-live-smoke.cjs <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const url = process.env.PREVIEW_URL;
            const expected = Number(process.env.EXPECTED_TOTAL || 818);
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const consoleErrors = [];
            const pageErrors = [];
            const failedRequests = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => pageErrors.push(String(err && err.stack || err)));
            page.on('requestfailed', req => failedRequests.push({url:req.url(), error:req.failure() && req.failure().errorText}));

            try {
              await page.goto(url + '?liveSmoke=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 120000 });
              const deadline = Date.now() + 120000;
              let result = null;
              while (Date.now() < deadline) {
                result = await page.evaluate(() => {
                  let total = null;
                  try { if (typeof window.getAllPassages === 'function') total = window.getAllPassages().length; } catch (_) {}
                  return {
                    total,
                    getAllPassages: typeof window.getAllPassages,
                    b11: window.V11_BATCH11_STATE || null,
                    b12: window.V11_BATCH12_STATE || null,
                    b13: window.V11_BATCH13_STATE || null,
                    bs11: window.V11_BATCH11_BOOTSTRAP_STATE || null,
                    bs12: window.V11_BATCH12_BOOTSTRAP_STATE || null,
                    bs13: window.V11_BATCH13_BOOTSTRAP_STATE || null,
                    loading11: !!window.V11_BATCH11_BOOTSTRAP_LOADING,
                    loading12: !!window.V11_BATCH12_BOOTSTRAP_LOADING,
                    loading13: !!window.V11_BATCH13_BOOTSTRAP_LOADING,
                    errors: {
                      b11: window.V11_BATCH11_BOOTSTRAP_ERROR || null,
                      b12: window.V11_BATCH12_BOOTSTRAP_ERROR || null,
                      b13: window.V11_BATCH13_BOOTSTRAP_ERROR || null
                    },
                    bodyTextLength: document.body.innerText.length,
                    title: document.title
                  };
                });
                if (result.total === expected && result.b13 && result.b13.registered === true && result.b13.totalWithBaseline === expected && !result.errors.b11 && !result.errors.b12 && !result.errors.b13) break;
                if (result.errors.b11 || result.errors.b12 || result.errors.b13) break;
                await page.waitForTimeout(1000);
              }

              console.log('LIVE_RESULT=' + JSON.stringify(result));
              console.log('PAGE_ERRORS=' + JSON.stringify(pageErrors));
              console.log('CONSOLE_ERRORS=' + JSON.stringify(consoleErrors));
              console.log('FAILED_REQUESTS=' + JSON.stringify(failedRequests));

              if (!result || result.total !== expected) throw new Error(`runtime total ${result && result.total} != ${expected}`);
              if (!result.b13 || result.b13.registered !== true || result.b13.totalWithBaseline !== expected) throw new Error('Batch13 registered state invalid: ' + JSON.stringify(result && result.b13));
              if (result.errors.b11 || result.errors.b12 || result.errors.b13) throw new Error('Bootstrap error present: ' + JSON.stringify(result.errors));
              if (pageErrors.length) throw new Error('pageerror detected: ' + pageErrors.join('\n'));
              if (failedRequests.some(x => /v11_batch1[123].*\.js/.test(x.url))) throw new Error('required Batch11/12/13 request failed: ' + JSON.stringify(failedRequests));
              if (result.bodyTextLength < 100) throw new Error('UI body did not render');

              await page.screenshot({ path: '/tmp/v11-preview-live.png', fullPage: true });
            } finally {
              await browser.close();
            }
          })().catch(err => { console.error(err && err.stack || err); process.exit(1); });
          NODE
          node v11-live-smoke.cjs

      - name: Upload live screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-preview-live-smoke
          path: /tmp/v11-preview-live.png
          if-no-files-found: ignore
