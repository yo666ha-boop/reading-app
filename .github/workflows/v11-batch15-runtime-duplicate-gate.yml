name: v11 Batch15 canonical runtime duplicate gate
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'scripts/v11_batch15_runtime_duplicate_gate.js'
      - '.github/workflows/v11-batch15-runtime-duplicate-gate.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Run canonical runtime duplicate gate
        run: node scripts/v11_batch15_runtime_duplicate_gate.js
      - name: Persist gate evidence
        if: always()
        run: |
          git pull --rebase origin v11-1000passage-easy-notes
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add V11_BATCH15_RUNTIME_DUPLICATE_GATE_REPORT.json V11_BATCH15_RUNTIME_DUPLICATE_GATE_STATUS.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'audit(v11): persist Batch15 canonical runtime duplicate gate'
            git push origin HEAD:v11-1000passage-easy-notes
          fi
