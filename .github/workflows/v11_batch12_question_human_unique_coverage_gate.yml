name: V11 Batch12 Unique Human Question Coverage Gate

on:
  push:
    branches:
      - v11-1000passage-easy-notes
    paths:
      - 'v11_batch12_slash_question_scaffold.json'
      - 'v11_batch12_human_review_layer_r4.json'
      - 'v11_batch12_question_human_review_r5_g1_002_005.json'
      - 'v11_batch12_question_human_review_r6_g1_006_010.json'
      - 'v11_batch12_question_human_review_r7_g1_011_017.json'
      - 'v11_batch12_question_human_review_r7_semantic_sync.js'
      - 'v11_batch12_question_human_review_r8_g2_001_007.json'
      - 'v11_batch12_question_human_review_r8_semantic_sync.js'
      - 'v11_batch12_question_human_review_r9_g2_008_013.json'
      - 'v11_batch12_question_human_review_r10_g2_014_017.json'
      - 'v11_batch12_question_human_review_r11_g3_001_004.json'
      - 'v11_batch12_question_human_review_r11_semantic_sync.js'
      - 'v11_batch12_question_human_review_r12_g3_005_008.json'
      - 'v11_batch12_question_human_review_r12_semantic_sync.js'
      - 'v11_batch12_question_human_review_r13_g3_009_012.json'
      - 'v11_batch12_question_human_review_r14_g3_013_016.json'
      - 'v11_batch12_question_human_unique_coverage_gate.js'
      - '.github/workflows/v11_batch12_question_human_unique_coverage_gate.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate final 50-passage 500-question human-review coverage
        run: node v11_batch12_question_human_unique_coverage_gate.js
