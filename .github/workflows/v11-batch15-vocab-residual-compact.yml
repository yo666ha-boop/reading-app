name: v11 Batch15 vocab residual compact

on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch15_vocab_residual_unique.js'
      - '.github/workflows/v11-batch15-vocab-residual-compact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compact Batch15 residual vocabulary
        run: node v11_batch15_vocab_residual_unique.js | tee v11_batch15_vocab_residual_unique.log
      - name: Persist compact residual
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f v11_batch15_vocab_residual_unique.json v11_batch15_vocab_residual_unique.log
          if ! git diff --cached --quiet; then
            git commit -m 'audit(v11): persist Batch15 compact residual vocab [skip ci]'
            for attempt in 1 2 3; do
              if git push origin HEAD:v11-1000passage-easy-notes; then exit 0; fi
              git fetch origin v11-1000passage-easy-notes
              git rebase origin/v11-1000passage-easy-notes
            done
            exit 1
          fi
