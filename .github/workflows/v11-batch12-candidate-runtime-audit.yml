name: V11 Batch12 Candidate Runtime Audit
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch12_candidate_runtime_audit.js'
      - 'v11_batch12_runtime_bundle.js'
      - 'v11_batch12_register.js'
      - '.github/workflows/v11-batch12-candidate-runtime-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  candidate-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Start static server
        run: python3 -m http.server 8000 >/tmp/v11-b12-http.log 2>&1 &
      - name: Run Batch12 candidate runtime audit after runtime textbook remap
        id: audit
        shell: bash
        run: |
          set +e
          node v11_batch12_candidate_runtime_audit.js
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist candidate report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f V11_BATCH12_CANDIDATE_RUNTIME_AUDIT.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "v11: persist Batch12 candidate runtime audit"
          git pull --rebase origin v11-1000passage-easy-notes
          git push origin HEAD:v11-1000passage-easy-notes
      - name: Enforce candidate runtime
        if: always()
        run: test "${{ steps.audit.outputs.rc }}" = "0"
