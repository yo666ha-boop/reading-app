name: v11 Batch15 Expand Body R2
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch15_expand_body_r2.js'
      - '.github/workflows/v11-batch15-expand-body-r2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Repair authoring script quote literals and syntax-check
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v11_batch15_expand_body_r2.js')
          s=p.read_text()
          s=s.replace("a person's health", "a person\\'s health")
          p.write_text(s)
          PY
          node --check v11_batch15_expand_body_r2.js
      - name: Apply substantive synchronized expansions
        run: node v11_batch15_expand_body_r2.js
      - name: Commit updated body and translations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v11_batch15_g2_body_draft.json v11_batch15_g3_body_draft.json
          if ! git diff --cached --quiet; then
            git commit -m 'author(v11): expand Batch15 G2/G3 bodies and translations R2'
            git pull --rebase origin v11-1000passage-easy-notes
            git push origin HEAD:v11-1000passage-easy-notes
          fi
