name: v11 Batch14 plan audit
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch14_authoring_plan.json'
      - 'v11_batch14_plan_audit.js'
      - 'v11_batch13_final_candidate.json'
      - '.github/workflows/v11-batch14-plan-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit Batch14 plan
        id: audit
        continue-on-error: true
        run: node v11_batch14_plan_audit.js
      - name: Persist audit actual
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add V11_BATCH14_PLAN_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m 'v11: persist Batch14 plan audit actual'
            git pull --rebase origin v11-1000passage-easy-notes
            git push
          fi
      - name: Enforce audit result
        if: steps.audit.outcome != 'success'
        run: exit 1
