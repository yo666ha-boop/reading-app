name: v11 Batch02 PC iPhone A4 audit
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'index.html'
      - 'v11_multi_passage_architecture.js'
      - 'v11_easy_support_notes.js'
      - 'v11_batch02_*.js'
      - '.github/workflows/v11-batch02-cross-platform-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - run: |
          python3 -m http.server 8000 >/tmp/v11-b02-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          node v11_batch02_cross_platform_audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-batch02-a4-evidence
          path: /tmp/v11-b02-a4/*.pdf
          if-no-files-found: warn
