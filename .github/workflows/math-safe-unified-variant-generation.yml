name: Math Safe Unified Variant Generation

on:
  workflow_dispatch:
  push:
    branches: [math-problem-bank-bootstrap]
    paths:
      - 'math-bank/app/generate_all_safe_verified_variants.py'
      - 'math-bank/app/generate_safe_verified_variants.py'
      - 'math-bank/app/safe_*_variant_engine.py'
      - 'math-bank/app/test_safe_*_variant_engine.py'
      - 'math-bank/app/test_*_unified_adapter.py'
      - 'math-bank/app/test_generate_all_safe_verified_variants.py'
      - 'math-bank/app/test_unified_parent_contract_gate.py'
      - 'math-bank/app/test_legacy_empty_choices_exact_generation.py'
      - '.github/workflows/math-safe-unified-variant-generation.yml'

concurrency:
  group: math-safe-unified-variant-generation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: compile
        name: Compile complete math app Python surface
        continue-on-error: true
        run: python -m compileall -q math-bank/app
      - id: specialized
        name: Run every fail-closed specialized engine and unified adapter regression
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        working-directory: math-bank/app
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for f in test_safe_*_variant_engine.py test_*_unified_adapter.py; do
            [ -f "$f" ] || continue
            echo "RUN $f"
            python "$f"
            count=$((count+1))
          done
          test "$count" -gt 0
          echo "PASS_SPECIALIZED_AND_ADAPTER_TEST_COUNT=$count"
      - id: core
        name: Run unified generation regression
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        working-directory: math-bank/app
        run: python test_generate_all_safe_verified_variants.py
      - id: parent_contract
        name: Run unified runtime parent-contract regression
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        working-directory: math-bank/app
        run: python test_unified_parent_contract_gate.py
      - id: legacy_empty_choices
        name: Run legacy empty-choice exact regression
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        working-directory: math-bank/app
        run: python test_legacy_empty_choices_exact_generation.py
      - name: Persist unified-engine CI diagnostics with concurrent-push recovery
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          TRIGGERING_SHA: ${{ github.sha }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          SPECIALIZED_OUTCOME: ${{ steps.specialized.outcome }}
          CORE_OUTCOME: ${{ steps.core.outcome }}
          PARENT_CONTRACT_OUTCOME: ${{ steps.parent_contract.outcome }}
          LEGACY_EMPTY_CHOICES_OUTCOME: ${{ steps.legacy_empty_choices.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          write_state() {
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          outcomes={
            'compile':os.environ.get('COMPILE_OUTCOME','unknown'),
            'specialized_and_adapters':os.environ.get('SPECIALIZED_OUTCOME','unknown'),
            'core':os.environ.get('CORE_OUTCOME','unknown'),
            'parent_contract':os.environ.get('PARENT_CONTRACT_OUTCOME','unknown'),
            'legacy_empty_choices':os.environ.get('LEGACY_EMPTY_CHOICES_OUTCOME','unknown'),
          }
          all_pass=all(v=='success' for v in outcomes.values())
          payload={
            'status':'PASS_CI' if all_pass else 'FAIL_CI_DIAGNOSTIC',
            'persist_schema_version':27,
            'run_id':os.environ['RUN_ID'],
            'triggering_sha':os.environ['TRIGGERING_SHA'],
            'recorded_at_utc':datetime.now(timezone.utc).isoformat(),
            'step_outcomes':outcomes,
            'engine_test_discovery':'test_safe_*_variant_engine.py plus test_*_unified_adapter.py',
            'engines':['affine','symmetric_linear_system','inverse_proportion','pythagorean_hypotenuse','quadratic_square_equation','square_root_simplification','integer_power','single_draw_probability','two_dice_sum_probability','gcd','lcm','prime_factorization','proportion','percentage','discount_price','tax_inclusive_price','data_range','median','mode','relative_frequency','interquartile_range','simple_average','rectangle_area','rectangle_perimeter','circle_area_pi_3_14','circle_circumference_pi_3_14','square_area_and_perimeter','triangle_area','parallelogram_area','trapezoid_area','rectangular_prism_volume','cube_volume','cylinder_volume_pi_3_14','cone_volume_pi_3_14','sphere_area_volume_pi_3_14','speed_distance','binary_arithmetic_exact','linear_equation_exact'],
            'actual_base_variants_generated':0,
            'base_required_before_actual_generation':True,
            'parent_record_sha256_required':True,
            'independent_recalculation_required':True,
            'strict_validator_remains_promotion_gate':True,
            'figure_choice_unsupported_fail_closed':True,
            'empty_list_non_choice_representation_supported':True,
            'legacy_exact_empty_list_non_choice_supported':True,
            'unified_parent_contract_runtime_fail_closed':True,
            'unified_parent_contract_fields':['grade','unit','skill','difficulty','format','question_format','taxonomy','choices','figure_refs','source.parent_id','audit.problem_answer_verified','audit.structure_verified','audit.figure_refs_verified'],
            'fingerprint_bound_manual_queue':True,
            'manual_queue_contains_no_generated_question_or_answer':True,
            'manual_queue_requires_same_strict_validator_before_coverage':True,
            'adaptive_safe_target_planning':True,
            'minimum_per_parent_default':1,
            'safe_target_per_parent_default':3,
            'unsupported_manual_shortfall_only':True,
            'symmetric_linear_system_closed_form_and_double_substitution_identity':True,
            'integer_power_exact_exponentiation_and_repeated_product_identity':True,
            'gcd_euclid_and_exhaustive_common_divisor_identity':True,
            'lcm_product_over_gcd_and_enumerated_common_multiple_identity':True,
            'prime_factorization_all_factors_prime_and_exact_product_recomposition_identity':True,
            'quadratic_square_equation_perfect_square_two_roots_and_root_product_identity':True,
            'two_dice_sum_probability_exhaustive_36_and_triangular_count_identity':True,
            'median_sorted_middle_and_equal_side_count_identity':True,
            'mode_unique_argmax_frequency_and_strict_max_count_identity':True,
            'relative_frequency_exact_fraction_and_cross_product_identity':True,
            'interquartile_range_lower_upper_half_medians_and_double_difference_identity':True,
            'tax_inclusive_exact_fraction_and_tax_cross_product_identity':True,
            'data_range_max_minus_min_and_inverse_identity':True,
            'discount_price_fraction_and_cross_product_identity':True,
            'square_root_exact_factorization_and_square_free_identity':True,
            'inverse_proportion_exact_division_and_product_identity':True,
            'pythagorean_hypotenuse_exact_square_sum_and_two_inverse_identities':True,
            'rectangle_area_exact_product_and_inverse_identity':True,
            'rectangle_perimeter_exact_double_sum_and_two_inverse_identities':True,
            'circle_area_pi_3_14_exact_product_and_two_inverse_identities':True,
            'circle_circumference_pi_3_14_exact_product_and_two_inverse_identities':True,
            'cylinder_volume_pi_3_14_exact_product_and_inverse_identities':True,
            'cone_volume_pi_3_14_exact_one_third_product_and_inverse_identities':True,
            'sphere_area_pi_3_14_exact_4_pi_r2_inverse_identity':True,
            'sphere_volume_pi_3_14_exact_4_over_3_pi_r3_inverse_identity':True,
            'square_area_exact_product_and_integer_square_root_identity':True,
            'square_perimeter_exact_four_side_and_inverse_identity':True,
            'triangle_area_exact_half_product_and_doubled_area_identity':True,
            'parallelogram_area_exact_product_and_inverse_identity':True,
            'trapezoid_area_exact_half_sum_product_and_doubled_area_identity':True,
            'rectangular_prism_volume_exact_product_and_three_inverse_identities':True,
            'cube_volume_exact_product_and_integer_cube_root_identity':True,
            'speed_distance_exact_product_and_two_inverse_identities':True,
          }
          p=Path('math-bank/state/unified-safe-variant-generation-latest.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          }
          for attempt in 1 2 3 4 5 6; do
            git fetch origin math-problem-bank-bootstrap
            git reset --hard origin/math-problem-bank-bootstrap
            write_state
            git add -- math-bank/state/unified-safe-variant-generation-latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'record unified safe variant generation CI'
            if git push origin HEAD:math-problem-bank-bootstrap; then exit 0; fi
            sleep $((attempt*4))
          done
          exit 1
      - name: Enforce unified CI result
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          SPECIALIZED_OUTCOME: ${{ steps.specialized.outcome }}
          CORE_OUTCOME: ${{ steps.core.outcome }}
          PARENT_CONTRACT_OUTCOME: ${{ steps.parent_contract.outcome }}
          LEGACY_EMPTY_CHOICES_OUTCOME: ${{ steps.legacy_empty_choices.outcome }}
        run: |
          test "$COMPILE_OUTCOME" = success
          test "$SPECIALIZED_OUTCOME" = success
          test "$CORE_OUTCOME" = success
          test "$PARENT_CONTRACT_OUTCOME" = success
          test "$LEGACY_EMPTY_CHOICES_OUTCOME" = success
