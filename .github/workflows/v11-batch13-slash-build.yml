name: v11 Batch13 slash build
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch13_final_candidate.json'
      - 'v11_batch13_build_slash_rows.js'
      - '.github/workflows/v11-batch13-slash-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build and audit slash candidate
        run: node v11_batch13_build_slash_rows.js
      - name: Persist generated candidate and review packet
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v11_batch13_slash_candidate.json V11_BATCH13_GROUPED_SLASH_REVIEW_PACKET.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Batch13: materialize slash candidate and grouped review packet'
            git push origin HEAD:v11-1000passage-easy-notes
          fi
