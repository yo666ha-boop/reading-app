name: v11 Batch06 build canonical gloss
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch06_build_canonical_gloss.js'
      - '.github/workflows/v11-batch06-build-canonical-gloss.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node v11_batch06_build_canonical_gloss.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v11_batch06_canonical_gloss.js
          git commit -m "v11: generate Batch06 verified canonical gloss [skip ci]"
          git push
