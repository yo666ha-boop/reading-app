name: v11 Batch03 full draft audit
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch03_passages_draft_g1.js'
      - 'v11_batch03_g1_length_repair.js'
      - 'v11_batch03_passages_draft_g2.js'
      - 'v11_batch03_passages_draft_g3.js'
      - 'v11_batch03_full_draft_audit.js'
      - '.github/workflows/v11-batch03-full-draft-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node v11_batch03_full_draft_audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-batch03-full-draft-audit
          path: V11_BATCH03_FULL_DRAFT_AUDIT.json
