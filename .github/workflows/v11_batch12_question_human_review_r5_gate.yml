name: V11 Batch12 Question Human Review R5 Gate

on:
  push:
    branches:
      - v11-1000passage-easy-notes
    paths:
      - 'v11_batch12_question_human_review_r5_g1_002_005.json'
      - 'v11_batch12_question_human_review_r5_gate.js'
      - '.github/workflows/v11_batch12_question_human_review_r5_gate.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Batch12 R5 human questions
        run: node v11_batch12_question_human_review_r5_gate.js
