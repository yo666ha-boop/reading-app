name: v11 Preview Strict Public UI Audits

on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_multi_passage_architecture.js'
      - 'v11_easy_support_notes.js'
      - 'v11_batch01_grammar_repair.js'
      - 'v11_batch01_cross_platform_audit.js'
      - 'v11_preview_range_wordcount_ui_audit.js'
      - 'v11_preview_multi_passage_ui_audit.js'
      - '.github/workflows/v11-preview-multi-passage-ui-audit.yml'
      - '.github/workflows/v11-preview-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v11-preview-strict-public-ui-audits
  cancel-in-progress: false

jobs:
  audit-public-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check this run is still the latest branch HEAD
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git ls-remote origin refs/heads/v11-1000passage-easy-notes | awk '{print $1}')
          echo "latest_sha=$latest"
          echo "run_sha=${GITHUB_SHA}"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "STALE_RUN_SKIP latest=$latest run=${GITHUB_SHA}"
          fi

      - uses: actions/setup-node@v4
        if: steps.latest.outputs.run == 'true'
        with:
          node-version: '20'
      - if: steps.latest.outputs.run == 'true'
        run: npm install --no-save playwright@1.55.0
      - if: steps.latest.outputs.run == 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Audit published v11-preview learned-range and Word count UI
        if: steps.latest.outputs.run == 'true'
        id: range_audit
        shell: bash
        run: |
          set +e
          EXPECTED_SOURCE_SHA="${GITHUB_SHA}" \
          V11_PREVIEW_URL="https://yo666ha-boop.github.io/reading-app/v11-preview/" \
            node v11_preview_range_wordcount_ui_audit.js
          code=$?
          echo "$code" > /tmp/v11_preview_range_wordcount_ui_audit_exit_code
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Audit published v11-preview six-case multi-passage A/B synchronization
        if: steps.latest.outputs.run == 'true'
        id: multi_audit
        shell: bash
        run: |
          set +e
          EXPECTED_SOURCE_SHA="${GITHUB_SHA}" \
          V11_PREVIEW_URL="https://yo666ha-boop.github.io/reading-app/v11-preview/" \
            node v11_preview_multi_passage_ui_audit.js
          code=$?
          echo "$code" > /tmp/v11_preview_multi_passage_ui_audit_exit_code
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - uses: actions/upload-artifact@v4
        if: steps.latest.outputs.run == 'true' && always()
        with:
          name: v11-preview-strict-public-ui-audits
          path: |
            V11_PREVIEW_RANGE_WORDCOUNT_UI_AUDIT.json
            V11_PREVIEW_MULTI_PASSAGE_UI_AUDIT.json

      - name: Persist audit results on work branch
        if: steps.latest.outputs.run == 'true' && always()
        shell: bash
        run: |
          set -euo pipefail
          cp V11_PREVIEW_RANGE_WORDCOUNT_UI_AUDIT.json /tmp/V11_PREVIEW_RANGE_WORDCOUNT_UI_AUDIT.json
          cp V11_PREVIEW_MULTI_PASSAGE_UI_AUDIT.json /tmp/V11_PREVIEW_MULTI_PASSAGE_UI_AUDIT.json
          git fetch origin v11-1000passage-easy-notes
          git checkout -B v11-1000passage-easy-notes origin/v11-1000passage-easy-notes
          cp /tmp/V11_PREVIEW_RANGE_WORDCOUNT_UI_AUDIT.json V11_PREVIEW_RANGE_WORDCOUNT_UI_AUDIT.json
          cp /tmp/V11_PREVIEW_MULTI_PASSAGE_UI_AUDIT.json V11_PREVIEW_MULTI_PASSAGE_UI_AUDIT.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V11_PREVIEW_RANGE_WORDCOUNT_UI_AUDIT.json V11_PREVIEW_MULTI_PASSAGE_UI_AUDIT.json
          if git diff --cached --quiet; then
            echo 'Audit results already current.'
          else
            git commit -m 'v11: persist strict public UI audit results [skip ci]'
            git push origin HEAD:v11-1000passage-easy-notes
          fi

      - name: Enforce public preview gates
        if: steps.latest.outputs.run == 'true'
        shell: bash
        run: |
          range_code=$(cat /tmp/v11_preview_range_wordcount_ui_audit_exit_code)
          multi_code=$(cat /tmp/v11_preview_multi_passage_ui_audit_exit_code)
          if [ "$range_code" != "0" ] || [ "$multi_code" != "0" ]; then
            echo "Public v11 strict UI audits failed: range=$range_code multi=$multi_code"
            exit 1
          fi
          echo "PUBLIC_V11_STRICT_UI_PASS source_sha=${GITHUB_SHA}"