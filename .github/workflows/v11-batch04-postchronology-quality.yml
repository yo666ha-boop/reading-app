name: v11 Batch04 postchronology quality
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch04_*.js'
      - '.github/workflows/v11-batch04-postchronology-quality.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node v11_batch04_postchronology_quality_audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-batch04-postchronology-quality
          path: V11_BATCH04_POSTCHRONOLOGY_QUALITY_AUDIT.json
