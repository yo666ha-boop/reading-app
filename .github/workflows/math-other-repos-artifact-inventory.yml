name: Math Other Repos Artifact Inventory

on:
  push:
    branches: [math-problem-bank-bootstrap]
    paths:
      - '.github/workflows/math-other-repos-artifact-inventory.yml'
  workflow_dispatch:

concurrency:
  group: math-other-repos-artifact-inventory
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: List public Actions artifact metadata from the other owned repositories
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          from pathlib import Path
          from datetime import datetime, timezone
          repos=['yo666ha-boop/-','yo666ha-boop/english-vocab-app']
          report={
            'scan':'other_owned_repositories_public_actions_artifact_inventory',
            'repos':[],
            'completed_at_utc':None,
            'policy':'Metadata inventory only. No artifact is promoted without exact canonical SHA plus valid final audit.'
          }
          headers={'Accept':'application/vnd.github+json','User-Agent':'mikami-math-recovery'}
          for repo in repos:
            item={'repo':repo,'pages_checked':0,'artifacts':[],'errors':[]}
            for page in range(1,11):
              url=f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}'
              req=urllib.request.Request(url,headers=headers)
              try:
                with urllib.request.urlopen(req,timeout=30) as r:
                  obj=json.load(r)
              except Exception as e:
                item['errors'].append(f'page {page}: {e}')
                break
              item['pages_checked']+=1
              batch=obj.get('artifacts') or []
              for a in batch:
                wr=a.get('workflow_run') or {}
                item['artifacts'].append({
                  'id':a.get('id'),'name':a.get('name'),'size_in_bytes':a.get('size_in_bytes'),
                  'created_at':a.get('created_at'),'updated_at':a.get('updated_at'),'expired':a.get('expired'),
                  'workflow_run_id':wr.get('id'),'head_branch':wr.get('head_branch'),'head_sha':wr.get('head_sha')
                })
              if len(batch)<100: break
            item['artifact_count']=len(item['artifacts'])
            item['unexpired_count']=sum(1 for a in item['artifacts'] if not a.get('expired'))
            item['math_name_candidates']=[a for a in item['artifacts'] if any(k in str(a.get('name') or '').lower() for k in ['math','数学','problem','bank','winpass','canonical'])]
            report['repos'].append(item)
          report['completed_at_utc']=datetime.now(timezone.utc).isoformat()
          p=Path('/tmp/other-repos-artifact-inventory-latest.json')
          p.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Persist inventory race-safely
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin math-problem-bank-bootstrap
          git reset --hard origin/math-problem-bank-bootstrap
          mkdir -p math-bank/state
          cp /tmp/other-repos-artifact-inventory-latest.json math-bank/state/
          git add math-bank/state/other-repos-artifact-inventory-latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'record other-repo Actions artifact inventory'
            git push origin HEAD:math-problem-bank-bootstrap
          fi
