name: Math Exact1323 Transfer Progress

on:
  push:
    branches:
      - math-problem-bank-bootstrap
    paths:
      - 'math-bank/transfer/app1323-exact-br-b64/chunks/**'
      - 'math-bank/transfer/app1323-exact-br-b64/probes/**'
      - 'math-bank/transfer/app1323-exact-br-b64/bulk7k/**'
      - '.github/workflows/math-exact1323-transfer-progress.yml'

permissions:
  contents: write

jobs:
  audit-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 0
      - name: Audit contiguous exact-byte staging and patch checkpoint
        shell: python
        run: |
          import json, pathlib, re, datetime, subprocess
          root=pathlib.Path('math-bank/transfer/app1323-exact-br-b64/chunks'); files=sorted(root.glob('*.txt')); nums=[int(p.stem) for p in files if re.fullmatch(r'\d{3}',p.stem)]
          if nums!=list(range(len(nums))): raise SystemExit(f'non-contiguous chunk indexes: {nums[:5]}...{nums[-5:]}')
          sizes=[p.stat().st_size for p in files]; expected_prefix=[12000,7000,7000,4000]
          if sizes[:4]!=expected_prefix: raise SystemExit(f'prefix size mismatch: {sizes[:4]}')
          if any(x!=1000 for x in sizes[4:]): raise SystemExit('post-003 chunk size mismatch')
          legacy_total=sum(sizes); manifest_path=pathlib.Path('math-bank/transfer/app1323-exact-br-b64/bulk7k/manifest.json'); extra_total=0; durable_end=legacy_total; bulk_manifest=None; manifest_changed=False
          if manifest_path.exists():
              bulk_manifest=json.loads(manifest_path.read_text())
              if bulk_manifest.get('base_offset')!=legacy_total: raise SystemExit(f'bulk base_offset {bulk_manifest.get("base_offset")} != legacy total {legacy_total}')
              probe=bulk_manifest['probe']; probe_path=pathlib.Path(probe['path'])
              if not probe_path.exists() or probe_path.stat().st_size!=probe['chars']: raise SystemExit('probe missing or size mismatch')
              probe_sha=subprocess.check_output(['git','hash-object',str(probe_path)],text=True).strip()
              if probe_sha!=probe['git_blob_sha1']: raise SystemExit(f'probe git sha mismatch: {probe_sha}')
              if probe['start']!=legacy_total or probe['end']!=probe['start']+probe['chars']: raise SystemExit('probe offset mismatch')
              bulk_root=pathlib.Path('math-bank/transfer/app1323-exact-br-b64/bulk7k'); segs=bulk_manifest.get('segments',[]); cursor=probe['end'] if not segs else segs[-1]['end']
              numeric_existing=[]
              for p in bulk_root.glob('*.txt'):
                  if re.fullmatch(r'\d{3}\.txt',p.name): numeric_existing.append((int(p.stem),p))
              numeric_existing.sort(); represented={int(pathlib.Path(s['file']).stem) for s in segs if re.fullmatch(r'\d{3}\.txt',s.get('file',''))}; next_num=max(represented)+1 if represented else 1; by_num=dict(numeric_existing)
              while next_num in by_num:
                  p=by_num[next_num]
                  if p.stat().st_size!=7000: raise SystemExit(f'candidate bulk segment size mismatch: {p}')
                  sha=subprocess.check_output(['git','hash-object',str(p)],text=True).strip(); segs.append({'file':p.name,'path':str(p),'start':cursor,'end':cursor+7000,'chars':7000,'git_blob_sha1':sha}); cursor+=7000; next_num+=1; manifest_changed=True
              if manifest_changed:
                  bulk_manifest['segments']=segs; bulk_manifest['durable_end_offset']=cursor; manifest_path.write_text(json.dumps(bulk_manifest,ensure_ascii=False,separators=(',',':'))+'\n')
              cursor=probe['end']; extra_total+=probe['chars']
              for seg in bulk_manifest.get('segments',[]):
                  p=pathlib.Path(seg.get('path')) if seg.get('path') else (bulk_root/seg['file'])
                  if not p.exists() or p.stat().st_size!=seg['chars']: raise SystemExit(f'bulk segment missing/size mismatch: {seg}')
                  if seg['start']!=cursor or seg['end']!=seg['start']+seg['chars']: raise SystemExit(f'bulk offset mismatch: {seg}')
                  sha=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
                  if sha!=seg['git_blob_sha1']: raise SystemExit(f'bulk git sha mismatch: {seg["file"]} {sha}')
                  cursor=seg['end']; extra_total+=seg['chars']
              durable_end=cursor
              if durable_end!=bulk_manifest.get('durable_end_offset'): raise SystemExit(f'bulk durable_end mismatch: {durable_end}')
          cp_path=pathlib.Path('math-bank/state/checkpoint.json'); cp=json.loads(cp_path.read_text()); st=cp['downstream']['github_exact_byte_staging']; st['durable_chunks']=len(files); st['durable_base64_chars']=durable_end; st['next_offset']=durable_end; st['latest_verified_range']=f'legacy chunks 000-{len(files)-1:03d} through {legacy_total}; SHA-bound probe/bulk extension through {durable_end}'; st['git_data_blob_channel']=f'PROVEN_FOR_SHA_BOUND_BRANCH_ATTACHED_BYTES_THROUGH_OFFSET_{durable_end}'; st['bulk7k_manifest']=str(manifest_path) if bulk_manifest else None; st['bulk7k_extra_chars']=extra_total; cp['recorded_at_jst']=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat(timespec='seconds'); cp_path.write_text(json.dumps(cp,ensure_ascii=False,indent=2)+'\n')
          ev={'project':'mikami-math-problem-bank','stage':'APP1323_EXACT_TRUE_BYTE_TRANSFER_GIT_DATA_BLOB_CHANNEL_PROVEN_PARTIAL','legacy_chunk_files':len(files),'legacy_base64_chars':legacy_total,'sha_bound_extension_chars':extra_total,'durable_base64_chars':durable_end,'source_bytes':st['source_bytes'],'source_sha256':st['source_sha256'],'brotli_bytes':st['brotli_bytes'],'brotli_sha256':st['brotli_sha256'],'base64_chars_total':st['base64_chars'],'release_credit':False,'main_touched':False,'publication_ready':False,'physical_fire':'PENDING','bulk_manifest':str(manifest_path) if bulk_manifest else None}; pathlib.Path('math-bank/state/app1323-transfer-progress-latest.json').write_text(json.dumps(ev,ensure_ascii=False,indent=2)+'\n')
      - name: Commit synchronized durable state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add math-bank/transfer/app1323-exact-br-b64/bulk7k/manifest.json math-bank/state/checkpoint.json math-bank/state/app1323-transfer-progress-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync exact1323 SHA-bound transfer progress"
          git push origin HEAD:math-problem-bank-bootstrap
# trigger: safely auto-extend contiguous verified 7k manifest entries
# trigger: audit bot-promoted 077-082 through offset 692000
# trigger: audit bot-promoted 083-084 through offset 706000
# trigger: audit bot-promoted 085-086 through offset 720000
# trigger: audit bot-promoted 087 through offset 727000
