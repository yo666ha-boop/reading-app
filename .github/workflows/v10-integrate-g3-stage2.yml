name: v10 integrate G3 stage2

on:
  push:
    branches: [v10-rebuild]
    paths:
      - 'v10_stage2_integrate_g3.js'
      - '.github/workflows/v10-integrate-g3-stage2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Integrate G3 into stage2 and DOM test
        run: node v10_stage2_integrate_g3.js
      - name: Install DOM test dependency
        run: npm install --no-save --no-package-lock jsdom@24.1.3
      - name: Verify G3 aggregate and stage2 DOM
        run: |
          node v10_g3_progress_audit.js
          node v10_stage2_dom_test.js
      - name: Commit stage2 integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v10_stage2.html v10_stage2_dom_test.js
          if ! git diff --cached --quiet; then
            git commit -m "Integrate G3 core into v10 stage2 [skip ci]"
            git push
          fi
