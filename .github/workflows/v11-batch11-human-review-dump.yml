name: v11 Batch11 human review dump
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch11_human_review_dump.js'
      - 'v11_batch11_passages_draft_g1.js'
      - 'v11_batch11_passages_draft_g2.js'
      - 'v11_batch11_g3_core.js'
      - 'v11_batch11_passages_draft_g3_standard.js'
      - 'v11_batch11_passages_draft_g3_long.js'
      - 'v11_batch11_passages_draft_g3_yamaguchi_a.js'
      - 'v11_batch11_passages_draft_g3_yamaguchi_b.js'
      - 'v11_batch11_length_repair_r*.js'
      - 'v11_batch11_grammar_repair_r*.js'
      - 'v11_batch11_semantic_repair_r5.js'
      - 'v11_batch11_question_human_rewrite_r1.js'
      - '.github/workflows/v11-batch11-human-review-dump.yml'
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node v11_batch11_human_review_dump.js
      - name: Persist dump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f V11_BATCH11_HUMAN_REVIEW_DUMP.json
          git diff --cached --quiet || git commit -m "v11: persist Batch11 human review dump"
          for n in 1 2 3; do
            git pull --rebase origin v11-1000passage-easy-notes && git push origin HEAD:v11-1000passage-easy-notes && exit 0
            sleep $((n*2))
          done
          exit 1
