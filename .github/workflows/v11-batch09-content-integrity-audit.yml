name: v11 Batch09 content integrity audit
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch09_content_integrity_audit.js'
      - 'v11_batch09_semantic_repair_g1_r1.js'
      - 'v11_batch09_semantic_repair_g2_r1.js'
      - 'v11_batch09_semantic_repair_g3_r1.js'
      - '.github/workflows/v11-batch09-content-integrity-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run integrity audit
        id: integ
        shell: bash
        run: |
          set +e
          node v11_batch09_content_integrity_audit.js
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f V11_BATCH09_CONTENT_INTEGRITY_REPORT.json V11_BATCH09_CONTENT_INTEGRITY_STATUS.txt
          git diff --cached --quiet || git commit -m "v11: persist Batch09 content integrity report"
          git push origin HEAD:v11-1000passage-easy-notes
      - name: Enforce integrity gate
        if: always()
        run: test "${{ steps.integ.outputs.rc }}" = "0"
