name: v11 Batch16 grammar repair
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'scripts/v11_batch16_apply_grammar_fixes.js'
      - '.github/workflows/v11-batch16-grammar-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply Batch16 grammar fixes
        run: |
          if [ -f scripts/v11_batch16_apply_grammar_fixes.js ]; then
            node scripts/v11_batch16_apply_grammar_fixes.js || true
            node scripts/v11_batch16_formal_grammar_chronology.js || true
          fi
      - name: Persist repaired drafts and report
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V11_BATCH16_BODY_TRANSLATION_DRAFT_G1_001_010.json V11_BATCH16_BODY_TRANSLATION_DRAFT_G1_011_017.json V11_BATCH16_BODY_TRANSLATION_DRAFT_G2_001_009.json V11_BATCH16_BODY_TRANSLATION_DRAFT_G2_010_017.json V11_BATCH16_FORMAL_GRAMMAR_CHRONOLOGY_REPORT.json
          git commit -m 'fix(v11): resolve Batch16 formal grammar chronology leaks'
          git push