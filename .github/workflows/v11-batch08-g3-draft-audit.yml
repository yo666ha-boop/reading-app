name: v11 Batch08 Grade3 draft audit
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch08_passages_draft_g3.js'
      - 'v11_batch08_g3_length_repair.js'
      - 'v11_batch08_g3_draft_audit.js'
      - '.github/workflows/v11-batch08-g3-draft-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node v11_batch08_g3_draft_audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-batch08-g3-draft
          path: V11_BATCH08_G3_DRAFT_AUDIT.json
