name: v11 Batch13 Slash Human Gate

on:
  push:
    branches:
      - v11-1000passage-easy-notes
    paths:
      - 'v11_batch13_slash_human_review_manifest.json'
      - 'v11_batch13_verify_slash_human_review.js'
      - 'v11_batch13_build_slash_review_packet.js'
      - 'v11_batch13_build_final_candidate.js'
      - 'v11_batch13_build_body_candidate.js'
      - 'v11_batch13_question_human_slash_sync_*.json'
      - 'v11_batch13_translation_boundary_repair_*.json'
      - '.github/workflows/v11-batch13-slash-human-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-human-slash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact human-reviewed packet fail-closed
        run: node v11_batch13_verify_slash_human_review.js
      - name: Commit verified gate actual
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v11_batch13_slash_human_gate.json
          git commit -m 'Batch13: materialize PASS human slash gate' || true
          git push
      - name: Upload human slash gate actual
        uses: actions/upload-artifact@v4
        with:
          name: v11-batch13-slash-human-gate
          path: v11_batch13_slash_human_gate.json
          if-no-files-found: error
          retention-days: 14
