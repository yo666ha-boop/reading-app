name: v11 Batch14 Persistent Runtime Audit
on:
  push:
    branches: [v11-b14-persistent-run-20260910]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps chromium webkit
      - run: python3 -m http.server 8000 >/tmp/b14-persistent-server.log 2>&1 &
      - run: node v11_batch14_persistent_runtime_audit.js
