name: v11 Batch14 Persistent Runtime Audit
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch14_bootstrap.js'
      - 'v11_batch13_bootstrap.js'
      - 'v11_batch14_register.js'
      - 'v11_batch14_assembled_draft.json'
      - 'v11_batch14_persistent_runtime_audit.js'
      - '.github/workflows/v11-batch14-persistent-runtime-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium webkit
      - name: Serve app
        run: python3 -m http.server 8000 >/tmp/b14-persistent-server.log 2>&1 &
      - name: Audit persistent 868 runtime
        run: node v11_batch14_persistent_runtime_audit.js > /tmp/b14-persistent-audit.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-batch14-persistent-runtime-audit
          path: |
            V11_BATCH14_PERSISTENT_RUNTIME_AUDIT.json
            V11_BATCH14_PERSISTENT_RUNTIME_FAILURE.json
            /tmp/b14-persistent-server.log
            /tmp/b14-persistent-audit.log
