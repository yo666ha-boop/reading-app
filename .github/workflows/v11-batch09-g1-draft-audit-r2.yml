name: v11 Batch09 G1 draft audit r2
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch09_passages_draft_g1.js'
      - 'v11_batch09_g1_length_repair.js'
      - 'v11_batch09_g1_draft_audit_r2.js'
      - '.github/workflows/v11-batch09-g1-draft-audit-r2.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node v11_batch09_g1_draft_audit_r2.js
