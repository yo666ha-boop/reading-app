name: v11 Batch11 human QA extract
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch11_human_qa_extract.js'
      - 'v11_batch11_question_human_rewrite_r9.js'
      - '.github/workflows/v11-batch11-human-qa-extract.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract next human QA passages
        run: node v11_batch11_human_qa_extract.js V11-B11-G2-016 V11-B11-G2-017 V11-B11-G3-001 V11-B11-G3-002 V11-B11-G3-003 V11-B11-G3-004
      - name: Persist extract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f V11_BATCH11_HUMAN_QA_EXTRACT.json
          git diff --cached --quiet || git commit -m "v11: persist Batch11 human QA extract [skip ci]"
          for n in 1 2 3; do
            git pull --rebase origin v11-1000passage-easy-notes && git push origin HEAD:v11-1000passage-easy-notes && exit 0
            sleep $((n*2))
          done
          exit 1
