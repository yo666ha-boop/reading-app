name: v11 Batch09 build vocab repair
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch09_build_vocab_repair.js'
      - '.github/workflows/v11-batch09-build-vocab-repair.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node v11_batch09_build_vocab_repair.js
      - uses: actions/upload-artifact@v4
        with:
          name: v11-batch09-vocab-repair
          path: v11_batch09_vocab_repair.js
