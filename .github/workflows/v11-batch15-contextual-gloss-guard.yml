name: v11 Batch15 contextual gloss guard

on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch15_contextual_gloss_guard.js'
      - '.github/workflows/v11-batch15-contextual-gloss-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply bounded contextual gloss corrections and guard
        run: node v11_batch15_contextual_gloss_guard.js | tee v11_batch15_contextual_gloss_guard.log
      - name: Persist corrected drafts and guard evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f v11_batch15_g1_body_draft.json v11_batch15_g2_body_draft.json v11_batch15_g3_body_draft.json v11_batch15_contextual_gloss_guard_report.json v11_batch15_contextual_gloss_guard.log
          if ! git diff --cached --quiet; then
            git commit -m 'repair(v11): contextual-gloss guard Batch15 verified notes [skip ci]'
            for attempt in 1 2 3; do
              if git push origin HEAD:v11-1000passage-easy-notes; then exit 0; fi
              git fetch origin v11-1000passage-easy-notes
              git rebase origin/v11-1000passage-easy-notes
            done
            exit 1
          fi
