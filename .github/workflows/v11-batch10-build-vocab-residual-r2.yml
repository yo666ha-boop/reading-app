name: v11 Batch10 build vocab residual r2
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch10_build_vocab_residual_r2_apply.js'
      - '.github/workflows/v11-batch10-build-vocab-residual-r2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node v11_batch10_build_vocab_residual_r2_apply.js
      - name: Persist repair layer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f v11_batch10_vocab_residual_r2_apply.js V11_BATCH10_VOCAB_RESIDUAL_R2_APPLY_STATE.json
          git diff --cached --quiet || git commit -m "v11: generate Batch10 post-grammar vocabulary repair r2"
          git push origin HEAD:v11-1000passage-easy-notes
