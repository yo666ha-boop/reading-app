name: v10 passage audit

on:
  push:
    branches: [v10-rebuild]
    paths:
      - 'v10_*.js'
      - 'v10_stage1.html'
      - '.github/workflows/v10-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit all v10 passages
        id: audit
        shell: bash
        run: |
          set +e
          node v10_audit_test.js > v10_audit_report.txt 2>&1
          code=$?
          cat v10_audit_report.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v10_audit_report.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update v10 audit report [skip ci]"
            git push
          fi
      - name: Fail when audit fails
        if: steps.audit.outputs.code != '0'
        run: exit 1
