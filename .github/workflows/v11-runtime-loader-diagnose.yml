name: v11 runtime loader diagnose
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - '.github/workflows/v11-runtime-loader-diagnose.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});try{const p=await b.newPage();await p.goto('http://127.0.0.1:8000/index.html?loaderdiag='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});await p.waitForFunction(()=>window.V10_RUNTIME_LOAD_PROGRESS==='complete',{timeout:120000});await p.waitForTimeout(1000);const x=await p.evaluate(()=>({scripts:[...document.scripts].map(s=>s.src||'[inline]').filter(Boolean),resources:performance.getEntriesByType('resource').map(r=>r.name).filter(x=>/\.js(?:\?|$)/.test(x)),b1:window.V11_BATCH01_LOADED,state:window.V11_BATCH01_STATE,extra:Object.values(window.V11_EXTRA_PASSAGES||{}).reduce((a,x)=>a+(Array.isArray(x)?x.length:0),0)}));console.log(JSON.stringify(x,null,2));}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
