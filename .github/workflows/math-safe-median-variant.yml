name: Math Safe Median Variant

on:
  push:
    branches: [math-problem-bank-bootstrap]
    paths:
      - 'math-bank/app/safe_median_variant_engine.py'
      - 'math-bank/app/test_safe_median_variant_engine.py'
      - 'math-bank/app/test_median_unified_adapter.py'
      - 'math-bank/app/generate_all_safe_verified_variants.py'
      - '.github/workflows/math-safe-median-variant.yml'
  workflow_dispatch:

concurrency:
  group: math-safe-median-variant-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile median engine and tests
        run: |
          python -m py_compile \
            math-bank/app/safe_median_variant_engine.py \
            math-bank/app/test_safe_median_variant_engine.py \
            math-bank/app/test_median_unified_adapter.py \
            math-bank/app/generate_all_safe_verified_variants.py
      - name: Run median fail-closed regression
        working-directory: math-bank/app
        run: python test_safe_median_variant_engine.py
      - name: Run median unified parent-contract regression
        working-directory: math-bank/app
        run: python test_median_unified_adapter.py
