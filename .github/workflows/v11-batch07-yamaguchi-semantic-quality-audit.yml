name: v11 Batch07 Yamaguchi semantic quality audit
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch07_yamaguchi_exam_draft_g3.js'
      - 'v11_batch07_yamaguchi_semantic_repair.js'
      - 'v11_batch07_yamaguchi_exam_evidence_sync.js'
      - 'v11_batch07_yamaguchi_semantic_quality_audit.js'
      - '.github/workflows/v11-batch07-yamaguchi-semantic-quality-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node v11_batch07_yamaguchi_semantic_quality_audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-batch07-yamaguchi-semantic-quality
          path: V11_BATCH07_YAMAGUCHI_SEMANTIC_QUALITY_AUDIT.json
