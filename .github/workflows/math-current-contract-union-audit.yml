name: Math Current Contract Union Audit

on:
  workflow_dispatch:
  push:
    branches:
      - math-problem-bank-bootstrap
    paths:
      - 'math-bank/scripts/audit_current_contract_state_records.py'
      - 'math-bank/scripts/audit_recover_winpass69_from_strict.py'
      - 'math-bank/scripts/migrate_durable_strict_to_current_contract.py'
      - 'math-bank/scripts/validate_raw1271_materialization.py'
      - '.github/workflows/math-current-contract-union-audit.yml'

concurrency:
  group: math-current-contract-union-audit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit-current-contract-union:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout math branch
        uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile audit migration and validator
        run: python -m py_compile math-bank/scripts/audit_current_contract_state_records.py math-bank/scripts/audit_recover_winpass69_from_strict.py math-bank/scripts/migrate_durable_strict_to_current_contract.py math-bank/scripts/validate_raw1271_materialization.py
      - name: Audit and export durable state current-contract union
        run: python math-bank/scripts/audit_current_contract_state_records.py --strict-conflicts --report math-bank/state/current-contract-union-audit-ci.json --records-output math-bank/state/current-contract-existing-pass-ci.jsonl
      - name: Safely migrate structurally complete durable strict records to current contract
        continue-on-error: true
        run: python math-bank/scripts/migrate_durable_strict_to_current_contract.py --output math-bank/state/current-contract-safe-migrated-ci.jsonl --report math-bank/state/current-contract-safe-migration-report-ci.json
      - name: Audit exact recovery path for corrupted Winpass69 artifact
        run: python math-bank/scripts/audit_recover_winpass69_from_strict.py --evidence math-bank/state/app1271-winpass-final109-residual69-current-schema-exact-ooxml-20260901T0253JST.json --report math-bank/state/winpass69-exact-recovery-audit-ci.json
      - name: Upload audit and migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-current-contract-union-audit
          path: |
            math-bank/state/current-contract-union-audit-ci.json
            math-bank/state/current-contract-existing-pass-ci.jsonl
            math-bank/state/current-contract-safe-migrated-ci.jsonl
            math-bank/state/current-contract-safe-migration-report-ci.json
            math-bank/state/winpass69-exact-recovery-audit-ci.json
            math-bank/state/app1271-winpass-final109-residual69-current-schema-exact-ooxml-20260901T0253JST.json
          if-no-files-found: error
