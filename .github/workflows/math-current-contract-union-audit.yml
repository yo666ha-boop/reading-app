name: Math Current Contract Union Audit

on:
  workflow_dispatch:
  push:
    branches:
      - math-problem-bank-bootstrap
    paths:
      - 'math-bank/scripts/audit_current_contract_state_records.py'
      - 'math-bank/scripts/validate_raw1271_materialization.py'
      - '.github/workflows/math-current-contract-union-audit.yml'

concurrency:
  group: math-current-contract-union-audit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit-current-contract-union:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout math branch
        uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile audit and validator
        run: python -m py_compile math-bank/scripts/audit_current_contract_state_records.py math-bank/scripts/validate_raw1271_materialization.py
      - name: Audit durable state JSONL current-contract union
        run: python math-bank/scripts/audit_current_contract_state_records.py --strict-conflicts --report math-bank/state/current-contract-union-audit-ci.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-current-contract-union-audit
          path: math-bank/state/current-contract-union-audit-ci.json
          if-no-files-found: error
