name: v11 Batch16 browser gate R2
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths-ignore:
      - 'V11_BATCH16_BROWSER_GATE_REPORT.json'
      - 'V11_BATCH16_BROWSER_GATE_PREFLIGHT_ERROR.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v11-batch16-browser-gate-r2
  cancel-in-progress: true
jobs:
  browser-gate-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/v11-b16-http.log 2>&1 &
          sleep 2
      - name: Run Batch16 Chromium WebKit iPhone gate
        run: |
          rm -f V11_BATCH16_BROWSER_GATE_PREFLIGHT_ERROR.txt
          node -e "const fs=require('fs'); process.on('uncaughtException',e=>{fs.writeFileSync('V11_BATCH16_BROWSER_GATE_PREFLIGHT_ERROR.txt',String(e&&e.stack||e)+'\\n'); console.error(e); process.exit(1)}); require('./scripts/v11_batch16_browser_gate.js')"
      - name: Persist gate diagnostics
        if: always()
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- V11_BATCH16_BROWSER_GATE_REPORT.json V11_BATCH16_BROWSER_GATE_PREFLIGHT_ERROR.txt || true
          if ! git diff --cached --quiet; then
            git commit -m 'audit(v11): persist Batch16 browser gate R2 diagnostics'
            for n in 1 2 3; do
              git pull --rebase origin v11-1000passage-easy-notes && git push origin HEAD:v11-1000passage-easy-notes && exit 0
              git rebase --abort || true
              sleep $((n*2))
            done
            exit 1
          fi
