name: v11 Batch12 human review R4
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch12_human_review_layer_r4.json'
      - 'v11_batch12_apply_human_review_r4.js'
      - '.github/workflows/v11-batch12-human-review-r4.yml'
  workflow_dispatch:
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply and validate human review R4
        run: node v11_batch12_apply_human_review_r4.js
      - name: Persist human review progress
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f v11_batch12_human_review_progress_r4.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'bot: persist Batch12 human review R4 progress [skip ci]'
          git push
