name: v11 Batch07 gloss coverage audit
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch07_gloss_coverage_audit.js'
      - 'v11_batch06_canonical_gloss.js'
      - 'V11_BATCH07_VOCAB_CHRONOLOGY_REPORT.json'
      - '.github/workflows/v11-batch07-gloss-coverage-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node v11_batch07_gloss_coverage_audit.js
      - name: Persist report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add V11_BATCH07_GLOSS_COVERAGE_AUDIT.json
          git diff --cached --quiet || git commit -m 'v11: record Batch07 gloss coverage [skip ci]'
          git pull --rebase origin v11-1000passage-easy-notes
          git push
