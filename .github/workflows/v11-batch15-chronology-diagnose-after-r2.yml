name: v11 Batch15 chronology diagnose after R2
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - '.github/workflows/v11-batch15-chronology-diagnose-after-r2.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --package-lock=false jsdom@24
      - name: Run chronology and capture exact output
        run: |
          set +e
          node v11_batch15_chronology_audit.js > V11_BATCH15_CHRONOLOGY_R2_RUN.log 2>&1
          code=$?
          echo "exit_code=$code" >> V11_BATCH15_CHRONOLOGY_R2_RUN.log
          set -e
      - name: Persist diagnostics and any refreshed reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V11_BATCH15_CHRONOLOGY_R2_RUN.log
          for f in V11_BATCH15_CHRONOLOGY_STATUS.txt V11_BATCH15_VOCAB_CHRONOLOGY_REPORT.json V11_BATCH15_GRAMMAR_CANDIDATE_REPORT.json V11_BATCH15_GRAMMAR_CHRONOLOGY_REPORT.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m 'audit(v11): persist Batch15 chronology R2 diagnostics' || true
          git pull --rebase origin v11-1000passage-easy-notes
          git push origin HEAD:v11-1000passage-easy-notes
