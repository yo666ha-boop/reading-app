name: v11 Batch10 grammar residual summary
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch10_grammar_residual_summary.js'
      - '.github/workflows/v11-batch10-grammar-residual-summary.yml'
  workflow_dispatch:
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node v11_batch10_grammar_residual_summary.js
