name: v11 Batch09 final gloss audit
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch09_verified_gloss_base.js'
      - 'v11_batch09_manual_gloss_a_h.js'
      - 'v11_batch09_manual_gloss_i_r.js'
      - 'v11_batch09_final_gloss_audit.js'
      - '.github/workflows/v11-batch09-final-gloss-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node v11_batch09_final_gloss_audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-batch09-final-gloss-audit
          path: V11_BATCH09_FINAL_GLOSS_AUDIT.json
