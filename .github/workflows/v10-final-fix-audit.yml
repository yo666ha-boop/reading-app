name: v10 final fix audit

on:
  push:
    branches: [v10-rebuild]
    paths:
      - 'v10_apply_final_runtime_fixes.js'
      - '.github/workflows/v10-final-fix-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply final source fixes
        run: |
          node v10_apply_final_runtime_fixes.js
          node v10_one_time_fix_131_140.js
          for f in v10_semantic_runtime_repairs_[0-9][0-9][0-9]_[0-9][0-9][0-9].js; do node --check "$f"; done
      - name: Install test dependency
        run: npm install --no-save --no-package-lock jsdom@24.1.3
      - name: Run effective audits
        id: audit
        shell: bash
        run: |
          set +e
          : > v10_final_fix_report.txt
          node v10_g3_ss_p3_audit.js >> v10_final_fix_report.txt 2>&1; c1=$?
          node v10_semantic_runtime_audit.js >> v10_final_fix_report.txt 2>&1; c2=$?
          node v10_stage2_dom_test.js >> v10_final_fix_report.txt 2>&1; c3=$?
          node v10_stage2_full_coverage_test.js >> v10_final_fix_report.txt 2>&1; c4=$?
          cat v10_final_fix_report.txt
          code=0; for c in $c1 $c2 $c3 $c4; do if [ "$c" -ne 0 ]; then code=1; fi; done
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist fixes and report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v10_final_fix_report.txt v10_stage2.html v10_data_sunshine_g3_program3.js v10_semantic_runtime_repairs_*.js
          if ! git diff --cached --quiet; then
            git commit -m "Apply final effective-runtime fixes [skip ci]"
            git pull --rebase origin v10-rebuild
            git push
          fi
      - name: Fail if audit still has defects
        if: steps.audit.outputs.code != '0'
        run: exit 1
