name: v11 Batch14 G2 authoring audit
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch14_g2_body_draft.json'
      - 'v11_batch14_g2_wordcount_repair.js'
      - 'v11_batch14_g2_reuse_gloss_repair.js'
      - 'v11_batch14_g2_draft_audit.js'
      - 'v11_batch14_g2_chronology_audit.js'
      - 'v11_batch14_g2_compact_failures.js'
      - '.github/workflows/v11-batch14-g2-authoring-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --package-lock=false jsdom@24
      - name: Apply Batch14 G2 wordcount-policy repair
        id: repair
        run: node v11_batch14_g2_wordcount_repair.js
      - name: Reuse existing canonical Japanese glosses
        id: gloss
        run: node v11_batch14_g2_reuse_gloss_repair.js
      - name: Run Batch14 G2 draft audit
        id: draft
        continue-on-error: true
        run: node v11_batch14_g2_draft_audit.js
      - name: Run Batch14 G2 chronology audit
        id: chronology
        continue-on-error: true
        run: node v11_batch14_g2_chronology_audit.js
      - name: Write compact failure list
        if: always()
        run: node v11_batch14_g2_compact_failures.js || true
      - name: Persist G2 draft and actuals
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for f in v11_batch14_g2_body_draft.json V11_BATCH14_G2_DRAFT_AUDIT.json V11_BATCH14_G2_CHRONOLOGY_STATUS.txt V11_BATCH14_G2_VOCAB_CHRONOLOGY_REPORT.json V11_BATCH14_G2_GRAMMAR_CANDIDATE_REPORT.json V11_BATCH14_G2_GRAMMAR_CHRONOLOGY_REPORT.json V11_BATCH14_G2_COMPACT_FAILURES.txt V11_BATCH14_G2_MISSING_GLOSSES.txt; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m 'v11: persist Batch14 G2 chronology repairs and actuals'
            git push origin HEAD:v11-1000passage-easy-notes
          fi
      - name: Enforce G2 gates
        if: steps.repair.outcome != 'success' || steps.gloss.outcome != 'success' || steps.draft.outcome != 'success' || steps.chronology.outcome != 'success'
        run: exit 1
