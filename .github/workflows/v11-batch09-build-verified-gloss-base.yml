name: v11 Batch09 build verified gloss base
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch09_build_verified_gloss_base.js'
      - '.github/workflows/v11-batch09-build-verified-gloss-base.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node v11_batch09_build_verified_gloss_base.js
      - name: Persist generated base
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v11_batch09_verified_gloss_base.js
          if ! git diff --cached --quiet; then
            git commit -m 'v11: persist Batch09 verified gloss reuse base [skip ci]'
            git pull --rebase origin v11-1000passage-easy-notes
            git push
          fi