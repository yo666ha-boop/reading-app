name: v11 Batch13 Slash Review Packet

on:
  push:
    branches:
      - v11-1000passage-easy-notes
    paths:
      - 'v11_batch13_*.js'
      - 'v11_batch13_slash_human_review_manifest.json'
      - 'v11_batch13_question_boundary_corrections.json'
      - 'v11_batch13_question_human_slash_sync_*.json'
      - 'v11_batch13_translation_boundary_repair_*.json'
      - '.github/workflows/v11-batch13-slash-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-slash-review-packet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build fail-closed packet with diagnostic
        id: build
        shell: bash
        run: |
          set +e
          node v11_batch13_build_slash_review_packet.js 2> v11_batch13_slash_error.txt
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit slash diagnostic on failure
        if: steps.build.outputs.code != '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v11_batch13_slash_error.txt
          git commit -m 'Batch13: record fail-closed slash diagnostic' || true
          git push
      - name: Fail after diagnostic is persisted
        if: steps.build.outputs.code != '0'
        run: exit 1
      - name: Verify review boundary
        if: steps.build.outputs.code == '0'
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('v11_batch13_slash_review_packet.json','utf8'));
          if(p.registered!==false) throw new Error('packet must stay unregistered');
          if(p.humanReviewed!==false) throw new Error('packet must not auto-pass human review');
          if(!p.summary || p.summary.passages!==50) throw new Error('expected 50 passages');
          if(!Number.isInteger(p.summary.rows) || p.summary.rows<=0) throw new Error('row count missing');
          let illegal=0, autoReviewed=0;
          for(const x of p.passages||[]) for(const r of x.rows||[]){
            if(![[1,1],[1,2],[2,1]].some(([a,b])=>r.enSentenceCount===a&&r.jpSentenceCount===b)) illegal++;
            if(r.humanReviewed!==false) autoReviewed++;
          }
          if(illegal) throw new Error(`illegal alignment rows=${illegal}`);
          if(autoReviewed) throw new Error(`auto-reviewed rows=${autoReviewed}`);
          console.log(JSON.stringify({passages:p.summary.passages,rows:p.summary.rows,illegal,autoReviewed}));
          NODE
      - name: Verify exact human-reviewed packet digest
        if: steps.build.outputs.code == '0'
        run: node v11_batch13_verify_slash_human_review.js
      - name: Remove stale slash diagnostic
        if: steps.build.outputs.code == '0'
        run: rm -f v11_batch13_slash_error.txt
      - name: Upload review packet and human gate
        if: steps.build.outputs.code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: v11-batch13-slash-review-packet
          path: |
            v11_batch13_slash_review_packet.json
            v11_batch13_slash_human_gate.json
          if-no-files-found: error
          retention-days: 14
