name: Math Fix Legacy Empty Choices

on:
  push:
    branches: [math-problem-bank-bootstrap]
    paths:
      - '.github/workflows/math-fix-legacy-empty-choices.yml'
  workflow_dispatch:

concurrency:
  group: math-fix-legacy-empty-choices-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact two-site empty-choice compatibility fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('math-bank/app/generate_safe_verified_variants.py')
          text = p.read_text(encoding='utf-8')
          old = 'if parent.get("choices") is not None:'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 legacy choice guards, found {count}')
          text = text.replace(old, 'if parent.get("choices"):')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Compile and run legacy empty-choice regression
        working-directory: math-bank/app
        run: |
          python -m py_compile generate_safe_verified_variants.py test_legacy_empty_choices_exact_generation.py
          python test_legacy_empty_choices_exact_generation.py
      - name: Commit exact patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- math-bank/app/generate_safe_verified_variants.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'accept empty non-choice lists in legacy exact generation'
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin math-problem-bank-bootstrap && git push origin HEAD:math-problem-bank-bootstrap && exit 0
            sleep $((i*4))
          done
          exit 1
