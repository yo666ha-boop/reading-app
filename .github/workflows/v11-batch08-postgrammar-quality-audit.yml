name: v11 Batch08 postgrammar quality audit
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch08_grammar_repair.js'
      - 'v11_batch08_postgrammar_quality_audit.js'
      - '.github/workflows/v11-batch08-postgrammar-quality-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node v11_batch08_postgrammar_quality_audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-batch08-postgrammar-quality
          path: V11_BATCH08_POSTGRAMMAR_QUALITY_AUDIT.json
