name: V11 Batch16 slash wordcount
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'scripts/v11_batch16_slash_wordcount_author.js'
jobs:
  author:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/v11_batch16_slash_wordcount_author.js
      - name: Persist authored slash and report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V11_BATCH16_BODY_TRANSLATION_DRAFT_G*.json V11_BATCH16_SLASH_WORDCOUNT_REPORT.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore(v11): persist Batch16 slash and wordcount'
          for i in 1 2 3 4 5; do
            git pull --rebase origin v11-1000passage-easy-notes && git push origin HEAD:v11-1000passage-easy-notes && exit 0
            sleep $((i*2))
          done
          exit 1
