name: final public validation
on:
  push:
    branches: [main]
    paths-ignore:
      - 'FINAL_PUBLIC_VALIDATION.txt'
      - 'PUBLIC_PUBLISH_STATUS.txt'
      - 'PUBLIC_RUNTIME_DIAG.txt'
      - 'AUTOMATION_CHECKPOINT.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: final-public-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Validate live public app and A4 print
        shell: bash
        run: |
          set +e
          node > /tmp/final-public.txt 2>&1 <<'NODE'
          const {chromium,webkit}=require('playwright');
          const expected=[
            'A Canadian researcher studies a patch / in the ocean.',
            'It is said / that a lot / of trash can gather there.',
            'The researcher finds / that the trash is mostly plastic.',
            'A bottle can float / for a long time / and move / into the patch.'
          ];
          const base='https://yo666ha-boop.github.io/reading-app/?final='+Date.now();
          function assert(c,m){if(!c)throw new Error(m)}
          async function waitRuntime(p){
            await p.waitForFunction(()=>['complete','validation-error'].includes(window.V10_RUNTIME_LOAD_PROGRESS),{timeout:120000});
            const s=await p.evaluate(()=>{
              const sets=[window.V10_SUNSHINE_G1||{},window.V10_NEWHORIZON_G1||{},window.V10_PASSAGES_G2_SS||{},window.V10_PASSAGES_G2_NH||{},window.V10_PASSAGES_G3_SS||{},window.V10_PASSAGES_G3_NH||{}];
              const all=sets.flatMap(d=>Object.values(d));
              const bad=all.filter(x=>x.slashReadingVersion!=='reference-book-minimum-rules-20260820'||x.slashReferenceAudit!=='PASS_REFERENCE_20260820');
              const p61=(window.V10_PASSAGES_G3_SS||{})['PROGRAM 6-1'];
              return {progress:window.V10_RUNTIME_LOAD_PROGRESS,error:window.V10_RUNTIME_LOAD_ERROR||'',count:all.length,bad:bad.length,p61:p61&&p61.slashRows&&p61.slashRows.slice(0,4).map(x=>x.en),audit:window.V10_REFERENCE_SLASH_AUDIT||null};
            });
            assert(s.progress==='complete','runtime progress '+s.progress+' '+s.error);
            assert(!s.error,'runtime error '+s.error);
            assert(s.count===168,'count '+s.count+'/168');
            assert(s.bad===0,'stale '+s.bad);
            assert(JSON.stringify(s.p61)===JSON.stringify(expected),'PROGRAM 6-1 mismatch '+JSON.stringify(s.p61));
            assert(s.audit&&s.audit.passagesAudited===168&&s.audit.lastCompleted===168,'audit marker missing');
            return s;
          }
          async function selectLast(p,sel){const vals=await p.locator(sel+' option').evaluateAll(o=>o.map(x=>x.value));assert(vals.length,sel+' empty');await p.selectOption(sel,vals[vals.length-1]);return vals[vals.length-1]}
          async function verifyCombos(p,label){
            const out=[];
            for(const g of ['1','2','3'])for(const book of ['サンシャイン','ニューホライズン']){
              await p.selectOption('#grade',g);await p.selectOption('#textbook',book);await p.selectOption('#pattern','all');
              const major=await selectLast(p,'#major');const sec=await selectLast(p,'#section');await p.waitForTimeout(80);
              const passage=(await p.locator('#passage').innerText()).trim();const slash=(await p.locator('#slash').innerText()).trim();
              assert(passage.length>40,label+' passage empty '+g+'/'+book+'/'+sec);assert(slash.includes('英文解釈'),label+' slash empty '+g+'/'+book+'/'+sec);
              const overflow=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,w:window.innerWidth}));assert(overflow.sw<=overflow.w+4,label+' horizontal overflow '+JSON.stringify(overflow)+' '+g+'/'+book+'/'+sec);
              out.push(g+'|'+book+'|'+major+'|'+sec);
            }
            return out;
          }
          async function desktop(){
            const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1440,height:1000}});const errs=[];p.on('pageerror',e=>errs.push(String(e)));p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});
            const r=await p.goto(base+'&engine=chromium',{waitUntil:'domcontentloaded',timeout:90000});assert(r&&r.ok(),'desktop HTTP '+(r&&r.status()));const state=await waitRuntime(p);const combos=await verifyCombos(p,'desktop');
            await p.emulateMedia({media:'print'});
            const styles=await p.evaluate(()=>({screen:[...document.querySelectorAll('.screen-only')].every(e=>getComputedStyle(e).display==='none'),tabs:[...document.querySelectorAll('.tabs')].every(e=>getComputedStyle(e).display==='none'),passage:getComputedStyle(document.querySelector('#passage')).display,slash:getComputedStyle(document.querySelector('#slash')).display,questions:getComputedStyle(document.querySelector('#questions')).display,answers:getComputedStyle(document.querySelector('#answers')).display,audit:getComputedStyle(document.querySelector('#audit')).display}));
            assert(styles.screen&&styles.tabs,'print controls visible');for(const k of ['passage','slash','questions','answers'])assert(styles[k]==='block','print '+k+' '+styles[k]);assert(styles.audit==='none','print audit visible');
            const pdf=await p.pdf({format:'A4',printBackground:true,margin:{top:'10mm',right:'10mm',bottom:'10mm',left:'10mm'}});assert(pdf.length>15000,'A4 PDF too small '+pdf.length);assert(errs.length===0,'desktop errors '+errs.join(' | '));await b.close();return {state,combos,pdfBytes:pdf.length};
          }
          async function iphone(){
            const b=await webkit.launch({headless:true});const p=await b.newPage({viewport:{width:390,height:844}});const errs=[];p.on('pageerror',e=>errs.push(String(e)));p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});
            const r=await p.goto(base+'&engine=webkit',{waitUntil:'domcontentloaded',timeout:90000});assert(r&&r.ok(),'iphone HTTP '+(r&&r.status()));const state=await waitRuntime(p);const combos=await verifyCombos(p,'iphone');assert(errs.length===0,'iphone errors '+errs.join(' | '));await b.close();return {state,combos};
          }
          (async()=>{const d=await desktop();console.log('DESKTOP_PASS '+JSON.stringify(d));const i=await iphone();console.log('IPHONE_PASS '+JSON.stringify(i));console.log('FINAL_PUBLIC_PASS_168_168_DESKTOP_IPHONE_A4')})().catch(e=>{console.error('FINAL_PUBLIC_FAIL '+(e.stack||e));process.exitCode=1});
          NODE
          code=$?
          if grep -q 'FINAL_PUBLIC_PASS_168_168_DESKTOP_IPHONE_A4' /tmp/final-public.txt && [ "$code" -eq 0 ]; then result='FINAL_PUBLIC_PASS_168_168_DESKTOP_IPHONE_A4'; else result='FINAL_PUBLIC_FAIL'; fi
          {
            echo "checked_at_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "source_sha=${GITHUB_SHA}"
            echo "result=$result"
            cat /tmp/final-public.txt
          } > FINAL_PUBLIC_VALIDATION.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add FINAL_PUBLIC_VALIDATION.txt
          git commit -m 'Record final public validation [skip ci]' || true
          git push origin HEAD:main || true
          exit 0
