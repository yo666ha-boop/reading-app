name: Math Exact1323 Transport Guard Checkpoint 20260902

on:
  push:
    branches: [math-problem-bank-bootstrap]
    paths:
      - '.github/workflows/math-exact1323-transport-guard-checkpoint-20260902.yml'

permissions:
  contents: write

concurrency:
  group: math-exact1323-transport-guard-checkpoint-20260902
  cancel-in-progress: false

jobs:
  patch-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 1
      - name: Patch checkpoint fail-closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('math-bank/state/checkpoint.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['current_stage']='APP1323_EXACT_TRUE_BYTE_TRANSFER_CONNECTOR_TRUNCATION_GUARD'
          d['recorded_at_jst']='2026-09-02T08:16:00+09:00'
          st=d['downstream']['github_exact_byte_staging']
          st['status']='PARTIAL_TRANSFER_STAGING_CONNECTOR_TRUNCATION_GUARD_NOT_RELEASE_CREDIT'
          st['durable_chunks']=1
          st['durable_base64_chars']=12000
          st['chunk001_12000_attempt']='FAIL_READBACK_11767_DELETED_NO_CREDIT'
          st['chunk001_8000_attempt']='FAIL_READBACK_7768_DELETED_NO_CREDIT'
          st['connector_long_text_path']='UNSAFE_UNTIL_EXACT_READBACK_PROVEN'
          st['release_credit']=False
          audit='math-bank/state/app1323-byte-transfer-chunk001-readback-guard-20260902T0804JST.json'
          if audit not in d.get('latest_audits',[]): d.setdefault('latest_audits',[]).append(audit)
          d['exact_stop']='Do not credit remote/browser/release from partial transport. Chunk001 failed exact GitHub readback at both requested 12000 chars (observed 11767) and requested 8000 chars (observed 7768); both were deleted in-run. Do not infer a safe smaller chunk size without exact length plus independently precomputed Git blob SHA readback. Only a byte-preserving route proven by exact readback may continue. Exact source remains 6,819,806 bytes SHA256 47893e010514fffa44d45dac3832cf502aee075345b1ecdf378f69d764b32521.'
          d['next_start']='Do not retry the same long-text connector chunk path blindly. First establish an alternate byte bridge or a connector payload size that passes exact character-count and independently precomputed Git blob SHA readback; only then stage further bytes. Durable staging remains chunk000 only. After full exact reconstruction, isolated Vercel remote body SHA, exact-origin Chromium/Firefox/WebKit-iPhone/localStorage/A4, physical Fire, strict release, and final public isolated verification remain required.'
          d['main_untouched']=True
          d['publication_ready']=False
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add math-bank/state/checkpoint.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'math: checkpoint exact1323 connector truncation guard'
          git push origin HEAD:math-problem-bank-bootstrap
