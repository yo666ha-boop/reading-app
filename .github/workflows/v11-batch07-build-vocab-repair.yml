name: v11 Batch07 build vocab repair
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'V11_BATCH07_VOCAB_CHRONOLOGY_REPORT.json'
      - 'v11_batch07_build_vocab_repair.js'
      - '.github/workflows/v11-batch07-build-vocab-repair.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node v11_batch07_build_vocab_repair.js
      - name: Commit generated repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v11_batch07_vocab_repair.js
          git diff --cached --quiet || git commit -m 'v11: generate exact Batch07 vocab repair [skip ci]'
          git pull --rebase origin v11-1000passage-easy-notes
          git push
