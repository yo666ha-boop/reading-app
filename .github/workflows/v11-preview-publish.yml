name: v11 Preview Publish

on:
  push:
    branches:
      - v11-1000passage-easy-notes

permissions:
  contents: write

concurrency:
  group: v11-preview-publish
  cancel-in-progress: true

jobs:
  publish-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v11 source
        uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
          path: src

      - name: Checkout public main
        uses: actions/checkout@v4
        with:
          ref: main
          path: public
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh v11 preview snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public/v11-preview
          mkdir -p public/v11-preview
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            src/ public/v11-preview/
          cat > public/v11-preview/PREVIEW_SOURCE.txt <<EOF
          branch=v11-1000passage-easy-notes
          source_sha=${GITHUB_SHA}
          published_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          purpose=WORKING_PREVIEW_NOT_PRODUCTION_RELEASE
          EOF

      - name: Publish preview into main/v11-preview
        shell: bash
        run: |
          set -euo pipefail
          cd public
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v11-preview
          if git diff --cached --quiet; then
            echo 'Preview already current.'
            exit 0
          fi
          git commit -m "Publish v11 working preview ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:main
