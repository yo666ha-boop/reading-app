name: v11 Preview Publish

on:
  push:
    branches:
      - v11-1000passage-easy-notes

permissions:
  contents: write

concurrency:
  group: v11-preview-publish
  cancel-in-progress: true

jobs:
  publish-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v11 source
        uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
          path: src

      - name: Checkout public main
        uses: actions/checkout@v4
        with:
          ref: main
          path: public
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh v11 preview snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public/v11-preview
          mkdir -p public/v11-preview
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            src/ public/v11-preview/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/v11-preview/index.html')
          s = p.read_text(encoding='utf-8')
          # The v10 shell defines choose/render late in the document.  v11 runtime
          # architecture and the registered batch chain therefore must be inserted
          # immediately before </body>, in this exact order.
          marker = '<script src="v11_multi_passage_architecture.js"></script>\n<script src="v11_easy_support_notes.js"></script>\n<script src="v11_batch01_bootstrap.js"></script>'
          old = '<script src="v11_batch11_bootstrap.js"></script>'
          s = s.replace(old, '')
          if marker not in s:
              s = s.replace('</body></html>', marker + '\n</body></html>')
          s = s.replace('<title>長文読解問題作成アプリ v10 stage2</title>', '<title>みかみ塾 英語長文読解アプリ v11</title>')
          s = s.replace('<h1>長文読解問題作成アプリ v10</h1>', '<h1>みかみ塾 英語長文読解アプリ v11</h1>')
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'v11_multi_passage_architecture.js' public/v11-preview/index.html
          grep -q 'v11_batch01_bootstrap.js' public/v11-preview/index.html
          test -f public/v11-preview/v11_multi_passage_architecture.js
          test -f public/v11-preview/v11_easy_support_notes.js
          test -f public/v11-preview/v11_batch01_bootstrap.js
          test -f public/v11-preview/v11_batch11_bootstrap.js
          test -f public/v11-preview/v11_batch12_bootstrap.js
          test -f public/v11-preview/v11_batch13_bootstrap.js
          cat > public/v11-preview/PREVIEW_SOURCE.txt <<EOF
          branch=v11-1000passage-easy-notes
          source_sha=${GITHUB_SHA}
          published_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          expected_registered_total=818
          bootstrap_entry=v11_batch01_bootstrap.js
          purpose=WORKING_PREVIEW_NOT_PRODUCTION_RELEASE
          EOF

      - name: Publish preview into main/v11-preview
        shell: bash
        run: |
          set -euo pipefail
          cd public
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v11-preview
          if git diff --cached --quiet; then
            echo 'Preview already current.'
            exit 0
          fi
          git commit -m "Publish v11 working preview ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:main
