name: v11 Batch09 chronology audit
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch09_passages_draft_g1.js'
      - 'v11_batch09_g1_length_repair.js'
      - 'v11_batch09_passages_draft_g2.js'
      - 'v11_batch09_passages_draft_g3.js'
      - 'v11_batch09_g3_length_repair.js'
      - 'v11_batch09_chronology_audit.js'
      - '.github/workflows/v11-batch09-chronology-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --no-save jsdom@24
      - name: Run chronology audit
        run: node v11_batch09_chronology_audit.js || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-batch09-chronology
          path: |
            V11_BATCH09_VOCAB_CHRONOLOGY_REPORT.json
            V11_BATCH09_GRAMMAR_CANDIDATE_REPORT.json
            V11_BATCH09_GRAMMAR_CHRONOLOGY_REPORT.json
            V11_BATCH09_CHRONOLOGY_STATUS.txt
      - name: Persist exact reports
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add V11_BATCH09_VOCAB_CHRONOLOGY_REPORT.json V11_BATCH09_GRAMMAR_CANDIDATE_REPORT.json V11_BATCH09_GRAMMAR_CHRONOLOGY_REPORT.json V11_BATCH09_CHRONOLOGY_STATUS.txt
          if ! git diff --cached --quiet; then
            git commit -m 'v11: record Batch09 chronology reports [skip ci]'
            git pull --rebase origin v11-1000passage-easy-notes
            git push
          fi
      - name: Enforce chronology result
        run: grep -q '^final=PASS$' V11_BATCH09_CHRONOLOGY_STATUS.txt
