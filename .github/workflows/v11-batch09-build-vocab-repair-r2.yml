name: v11 Batch09 build vocab repair r2
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'V11_BATCH09_VOCAB_CHRONOLOGY_REPORT.json'
      - 'v11_batch09_build_vocab_repair_r2.js'
      - '.github/workflows/v11-batch09-build-vocab-repair-r2.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node v11_batch09_build_vocab_repair_r2.js
      - name: Persist residual inventory
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v11_batch09_vocab_repair_r2.js
          if ! git diff --cached --quiet; then
            git commit -m 'v11: persist Batch09 post-grammar residual vocab inventory [skip ci]'
            git pull --rebase origin v11-1000passage-easy-notes
            git push
          fi