name: v11 Batch05 prefinal quality audit
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch05_passages_draft_g1.js'
      - 'v11_batch05_passages_draft_g2.js'
      - 'v11_batch05_passages_draft_g3.js'
      - 'v11_batch05_grammar_repair.js'
      - 'v11_batch05_grammar_repair_r2.js'
      - 'v11_batch05_chronology_repair.js'
      - 'v11_batch05_notes_finalize.js'
      - 'v11_batch05_translation_sync.js'
      - 'v11_batch05_question_regenerate.js'
      - 'v11_batch05_prefinal_quality_audit.js'
      - '.github/workflows/v11-batch05-prefinal-quality-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit finalized Batch05 content
        run: node v11_batch05_prefinal_quality_audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-batch05-prefinal-quality
          path: V11_BATCH05_PREFINAL_QUALITY_AUDIT.json
