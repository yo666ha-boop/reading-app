name: v11 multi passage audit
on:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_multi_passage_architecture.js'
      - 'v11_batch01_passages_001_050.js'
      - 'v11_batch01_uniqueness_repair.js'
      - 'v10_grammar_vocab_final_sync.js'
      - '.github/workflows/v11-multi-passage-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v11-multi-passage-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-1000passage-easy-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Audit scalable passage switching and Batch01
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/v11-multi-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          set +e
          timeout 300s node > /tmp/v11-multi.log 2>&1 <<'NODE'
          const {chromium}=require('playwright');
          function assert(c,m){if(!c)throw new Error(m)}
          (async()=>{
            let b;
            try{
              b=await chromium.launch({headless:true});
              const p=await b.newPage({viewport:{width:1280,height:900}});const errors=[];
              p.on('pageerror',e=>errors.push(String(e)));p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              const r=await p.goto('http://127.0.0.1:8000/index.html?multi='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});assert(r&&r.ok(),'HTTP '+(r&&r.status()));
              await p.waitForFunction(()=>window.V10_RUNTIME_LOAD_PROGRESS==='complete',{timeout:120000});
              await p.waitForFunction(()=>window.V11_MULTI_PASSAGE_LOADED===true&&window.__V11_MULTI_PASSAGE_UI_INSTALLED===true&&window.V11_BATCH01_LOADED===true,{timeout:60000});
              const audit=await p.evaluate(()=>{
                const sets=[window.V10_SUNSHINE_G1||{},window.V10_NEWHORIZON_G1||{},window.V10_PASSAGES_G2_SS||{},window.V10_PASSAGES_G2_NH||{},window.V10_PASSAGES_G3_SS||{},window.V10_PASSAGES_G3_NH||{}];
                const base=sets.flatMap(d=>Object.values(d||{}));const baseById=new Map(base.map(x=>[x.id,x]));
                const extra=window.V11_BATCH01_PASSAGES||[];const ids=new Set();const titles=new Set();const bad=[];const exactEvidence=[];
                for(const x of extra){
                  if(ids.has(x.id))bad.push(x.id+':duplicate-id');ids.add(x.id);
                  if(titles.has(x.title))bad.push(x.id+':duplicate-title');titles.add(x.title);
                  const bb=baseById.get(x.sourceSectionBaselineId);if(!bb)bad.push(x.id+':missing-baseline '+x.sourceSectionBaselineId);else if(String(bb.textbook)!==String(x.textbook)||String(bb.grade)!==String(x.grade)||String(bb.section)!==String(x.section))bad.push(x.id+':baseline-scope-mismatch');
                  if(!Array.isArray(x.sentences)||x.sentences.length<8||x.sentences.length>18)bad.push(x.id+':sentence-count');
                  if(!Array.isArray(x.slashRows)||x.slashRows.length!==x.sentences.length)bad.push(x.id+':slash-count');
                  if(!Array.isArray(x.questions)||x.questions.length!==5)bad.push(x.id+':A-count');
                  if(!Array.isArray(x.questionSetB)||x.questionSetB.length!==5)bad.push(x.id+':B-count');
                  if(!String(x.fullTranslation||'').trim())bad.push(x.id+':translation-empty');
                  for(const [setName,qs] of [['A',x.questions||[]],['B',x.questionSetB||[]]])for(const q of qs){if(!q.prompt||!q.answer||!q.evidence||!q.evidenceJp||!q.reason)bad.push(x.id+':'+setName+'-incomplete');if(!(x.sentences||[]).includes(q.evidence))exactEvidence.push(x.id+':'+setName+':'+q.evidence);}
                  if(x.vocabChronology!=='PASS_BY_SECTION_BANK_20260827')bad.push(x.id+':vocab-marker');
                  if(x.grammarChronology!=='PASS_BY_SECTION_BANK_20260827')bad.push(x.id+':grammar-marker');
                }
                const fps=new Map(),duplicateBodies=[];for(const x of extra){const f=[...new Set(x.sentences)].sort().join('\n');if(fps.has(f))duplicateBodies.push([fps.get(f),x.id]);else fps.set(f,x.id);}
                return {base:base.length,extra:extra.length,batchState:window.V11_BATCH01_STATE||null,multiState:window.V11_MULTI_PASSAGE_STATE||null,bad,exactEvidence,duplicateBodies,sections:[...new Set(extra.map(x=>x.textbook+'|'+x.grade+'|'+x.section))]};
              });
              assert(audit.base===168,'base '+audit.base);assert(audit.extra===50,'Batch01 '+audit.extra);assert(audit.batchState&&audit.batchState.count===50&&audit.batchState.totalWithBaseline===218,'batch state '+JSON.stringify(audit.batchState));assert(audit.multiState&&audit.multiState.extraPassages===50,'multi state '+JSON.stringify(audit.multiState));assert(audit.bad.length===0,'structural bad '+audit.bad.join(' | '));assert(audit.exactEvidence.length===0,'evidence not exact sentence '+audit.exactEvidence.slice(0,10).join(' | '));assert(audit.duplicateBodies.length===0,'duplicate bodies '+JSON.stringify(audit.duplicateBodies));
              const first=await p.evaluate(()=>window.V11_BATCH01_PASSAGES[0]);assert(first&&first.id,'first batch passage missing');
              await p.selectOption('#textbook',first.textbook);await p.selectOption('#grade',String(first.grade));await p.waitForTimeout(150);
              const majorValues=await p.locator('#major option').evaluateAll(os=>os.map(o=>o.value));let sectionFound=false;
              for(const mv of majorValues){await p.selectOption('#major',mv);await p.waitForTimeout(80);const secs=await p.locator('#section option').evaluateAll(os=>os.map(o=>o.value));if(secs.includes(first.section)){sectionFound=true;break;}}
              assert(sectionFound,'section not found after scanning majors: '+first.section);await p.selectOption('#section',first.section);await p.waitForTimeout(150);
              const options=await p.locator('#v11PassageVariant option').allTextContents();assert(options.length>=2,'variant options '+options.length);const idx=await p.locator('#v11PassageVariant option').evaluateAll((os,id)=>os.findIndex(o=>o.textContent.includes(id)),first.id);assert(idx>=1,'first Batch01 option not found '+first.id+' '+options.join(' | '));await p.selectOption('#v11PassageVariant',String(idx));await p.evaluate(()=>window.render());await p.waitForTimeout(150);
              assert((await p.locator('#passage').innerText()).includes(first.title),'Batch01 title not rendered');assert((await p.evaluate(()=>window.choose().id))===first.id,'choose did not select '+first.id);const qs=await p.locator('#questions .q').count();assert(qs===5,'rendered A questions '+qs);await p.locator('#altSetBtn').click();await p.waitForTimeout(100);const qsB=await p.locator('#questions .q').count();assert(qsB===5,'rendered B questions '+qsB);
              assert(errors.length===0,'runtime errors '+errors.join(' | '));
              console.log('AUDIT '+JSON.stringify(audit));console.log('FIRST '+JSON.stringify({id:first.id,title:first.title,options:options.length}));console.log('V11_MULTI_BATCH01_PASS_218');
            } finally {if(b)await b.close().catch(()=>{});}
          })().catch(e=>{console.error('V11_MULTI_BATCH01_FAIL '+(e.stack||e));process.exitCode=1});
          NODE
          code=$?
          if grep -q 'V11_MULTI_BATCH01_PASS_218' /tmp/v11-multi.log && [ "$code" -eq 0 ]; then result='PASS'; else result='FAIL'; fi
          { echo "checked_at_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"; echo "source_sha=${GITHUB_SHA}"; echo "result=$result"; cat /tmp/v11-multi.log; } > V11_MULTI_PASSAGE_AUDIT.txt
          cat V11_MULTI_PASSAGE_AUDIT.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add V11_MULTI_PASSAGE_AUDIT.txt
          git commit -m 'v11: record multi passage audit [skip ci]' || true
          git pull --rebase origin v11-1000passage-easy-notes || true
          git push origin HEAD:v11-1000passage-easy-notes || true
          if [ "$result" != 'PASS' ]; then exit 1; fi
