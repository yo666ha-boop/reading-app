name: Math Problem Bank Audit

on:
  workflow_dispatch:
  push:
    branches:
      - math-problem-bank-bootstrap
    paths:
      - 'math-bank/source/**'
      - 'math-bank/scripts/**'
      - 'math-bank/schema/**'
      - 'math-bank/app/**'
      - 'math-bank/state/CANONICAL_RECOVERY_KEYS.json'
      - '.github/workflows/math-problem-bank-audit.yml'

permissions:
  contents: write

jobs:
  app-shell-and-data-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile app validation, recovery, inspection, and release tools
        run: python -m py_compile math-bank/app/validate_app_records.py math-bank/app/recover_canonical_app_records.py math-bank/app/inspect_canonical_artifact.py math-bank/app/check_app_shell.py math-bank/app/check_recovery_contract.py math-bank/app/test_negative_gates.py math-bank/app/build_release_bundle.py

      - name: Check app shell and JavaScript syntax
        run: python math-bank/app/check_app_shell.py

      - name: Check canonical recovery contract
        run: python math-bank/app/check_recovery_contract.py

      - name: Run negative data/recovery gates
        run: python math-bank/app/test_negative_gates.py

      - name: Strict canonical 1231 validator when data exists
        shell: bash
        run: |
          if [ -f math-bank/app/app-records.json ]; then
            python math-bank/app/validate_app_records.py math-bank/app/app-records.json
          else
            echo 'CANONICAL_DATA_GATE_BLOCKED_EXPECTED: math-bank/app/app-records.json is not committed yet'
          fi

      - name: Strict release bundle gate
        shell: bash
        run: |
          if [ -f math-bank/app/app-records.json ]; then
            python math-bank/app/build_release_bundle.py
          else
            set +e
            python math-bank/app/build_release_bundle.py
            rc=$?
            set -e
            if [ "$rc" -ne 3 ]; then
              echo "FAIL release builder must block with rc=3 before exact canonical data is wired"
              exit 1
            fi
            echo 'PASS_RELEASE_BLOCKED_UNTIL_EXACT_1231'
          fi

      - name: Preserve strict release bundle as workflow artifact
        if: ${{ hashFiles('math-bank/app/app-records.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mikami-math-app-strict-release
          path: |
            math-bank/みかみ塾数学問題アプリ_公開候補.zip
            math-bank/release/
          if-no-files-found: error
          retention-days: 30

  inventory-and-classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inventory and classify only when source archives exist
        shell: bash
        run: |
          if find math-bank/source -maxdepth 1 -type f -name '*.zip' -print -quit 2>/dev/null | grep -q .; then
            python math-bank/scripts/inventory.py
            python math-bank/scripts/classify_manifest.py
          else
            echo 'SOURCE_ARCHIVES_NOT_PRESENT: skipping source inventory; canonical 1231 recovery remains the data blocker'
          fi

      - name: Commit checkpoint and outputs if changed
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add math-bank/state/checkpoint.json math-bank/out/archive_manifest.json math-bank/out/file_classification.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'update math problem bank audit checkpoint'
            git push origin HEAD:math-problem-bank-bootstrap
          fi

  record-ci-result:
    if: always()
    needs:
      - app-shell-and-data-gate
      - inventory-and-classify
    runs-on: ubuntu-latest
    env:
      APP_RESULT: ${{ needs['app-shell-and-data-gate'].result }}
      INVENTORY_RESULT: ${{ needs['inventory-and-classify'].result }}
      TRIGGERING_SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Checkout latest math branch
        uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 0

      - name: Persist CI result
        shell: bash
        run: |
          git pull --ff-only origin math-problem-bank-bootstrap || true
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('math-bank/state/ci-latest.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          app = os.environ.get('APP_RESULT', 'unknown')
          inventory = os.environ.get('INVENTORY_RESULT', 'unknown')
          overall = 'success' if app == 'success' and inventory == 'success' else 'failure'
          payload = {
              'workflow': 'Math Problem Bank Audit',
              'overall_result': overall,
              'app_shell_and_data_gate': app,
              'inventory_and_classify': inventory,
              'triggering_sha': os.environ.get('TRIGGERING_SHA', ''),
              'run_id': os.environ.get('RUN_ID', ''),
              'run_attempt': os.environ.get('RUN_ATTEMPT', ''),
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
              'canonical_app_records_present': Path('math-bank/app/app-records.json').is_file(),
              'strict_release_artifact_expected': Path('math-bank/app/app-records.json').is_file(),
          }
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- math-bank/state/ci-latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'record math app CI result'
            git push origin HEAD:math-problem-bank-bootstrap
          fi
