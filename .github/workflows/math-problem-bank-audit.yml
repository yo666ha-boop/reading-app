name: Math Problem Bank Audit

on:
  workflow_dispatch:
  push:
    branches:
      - math-problem-bank-bootstrap
    paths:
      - 'math-bank/source/**'
      - 'math-bank/scripts/**'
      - 'math-bank/schema/**'
      - 'math-bank/app/**'
      - 'math-bank/state/CANONICAL_RECOVERY_KEYS.json'
      - '.github/workflows/math-problem-bank-audit.yml'

concurrency:
  group: math-problem-bank-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  app-shell-and-data-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile app validation, recovery, inspection, conversion, provenance, scanner, and release tools
        run: python -m py_compile math-bank/app/validate_app_records.py math-bank/app/recover_canonical_app_records.py math-bank/app/inspect_canonical_artifact.py math-bank/app/convert_verified_canonical_to_app.py math-bank/app/validate_canonical_provenance.py math-bank/app/scan_canonical_candidates.py math-bank/app/scan_actions_artifacts.py math-bank/app/check_app_shell.py math-bank/app/check_recovery_contract.py math-bank/app/test_negative_gates.py math-bank/app/test_verified_converter.py math-bank/app/build_release_bundle.py

      - name: Check browser regression script syntax
        run: node --check math-bank/app/browser_regression.mjs && node --check math-bank/app/browser_real_regression.mjs

      - name: Check app shell and JavaScript syntax
        run: python math-bank/app/check_app_shell.py

      - name: Check canonical recovery contract
        run: python math-bank/app/check_recovery_contract.py

      - name: Run negative data/recovery gates
        run: python math-bank/app/test_negative_gates.py

      - name: Run verified deterministic converter and provenance regression
        run: python math-bank/app/test_verified_converter.py

      - name: Strict canonical 1231 validator when data exists
        shell: bash
        run: |
          if [ -f math-bank/app/app-records.json ]; then
            python math-bank/app/validate_app_records.py math-bank/app/app-records.json
          else
            echo 'CANONICAL_DATA_GATE_BLOCKED_EXPECTED: math-bank/app/app-records.json is not committed yet'
          fi

      - name: Verify release builder remains blocked before canonical data
        shell: bash
        run: |
          if [ -f math-bank/app/app-records.json ]; then
            echo 'RELEASE_BUILD_DEFERRED: strict release is built only after REAL canonical browser regression passes'
          else
            set +e
            python math-bank/app/build_release_bundle.py
            rc=$?
            set -e
            if [ "$rc" -ne 3 ]; then
              echo "FAIL release builder must block with rc=3 before exact canonical data is wired"
              exit 1
            fi
            echo 'PASS_RELEASE_BLOCKED_UNTIL_EXACT_1231'
          fi

  actions-artifact-recovery-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan recent repository Actions artifacts for exact canonical ZIP SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python math-bank/app/scan_actions_artifacts.py

      - name: Persist artifact scan diagnostic
        if: always() && hashFiles('math-bank/state/actions-artifact-scan-latest.json') != ''
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- math-bank/state/actions-artifact-scan-latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'record math Actions artifact recovery scan'
            git pull --rebase origin math-problem-bank-bootstrap
            git push origin HEAD:math-problem-bank-bootstrap
          fi

      - name: Preserve exact canonical recovery hit
        if: ${{ hashFiles('math-bank/recovered/みかみ塾数学問題バンク_最終完成版_20260820.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mikami-math-canonical-recovery-hit
          path: math-bank/recovered/みかみ塾数学問題バンク_最終完成版_20260820.zip
          if-no-files-found: error
          retention-days: 30

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and browser engines
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit

      - name: Start isolated math app server
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory math-bank/app >/tmp/math-app-http.log 2>&1 &
          echo $! >/tmp/math-app-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/math-app-http.log || true
          exit 1

      - name: Run synthetic Chromium Firefox WebKit shell regression
        env:
          MATH_APP_BASE_URL: http://127.0.0.1:8765/index.html
          MATH_BROWSER_REPORT: math-bank/state/browser-regression-latest.json
        run: node math-bank/app/browser_regression.mjs

      - name: Run REAL canonical 1231 browser regression when data exists
        shell: bash
        env:
          MATH_APP_BASE_URL: http://127.0.0.1:8765/index.html
          MATH_REAL_DATA_PATH: math-bank/app/app-records.json
          MATH_REAL_BROWSER_REPORT: math-bank/state/browser-real-regression-latest.json
          MATH_REAL_PDF_DIR: math-bank/state/real-print-regression
        run: |
          if [ -f math-bank/app/app-records.json ]; then
            node math-bank/app/browser_real_regression.mjs
          else
            cat > math-bank/state/browser-real-regression-latest.json <<'JSON'
          {
            "workflow_test": "Math Problem Bank REAL Canonical Browser Regression",
            "overall_result": "blocked_expected",
            "synthetic_fixture_only": false,
            "canonical_data_written": false,
            "reason": "exact canonical app-records.json is not wired yet"
          }
          JSON
            echo 'REAL_CANONICAL_BROWSER_BLOCKED_EXPECTED'
          fi

      - name: Persist browser regression diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- math-bank/state/browser-regression-latest.json math-bank/state/browser-real-regression-latest.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'record math browser regression results'
            git pull --rebase origin math-problem-bank-bootstrap
            git push origin HEAD:math-problem-bank-bootstrap
          fi

      - name: Upload browser regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-browser-regression-diagnostics
          path: |
            math-bank/state/browser-regression-latest.json
            math-bank/state/browser-real-regression-latest.json
            math-bank/state/real-print-regression/
          if-no-files-found: warn
          retention-days: 30

  strict-release-after-browser:
    if: always()
    needs:
      - app-shell-and-data-gate
      - browser-regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest math branch
        uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build strict release only after REAL canonical browser PASS
        shell: bash
        run: |
          git pull --ff-only origin math-problem-bank-bootstrap || true
          if [ ! -f math-bank/app/app-records.json ]; then
            echo 'STRICT_RELEASE_BLOCKED_EXPECTED: exact canonical app-records.json is absent'
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('math-bank/state/browser-real-regression-latest.json')
          if not p.is_file():
              raise SystemExit('FAIL strict release: real canonical browser report missing')
          obj = json.loads(p.read_text(encoding='utf-8'))
          if obj.get('overall_result') != 'success' or obj.get('synthetic_fixture_only') is not False or obj.get('canonical_data_written') is not True:
              raise SystemExit('FAIL strict release: real canonical browser gate is not PASS')
          print('PASS_REAL_CANONICAL_BROWSER_GATE_FOR_RELEASE')
          PY
          python math-bank/app/build_release_bundle.py

      - name: Preserve strict release bundle after REAL browser PASS
        if: ${{ hashFiles('math-bank/app/app-records.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mikami-math-app-strict-release
          path: |
            math-bank/みかみ塾数学問題アプリ_公開候補.zip
            math-bank/release/
            math-bank/state/browser-real-regression-latest.json
            math-bank/state/real-print-regression/
          if-no-files-found: error
          retention-days: 30

  inventory-and-classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inventory and classify only when source archives exist
        shell: bash
        run: |
          if find math-bank/source -maxdepth 1 -type f -name '*.zip' -print -quit 2>/dev/null | grep -q .; then
            python math-bank/scripts/inventory.py
            python math-bank/scripts/classify_manifest.py
          else
            echo 'SOURCE_ARCHIVES_NOT_PRESENT: skipping source inventory; canonical 1231 recovery remains the data blocker'
          fi

      - name: Commit checkpoint and outputs if changed
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add math-bank/state/checkpoint.json math-bank/out/archive_manifest.json math-bank/out/file_classification.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'update math problem bank audit checkpoint'
            git push origin HEAD:math-problem-bank-bootstrap
          fi

  record-ci-result:
    if: always()
    needs:
      - app-shell-and-data-gate
      - actions-artifact-recovery-scan
      - browser-regression
      - strict-release-after-browser
      - inventory-and-classify
    runs-on: ubuntu-latest
    env:
      APP_RESULT: ${{ needs['app-shell-and-data-gate'].result }}
      ARTIFACT_SCAN_RESULT: ${{ needs['actions-artifact-recovery-scan'].result }}
      BROWSER_RESULT: ${{ needs['browser-regression'].result }}
      RELEASE_RESULT: ${{ needs['strict-release-after-browser'].result }}
      INVENTORY_RESULT: ${{ needs['inventory-and-classify'].result }}
      TRIGGERING_SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Checkout latest math branch
        uses: actions/checkout@v4
        with:
          ref: math-problem-bank-bootstrap
          fetch-depth: 0

      - name: Persist CI result
        shell: bash
        run: |
          git pull --ff-only origin math-problem-bank-bootstrap || true
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('math-bank/state/ci-latest.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          app = os.environ.get('APP_RESULT', 'unknown')
          artifact_scan = os.environ.get('ARTIFACT_SCAN_RESULT', 'unknown')
          browser = os.environ.get('BROWSER_RESULT', 'unknown')
          release = os.environ.get('RELEASE_RESULT', 'unknown')
          inventory = os.environ.get('INVENTORY_RESULT', 'unknown')
          canonical_present = Path('math-bank/app/app-records.json').is_file()
          real_browser = 'blocked_expected'
          real_report = Path('math-bank/state/browser-real-regression-latest.json')
          if real_report.is_file():
              try:
                  robj = json.loads(real_report.read_text(encoding='utf-8'))
                  real_browser = robj.get('overall_result', 'unknown')
              except Exception:
                  real_browser = 'invalid_report'
          if canonical_present and real_browser != 'success':
              browser = 'failure'
          overall = 'success' if app == 'success' and artifact_scan == 'success' and browser == 'success' and release == 'success' and inventory == 'success' else 'failure'
          try:
              current_head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          except Exception:
              current_head = ''
          payload = {
              'workflow': 'Math Problem Bank Audit',
              'overall_result': overall,
              'app_shell_and_data_gate': app,
              'actions_artifact_recovery_scan': artifact_scan,
              'browser_regression': browser,
              'real_canonical_browser_regression': real_browser,
              'strict_release_after_browser': release,
              'inventory_and_classify': inventory,
              'triggering_sha': os.environ.get('TRIGGERING_SHA', ''),
              'branch_head_when_recorded': current_head,
              'run_id': os.environ.get('RUN_ID', ''),
              'run_attempt': os.environ.get('RUN_ATTEMPT', ''),
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
              'canonical_app_records_present': canonical_present,
              'strict_release_artifact_expected': canonical_present and real_browser == 'success',
              'canonical_recovery_hit_present': Path('math-bank/recovered/みかみ塾数学問題バンク_最終完成版_20260820.zip').is_file(),
          }
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- math-bank/state/ci-latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'record math app CI result'
            git push origin HEAD:math-problem-bank-bootstrap
          fi
