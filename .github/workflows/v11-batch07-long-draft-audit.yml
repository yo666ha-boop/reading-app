name: v11 Batch07 Grade3 long draft audit
on:
  workflow_dispatch:
  push:
    branches: [v11-1000passage-easy-notes]
    paths:
      - 'v11_batch07_long_draft_g3.js'
      - 'v11_batch07_long_semantic_repair.js'
      - 'v11_batch07_long_draft_audit.js'
      - '.github/workflows/v11-batch07-long-draft-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node v11_batch07_long_draft_audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-batch07-long-draft
          path: V11_BATCH07_LONG_DRAFT_AUDIT.json
