<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>長文読解問題作成アプリ v10 rebuild</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;margin:0;background:#f5f7fb;color:#1f2937}.wrap{max-width:980px;margin:0 auto;padding:18px}.panel{background:#fff;border:1px solid #d8dee9;border-radius:16px;padding:18px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap}select,button{padding:10px 12px;border-radius:10px;border:1px solid #cbd5e1;background:#fff}button{font-weight:700;cursor:pointer}.tabs button.active{background:#0f172a;color:#fff}.muted{color:#667085;font-size:13px;line-height:1.7}.ok{color:#166534;font-weight:800}.warn{color:#92400e;font-weight:800}.en{font-size:18px;line-height:1.9}.slash{padding:10px 0;border-bottom:1px dashed #e5e7eb}.slash .enline{font-weight:700}.slash .jpline{margin-top:4px;color:#374151}.q{padding:12px 0;border-bottom:1px solid #eef2f7}.evidence{background:#f8fafc;border-left:4px solid #94a3b8;padding:10px;margin-top:8px}.hidden{display:none}.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:800}.meta{font-size:13px;color:#475569;line-height:1.8}h1{font-size:24px;margin:0 0 8px}h2{font-size:20px;margin-top:0}.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
<section class="panel">
<h1>長文読解問題作成アプリ v10 再構築</h1>
<div class="muted">GitHub再構築中。月フィルタなし。小学生既習語＋選択単元上限までの累積教科書語彙だけを既習扱いし、手作業監査済み本文だけを表示します。</div>

<label>学年 <select id="grade"><option value="1">中1</option></select></label>
<label>単元上限 <select id="section"><option>Get Ready 2</option><option>Get Ready 3</option><option>Get Ready 4</option><option>Get Ready 5</option></select></label>
</div>
<div id="gate" style="margin-top:12px"></div>
</section>
<section class="panel tabs row">
<button data-tab="passage" class="active">本文</button><button data-tab="slash">英文解釈</button><button data-tab="questions">問題</button><button data-tab="answers">解答・解説</button><button data-tab="audit">品質監査</button>
</section>
<section id="passage" class="panel tabpage"></section><section id="slash" class="panel tabpage hidden"></section><section id="questions" class="panel tabpage hidden"></section><section id="answers" class="panel tabpage hidden"></section><section id="audit" class="panel tabpage hidden"></section>
</div>
<script>

 allowedWords:[['I','Get Ready 2'],['great','Get Ready 2'],['too','Get Ready 2'],['really','Get Ready 2'],['I see.','Get Ready 2 phrase'],['this','elementary'],['is','elementary'],['my','elementary'],['English','elementary'],['book','elementary'],['yes','elementary'],['a','elementary'],['dog','elementary'],['cat','elementary'],['write','elementary'],['in','elementary'],['notebook','elementary'],['can','elementary'],['read','elementary']],auditNote:'Get Ready 2 の see は「わかる」の語義で登録されているため、視覚動詞 see a dog としては使用していない。I see. の会話表現だけを使用。',vocabAudit:true,manualSlashAudit:true,manualMeaningAudit:true,manualQuestionAudit:true

'Get Ready 3':{

},

 fullTranslation:'私はバスケットボールが好きです。私はバスケットボール部に入っています。体育館で練習します。毎日練習します。私は走ることができます。高くジャンプすることもできます。ボールをシュートすることもできます。バスケットボールはとてもわくわくします。「あなたはバスケットボールが好きですか。」「はい、好きです。」「いっしょにバスケットボールをしよう。」「いいね！」「私はバスケットボールを楽しんでいます。」',
 slashRows:[{en:'I like / basketball.',jp:'私は好きです / バスケットボールが'},{en:'I am / in the basketball club.',jp:'私はいます / バスケットボール部に'},{en:'I practice / in the gym.',jp:'私は練習します / 体育館で'},{en:'I practice / every day.',jp:'私は練習します / 毎日'},{en:'I can run.',jp:'私は走ることができます。'},{en:'I can jump / high.',jp:'私はジャンプできます / 高く'},{en:'I can shoot / the ball.',jp:'私はシュートできます / そのボールを'},{en:'Basketball is / very exciting.',jp:'バスケットボールは〜です / とてもわくわくする'},{en:'Do you like / basketball?',jp:'あなたは好きですか / バスケットボールが'},{en:'Yes, / I do.',jp:'はい / 好きです'},{en:'Let’s play / basketball / together.',jp:'やろう / バスケットボールを / いっしょに'},{en:'Great!',jp:'いいね！'},{en:'I enjoy / basketball.',jp:'私は楽しみます / バスケットボールを'}],
 questions:[{prompt:'1. 「私」は何部に入っていますか。英語で答えなさい。',answer:'the basketball club',evidence:'I am in the basketball club.',evidenceJp:'私はバスケットボール部に入っています。',reason:'2文目の in the basketball club が所属する部を示しています。'},{prompt:'2. どこで練習しますか。英語で答えなさい。',answer:'in the gym',evidence:'I practice in the gym.',evidenceJp:'私は体育館で練習します。',reason:'3文目の in the gym が練習場所です。'},{prompt:'3. どのくらいの頻度で練習しますか。本文から英語で抜き出しなさい。',answer:'every day',evidence:'I practice every day.',evidenceJp:'私は毎日練習します。',reason:'every day が練習の頻度を表しています。'},{prompt:'4. 「私」ができることを3つ、日本語で答えなさい。',answer:'走ること・高くジャンプすること・ボールをシュートすること',evidence:'I can run. / I can jump high. / I can shoot the ball.',evidenceJp:'走ることができます。／高くジャンプできます。／ボールをシュートできます。',reason:'5〜7文目で can の後ろに3つの動作が並んでいます。'}],
 allowedWords:[['basketball','Get Ready 4'],['club','Get Ready 4'],['practice','Get Ready 4'],['gym','Get Ready 4'],['every day','Get Ready 4 phrase'],['run','Get Ready 4'],['jump','Get Ready 4'],['high','Get Ready 4'],['shoot','Get Ready 4'],['ball','Get Ready 4'],['very','Get Ready 4'],['exciting','Get Ready 4'],['together','Get Ready 4'],['let’s','Get Ready 4'],['enjoy','Get Ready 4'],['in','Get Ready 4'],['the','Get Ready 4'],['I','cumulative'],['like','Get Ready 3 cumulative'],['can','Get Ready 3 cumulative'],['do','Get Ready 3 cumulative'],['you','Get Ready 3 cumulative'],['yes','elementary'],['am','elementary'],['great','Get Ready 2 cumulative']],auditNote:'Get Ready 4 の部活・動作語を中心に、バスケ部での練習から友だちを誘うまでを1場面で構成。三単現・過去形など未習活用は使用していない。',vocabAudit:true,manualSlashAudit:true,manualMeaningAudit:true,manualQuestionAudit:true
},

 sentences:['Do you like the zoo?','Yes, I do.','What do you like?','I like the panda and the monkey.','Really?','Yes.','I like the tiger, too.','Do you like the rabbit?','Yes, I do.','I like the bear, too.','Great!'],
 fullTranslation:'「あなたは動物園が好きですか。」「はい、好きです。」「何が好きですか。」「私はパンダとサルが好きです。」「本当に？」「うん。」「トラも好きです。」「ウサギは好きですか。」「はい、好きです。」「クマも好きです。」「いいね！」',
 slashRows:[{en:'Do you like / the zoo?',jp:'あなたは好きですか / その動物園が'},{en:'Yes, / I do.',jp:'はい / 好きです'},{en:'What / do you like?',jp:'何が / あなたは好きですか'},{en:'I like / the panda and the monkey.',jp:'私は好きです / パンダとサルが'},{en:'Really?',jp:'本当に？'},{en:'Yes.',jp:'うん。'},{en:'I like / the tiger, too.',jp:'私は好きです / トラも'},{en:'Do you like / the rabbit?',jp:'あなたは好きですか / ウサギが'},{en:'Yes, / I do.',jp:'はい / 好きです'},{en:'I like / the bear, too.',jp:'私は好きです / クマも'},{en:'Great!',jp:'いいね！'}],
 questions:[{prompt:'1. 最初の質問では、何が好きかをたずねていますか。英語で答えなさい。',answer:'the zoo',evidence:'Do you like the zoo?',evidenceJp:'あなたは動物園が好きですか。',reason:'最初の疑問文の like の後ろが、たずねている対象です。'},{prompt:'2. 最初に好きだと答えた2種類の動物を英語で答えなさい。',answer:'the panda and the monkey',evidence:'I like the panda and the monkey.',evidenceJp:'私はパンダとサルが好きです。',reason:'4文目で and を使って2種類の動物を並べています。'},{prompt:'3. そのあと、さらに好きだと言った動物は何ですか。英語で答えなさい。',answer:'the tiger',evidence:'I like the tiger, too.',evidenceJp:'トラも好きです。',reason:'too が「〜も」を表し、トラも好きだと追加しています。'},{prompt:'4. ウサギは好きですか。本文に合うように Yes / No で答えなさい。',answer:'Yes',evidence:'Do you like the rabbit? / Yes, I do.',evidenceJp:'ウサギは好きですか。／はい、好きです。',reason:'質問の直後に Yes, I do. と答えています。'}],
 allowedWords:[['zoo','Get Ready 5'],['panda','Get Ready 5'],['monkey','Get Ready 5'],['tiger','Get Ready 5'],['rabbit','Get Ready 5'],['bear','Get Ready 5'],['and','Get Ready 4 cumulative'],['the','Get Ready 4 cumulative'],['like','Get Ready 3 cumulative'],['what','Get Ready 3 cumulative'],['do','Get Ready 3 cumulative'],['you','Get Ready 3 cumulative'],['I','Get Ready 2 cumulative'],['too','Get Ready 2 cumulative'],['really','Get Ready 2 cumulative'],['great','Get Ready 2 cumulative'],['yes','elementary']],auditNote:'Get Ready 5 は名詞中心の単元なので、視覚動詞 see を持ち込まず、実登録の動物語彙と累積既習の質問表現だけで会話を構成。旧v9の see a panda 型は採用していない。',vocabAudit:true,manualSlashAudit:true,manualMeaningAudit:true,manualQuestionAudit:true
}
};
function releaseCheck(m){return m.sentences.length>=10&&m.slashRows.length===m.sentences.length&&m.vocabAudit&&m.manualSlashAudit&&m.manualMeaningAudit&&m.manualQuestionAudit;}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function current(){return PASSAGES[document.getElementById('section').value];}
function render(){const m=current(),released=releaseCheck(m);document.getElementById('gate').innerHTML=released?'<span class="badge">release:true</span> <span class="ok">品質ゲート通過</span>':'<span class="warn">release:false</span>';document.getElementById('passage').innerHTML=`<h2>${esc(m.title)}</h2><div class="meta">${m.id} / ${m.textbook} / 中${m.grade} / ${m.section} / ${m.level}</div><ol class="en">${m.sentences.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><h3>自然な全訳</h3><div>${esc(m.fullTranslation)}</div>`;document.getElementById('slash').innerHTML=`<h2>英文解釈</h2><div class="notice">単語置換ではなく、本文ごとに意味のまとまりを手作業で確定しています。</div>${m.slashRows.map(r=>`<div class="slash"><div class="enline">${esc(r.en)}</div><div class="jpline">${esc(r.jp)}</div></div>`).join('')}<h3>自然な全訳</h3><div>${esc(m.fullTranslation)}</div>`;document.getElementById('questions').innerHTML=`<h2>問題</h2>${m.questions.map(q=>`<div class="q">${esc(q.prompt)}</div>`).join('')}`;document.getElementById('answers').innerHTML=`<h2>解答・解説</h2>${m.questions.map(q=>`<div class="q"><strong>${esc(q.prompt)}</strong><div><b>答え：</b>${esc(q.answer)}</div><div class="evidence"><b>根拠英文：</b>${esc(q.evidence)}<br><b>根拠の意味：</b>${esc(q.evidenceJp)}<br><b>なぜ：</b>${esc(q.reason)}</div></div>`).join('')}`;document.getElementById('audit').innerHTML=`<h2>品質監査</h2><ul><li>文数：${m.sentences.length}（10文以上）</li><li>自動水増し：なし</li><li>自動スラッシュ生成：なし</li><li>月フィルタ：なし</li><li>語彙監査：${m.vocabAudit?'済':'未'}</li><li>意味・流れ監査：${m.manualMeaningAudit?'済':'未'}</li><li>スラッシュ監査：${m.manualSlashAudit?'済':'未'}</li><li>設問監査：${m.manualQuestionAudit?'済':'未'}</li></ul><div class="notice">${esc(m.auditNote)}</div><h3>使用語彙と出典区分</h3><div class="muted">${m.allowedWords.map(x=>`${esc(x[0])}［${esc(x[1])}］`).join(' / ')}</div>`;}
document.getElementById('section').addEventListener('change',render);document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tabpage').forEach(p=>p.classList.add('hidden'));document.getElementById(b.dataset.tab).classList.remove('hidden');}));render();
</script>
</body>
