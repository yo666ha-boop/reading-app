<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>長文読解問題作成アプリ v10 rebuild</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;margin:0;background:#f5f7fb;color:#1f2937}.wrap{max-width:980px;margin:0 auto;padding:18px}.panel{background:#fff;border:1px solid #d8dee9;border-radius:16px;padding:18px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap}select,button{padding:10px 12px;border-radius:10px;border:1px solid #cbd5e1;background:#fff}button{font-weight:700;cursor:pointer}.tabs button.active{background:#0f172a;color:#fff}.muted{color:#667085;font-size:13px;line-height:1.7}.ok{color:#166534;font-weight:800}.warn{color:#92400e;font-weight:800}.en{font-size:18px;line-height:1.9}.slash{padding:10px 0;border-bottom:1px dashed #e5e7eb}.slash .enline{font-weight:700}.slash .jpline{margin-top:4px;color:#374151}.q{padding:12px 0;border-bottom:1px solid #eef2f7}.evidence{background:#f8fafc;border-left:4px solid #94a3b8;padding:10px;margin-top:8px}.hidden{display:none}.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:800}.meta{font-size:13px;color:#475569;line-height:1.8}h1{font-size:24px;margin:0 0 8px}h2{font-size:20px;margin-top:0}.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px;line-height:1.7}.correction{background:#eef6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px;margin-top:8px;font-size:13px;line-height:1.7}.fail{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px;margin-top:8px;color:#991b1b;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<section class="panel">
<h1>長文読解問題作成アプリ v10 再構築</h1>
<div class="muted">GitHub再構築中。月フィルタなし。小学生既習語＋選択単元上限までの累積教科書語彙だけを既習扱いし、手作業監査済み本文だけを表示します。</div>
<div class="row" style="margin-top:12px">
<label>教科書 <select id="textbook"><option value="サンシャイン">サンシャイン</option><option value="ニューホライズン">ニューホライズン</option></select></label>
<label>学年 <select id="grade"><option value="1">中1</option></select></label>
<label>単元上限 <select id="section"></select></label>
</div>
<div id="gate" style="margin-top:12px"></div>
<div id="masterCount" class="muted" style="margin-top:8px"></div>
</section>
<section class="panel tabs row">
<button data-tab="passage" class="active">本文</button><button data-tab="slash">英文解釈</button><button data-tab="questions">問題</button><button data-tab="answers">解答・解説</button><button data-tab="audit">品質監査</button>
</section>
<section id="passage" class="panel tabpage"></section><section id="slash" class="panel tabpage hidden"></section><section id="questions" class="panel tabpage hidden"></section><section id="answers" class="panel tabpage hidden"></section><section id="audit" class="panel tabpage hidden"></section>
</div>
<script src="v10_vocab_corrections.js"></script>
<script src="v10_data_sunshine_g1.js"></script>
<script>window.V10_SUNSHINE_G1=window.V10_PASSAGES||{};</script>
<script src="v10_data_newhorizon_g1.js"></script>
<script src="v10_data_newhorizon_g1_unit1_2.js"></script>
<script src="v10_data_newhorizon_g1_unit1_3.js"></script>
<script src="v10_data_newhorizon_g1_unit2_1.js"></script>
<script src="v10_data_newhorizon_g1_unit2_2.js"></script>
<script src="v10_data_newhorizon_g1_unit2_3.js"></script>
<script src="v10_data_newhorizon_g1_unit3_1.js"></script>
<script src="v10_data_newhorizon_g1_unit3_2.js"></script>
<script src="v10_data_newhorizon_g1_unit4_3.js"></script>
<script src="v10_data_newhorizon_g1_unit5_1.js"></script>
<script src="v10_data_newhorizon_g1_unit5_2.js"></script>
<script src="v10_data_newhorizon_g1_unit5_3.js"></script>
<script src="v10_data_newhorizon_g1_unit6_1.js"></script>
<script src="v10_data_newhorizon_g1_unit7_1.js"></script>
<script src="v10_data_newhorizon_g1_unit8_1.js"></script>
<script>window.V10_NEWHORIZON_G1=window.V10_PASSAGES||{};</script>
<script>
const DATASETS={'サンシャイン':window.V10_SUNSHINE_G1||{},'ニューホライズン':window.V10_NEWHORIZON_G1||{}};
const VOCAB_CORRECTIONS=window.V10_VOCAB_CORRECTIONS||[];
function filled(v){return typeof v==='string'&&v.trim().length>0;}
function releaseProblems(m){
 const p=[];
 if(!m){p.push('本文マスターなし');return p;}
 if(!filled(m.id)||!filled(m.title)||!filled(m.fullTranslation))p.push('ID・タイトル・全訳の必須項目不足');
 if(!Array.isArray(m.sentences)||m.sentences.length<10)p.push('本文が10文未満');
 else if(m.sentences.some(s=>!filled(s)))p.push('空の本文文がある');
 if(!Array.isArray(m.slashRows)||!Array.isArray(m.sentences)||m.slashRows.length!==m.sentences.length)p.push('本文文数とスラッシュ行数が不一致');
 else if(m.slashRows.some(r=>!r||!filled(r.en)||!filled(r.jp)))p.push('スラッシュ英文または前から読む日本語が空');
 if(!Array.isArray(m.questions)||m.questions.length<3)p.push('設問が3問未満');
 else if(m.questions.some(q=>!q||!filled(q.prompt)||!filled(q.answer)||!filled(q.evidence)||!filled(q.evidenceJp)||!filled(q.reason)))p.push('設問の答え・根拠英文・根拠訳・理由のいずれかが欠落');
 if(!Array.isArray(m.allowedWords)||m.allowedWords.length===0)p.push('使用語彙監査台帳が空');
 if(!m.vocabAudit)p.push('語彙監査未完了');
 if(!m.manualSlashAudit)p.push('スラッシュ監査未完了');
 if(!m.manualMeaningAudit)p.push('本文意味・流れ監査未完了');
 if(!m.manualQuestionAudit)p.push('設問監査未完了');
 return p;
}
function releaseCheck(m){return releaseProblems(m).length===0;}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function passages(){return DATASETS[document.getElementById('textbook').value]||{};}
function correctionsFor(m){return VOCAB_CORRECTIONS.filter(x=>x.textbook===m.textbook&&String(x.grade)===String(m.grade)&&x.section===m.section);}
function initSections(){const p=passages(),s=document.getElementById('section'),old=s.value;s.innerHTML='';Object.keys(p).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);});if(old&&p[old])s.value=old;const total=Object.values(DATASETS).reduce((n,d)=>n+Object.keys(d).length,0);document.getElementById('masterCount').textContent=`この教科書の監修済みマスター候補：${Object.keys(p).length}本 / 現在合計：${total}本`;render();}
function current(){return passages()[document.getElementById('section').value];}
function render(){const m=current();if(!m){document.getElementById('gate').innerHTML='<span class="warn">本文マスターがありません</span>';['passage','slash','questions','answers','audit'].forEach(id=>document.getElementById(id).innerHTML='');return;}const problems=releaseProblems(m),released=problems.length===0,cor=correctionsFor(m);document.getElementById('gate').innerHTML=released?'<span class="badge">release:true</span> <span class="ok">品質ゲート通過</span>':'<span class="warn">release:false</span>';document.getElementById('passage').innerHTML=`<h2>${esc(m.title)}</h2><div class="meta">${esc(m.id)} / ${esc(m.textbook)} / 中${esc(m.grade)} / ${esc(m.section)} / ${esc(m.level)}</div><ol class="en">${m.sentences.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><h3>自然な全訳</h3><div>${esc(m.fullTranslation)}</div>`;document.getElementById('slash').innerHTML=`<h2>英文解釈</h2><div class="notice">単語置換ではなく、本文ごとに意味のまとまりを手作業で確定しています。</div>${m.slashRows.map(r=>`<div class="slash"><div class="enline">${esc(r.en)}</div><div class="jpline">${esc(r.jp)}</div></div>`).join('')}<h3>自然な全訳</h3><div>${esc(m.fullTranslation)}</div>`;document.getElementById('questions').innerHTML=`<h2>問題</h2>${m.questions.map(q=>`<div class="q">${esc(q.prompt)}</div>`).join('')}`;document.getElementById('answers').innerHTML=`<h2>解答・解説</h2>${m.questions.map(q=>`<div class="q"><strong>${esc(q.prompt)}</strong><div><b>答え：</b>${esc(q.answer)}</div><div class="evidence"><b>根拠英文：</b>${esc(q.evidence)}<br><b>根拠の意味：</b>${esc(q.evidenceJp)}<br><b>なぜ：</b>${esc(q.reason)}</div></div>`).join('')}`;document.getElementById('audit').innerHTML=`<h2>品質監査</h2><ul><li>文数：${m.sentences.length}（10文以上）</li><li>本文文数＝スラッシュ行数：${m.sentences.length===m.slashRows.length?'一致':'不一致'}</li><li>設問数：${m.questions.length}</li><li>設問5項目完全性：${m.questions.every(q=>filled(q.prompt)&&filled(q.answer)&&filled(q.evidence)&&filled(q.evidenceJp)&&filled(q.reason))?'OK':'NG'}</li><li>自動水増し：なし</li><li>自動スラッシュ生成：なし</li><li>月フィルタ：なし</li><li>語彙監査：${m.vocabAudit?'済':'未'}</li><li>意味・流れ監査：${m.manualMeaningAudit?'済':'未'}</li><li>スラッシュ監査：${m.manualSlashAudit?'済':'未'}</li><li>設問監査：${m.manualQuestionAudit?'済':'未'}</li><li>教科書確認済み語彙補正：${cor.length}件</li></ul>${problems.length?`<div class="fail"><b>releaseを止めている項目：</b><br>${problems.map(esc).join('<br>')}</div>`:'<div class="ok">自動releaseゲート検出：0件</div>'}<div class="notice" style="margin-top:10px">${esc(m.auditNote)}</div>${cor.map(x=>`<div class="correction"><b>${esc(x.english)}</b>：${esc(x.japanese)}<br>根拠：${esc(x.basis)}<br>扱い：${esc(x.rule)}</div>`).join('')}<h3>使用語彙と出典区分</h3><div class="muted">${m.allowedWords.map(x=>`${esc(x[0])}［${esc(x[1])}］`).join(' / ')}</div>`;}
document.getElementById('textbook').addEventListener('change',initSections);document.getElementById('section').addEventListener('change',render);document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tabpage').forEach(p=>p.classList.add('hidden'));document.getElementById(b.dataset.tab).classList.remove('hidden');}));initSections();
</script>
</body>
</html>
