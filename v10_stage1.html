<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>長文読解問題作成アプリ v10 rebuild</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;margin:0;background:#f5f7fb;color:#1f2937}.wrap{max-width:980px;margin:0 auto;padding:18px}.panel{background:#fff;border:1px solid #d8dee9;border-radius:16px;padding:18px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap}select,button{padding:10px 12px;border-radius:10px;border:1px solid #cbd5e1;background:#fff}button{font-weight:700;cursor:pointer}.tabs button.active{background:#0f172a;color:#fff}.muted{color:#667085;font-size:13px;line-height:1.7}.ok{color:#166534;font-weight:800}.warn{color:#92400e;font-weight:800}.en{font-size:18px;line-height:1.9}.slash{padding:10px 0;border-bottom:1px dashed #e5e7eb}.slash .enline{font-weight:700}.slash .jpline{margin-top:4px;color:#374151}.q{padding:12px 0;border-bottom:1px solid #eef2f7}.evidence{background:#f8fafc;border-left:4px solid #94a3b8;padding:10px;margin-top:8px}.hidden{display:none}.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:800}.meta{font-size:13px;color:#475569;line-height:1.8}h1{font-size:24px;margin:0 0 8px}h2{font-size:20px;margin-top:0}.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
<section class="panel">
<h1>長文読解問題作成アプリ v10 再構築</h1>
<div class="muted">GitHub再構築中。月フィルタなし。小学生既習語＋選択単元上限までの累積教科書語彙だけを既習扱いし、手作業監査済み本文だけを表示します。</div>
<div class="row" style="margin-top:12px">
<label>教科書 <select id="textbook"><option>サンシャイン</option></select></label>
<label>学年 <select id="grade"><option value="1">中1</option></select></label>
<label>単元上限 <select id="section"><option>Get Ready 2</option><option>Get Ready 3</option></select></label>
</div>
<div id="gate" style="margin-top:12px"></div>
</section>
<section class="panel tabs row">
<button data-tab="passage" class="active">本文</button>
<button data-tab="slash">英文解釈</button>
<button data-tab="questions">問題</button>
<button data-tab="answers">解答・解説</button>
<button data-tab="audit">品質監査</button>
</section>
<section id="passage" class="panel tabpage"></section>
<section id="slash" class="panel tabpage hidden"></section>
<section id="questions" class="panel tabpage hidden"></section>
<section id="answers" class="panel tabpage hidden"></section>
<section id="audit" class="panel tabpage hidden"></section>
</div>
<script>
const PASSAGES={
'Get Ready 2':{
 id:'V10-SUN-G1-GR2-001',textbook:'サンシャイン',grade:'1',section:'Get Ready 2',level:'HOP',title:'My English Book',
 sentences:['This is my English book.','Really?','Yes.','This is a dog.','I see.','This is a cat, too.','Great!','I write “dog” in my notebook.','I write “cat” in my notebook, too.','I can read “dog”.','I can read “cat”, too.','Great!'],
 fullTranslation:'「これは私の英語の本です。」「本当に？」「うん。」「これは犬です。」「なるほど。」「これはねこでもあります。」「すごい！」「私はノートに dog と書きます。」「cat もノートに書きます。」「私は dog を読むことができます。」「cat も読むことができます。」「すごい！」',
 slashRows:[
  {en:'This is / my English book.',jp:'これは〜です / 私の英語の本'},{en:'Really?',jp:'本当に？'},{en:'Yes.',jp:'うん。'},{en:'This is / a dog.',jp:'これは〜です / 犬'},{en:'I see.',jp:'なるほど。'},{en:'This is / a cat, too.',jp:'これは〜です / ねこでも'},{en:'Great!',jp:'すごい！'},{en:'I write “dog” / in my notebook.',jp:'私は「dog」と書きます / 私のノートに'},{en:'I write “cat” / in my notebook, too.',jp:'私は「cat」と書きます / 私のノートにも'},{en:'I can read / “dog”.',jp:'私は読むことができます / 「dog」を'},{en:'I can read / “cat”, too.',jp:'私は読むことができます / 「cat」も'},{en:'Great!',jp:'すごい！'}],
 questions:[
  {prompt:'1. 最初に見せているものは何ですか。本文から英語で答えなさい。',answer:'my English book',evidence:'This is my English book.',evidenceJp:'これは私の英語の本です。',reason:'最初の文で、見せているものをそのまま説明しています。'},
  {prompt:'2. 本の中で取り上げている動物を2つ、英語で答えなさい。',answer:'dog and cat',evidence:'This is a dog. / This is a cat, too.',evidenceJp:'これは犬です。／これはねこでもあります。',reason:'4文目と6文目に動物が1つずつ出ています。'},
  {prompt:'3. ノートに書いた英単語を2つ答えなさい。',answer:'dog and cat',evidence:'I write “dog” in my notebook. / I write “cat” in my notebook, too.',evidenceJp:'私はノートに dog と書きます。／cat もノートに書きます。',reason:'8文目と9文目が、ノートに書いた語を直接示しています。'},
  {prompt:'4. 「私」が読める2つの語を答えなさい。',answer:'dog and cat',evidence:'I can read “dog”. / I can read “cat”, too.',evidenceJp:'私は dog を読むことができます。／cat も読むことができます。',reason:'10文目と11文目で、can read の後ろに読める語が示されています。'}],
 allowedWords:[['I','Get Ready 2'],['great','Get Ready 2'],['too','Get Ready 2'],['really','Get Ready 2'],['I see.','Get Ready 2 phrase'],['this','elementary'],['is','elementary'],['my','elementary'],['English','elementary'],['book','elementary'],['yes','elementary'],['a','elementary'],['dog','elementary'],['cat','elementary'],['write','elementary'],['in','elementary'],['notebook','elementary'],['can','elementary'],['read','elementary']],
 auditNote:'Get Ready 2 の see は「わかる」の語義で登録されているため、視覚動詞 see a dog としては使用していない。I see. の会話表現だけを使用。',vocabAudit:true,manualSlashAudit:true,manualMeaningAudit:true,manualQuestionAudit:true
},
'Get Ready 3':{
 id:'V10-SUN-G1-GR3-001',textbook:'サンシャイン',grade:'1',section:'Get Ready 3',level:'HOP',title:'English at School',
 sentences:['What subject do you like?','I like English.','Really?','Yes.','Do you have your English book?','Yes, I do.','I have my English book.','Can you read English?','Yes, I can.','Great!','I like English, too.','Really?'],
 fullTranslation:'「あなたは何の教科が好きですか。」「私は英語が好きです。」「本当に？」「うん。」「あなたは自分の英語の本を持っていますか。」「はい、持っています。」「私は自分の英語の本を持っています。」「あなたは英語を読むことができますか。」「はい、できます。」「すごい！」「私も英語が好きです。」「本当に？」',
 slashRows:[
  {en:'What subject / do you like?',jp:'何の教科が / あなたは好きですか'},{en:'I like / English.',jp:'私は好きです / 英語が'},{en:'Really?',jp:'本当に？'},{en:'Yes.',jp:'うん。'},{en:'Do you have / your English book?',jp:'あなたは持っていますか / あなたの英語の本を'},{en:'Yes, / I do.',jp:'はい / 持っています'},{en:'I have / my English book.',jp:'私は持っています / 私の英語の本を'},{en:'Can you read / English?',jp:'あなたは読むことができますか / 英語を'},{en:'Yes, / I can.',jp:'はい / できます'},{en:'Great!',jp:'すごい！'},{en:'I like / English, too.',jp:'私も好きです / 英語が'},{en:'Really?',jp:'本当に？'}],
 questions:[
  {prompt:'1. 最初の人が好きな教科は何ですか。英語で答えなさい。',answer:'English',evidence:'I like English.',evidenceJp:'私は英語が好きです。',reason:'2文目が好きな教科を直接答えています。'},
  {prompt:'2. 英語の本を持っていますか。本文に合うように Yes / No で答えなさい。',answer:'Yes',evidence:'Do you have your English book? / Yes, I do.',evidenceJp:'あなたは英語の本を持っていますか。／はい、持っています。',reason:'質問の直後に Yes, I do. と答えているためです。'},
  {prompt:'3. 英語を読むことができますか。本文に合うように Yes / No で答えなさい。',answer:'Yes',evidence:'Can you read English? / Yes, I can.',evidenceJp:'あなたは英語を読むことができますか。／はい、できます。',reason:'Can you ...? に対して Yes, I can. と答えています。'},
  {prompt:'4. 2人に共通して好きなものは何ですか。英語で答えなさい。',answer:'English',evidence:'I like English. / I like English, too.',evidenceJp:'私は英語が好きです。／私も英語が好きです。',reason:'too が「〜も」を表し、2人とも英語が好きだと分かります。'}],
 allowedWords:[['what','Get Ready 3'],['subject','Get Ready 3'],['you','Get Ready 3'],['do','Get Ready 3'],['like','Get Ready 3'],['your','Get Ready 3'],['have','Get Ready 3'],['can','Get Ready 3'],['I','Get Ready 2 cumulative'],['really','Get Ready 2 cumulative'],['great','Get Ready 2 cumulative'],['too','Get Ready 2 cumulative'],['yes','elementary'],['English','elementary'],['book','elementary'],['my','elementary'],['read','elementary']],
 auditNote:'Get Ready 3 の追加語と Get Ready 2 までの累積語、小学生既習語だけで構成。自動的な活用形追加やサポート語の既習扱いは使用していない。',vocabAudit:true,manualSlashAudit:true,manualMeaningAudit:true,manualQuestionAudit:true
}
};
function releaseCheck(m){return m.sentences.length>=10&&m.slashRows.length===m.sentences.length&&m.vocabAudit&&m.manualSlashAudit&&m.manualMeaningAudit&&m.manualQuestionAudit;}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function current(){return PASSAGES[document.getElementById('section').value];}
function render(){const m=current(),released=releaseCheck(m);document.getElementById('gate').innerHTML=released?'<span class="badge">release:true</span> <span class="ok">品質ゲート通過</span>':'<span class="warn">release:false</span>';document.getElementById('passage').innerHTML=`<h2>${esc(m.title)}</h2><div class="meta">${m.id} / ${m.textbook} / 中${m.grade} / ${m.section} / ${m.level}</div><ol class="en">${m.sentences.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><h3>自然な全訳</h3><div>${esc(m.fullTranslation)}</div>`;document.getElementById('slash').innerHTML=`<h2>英文解釈</h2><div class="notice">単語置換ではなく、本文ごとに意味のまとまりを手作業で確定しています。</div>${m.slashRows.map(r=>`<div class="slash"><div class="enline">${esc(r.en)}</div><div class="jpline">${esc(r.jp)}</div></div>`).join('')}<h3>自然な全訳</h3><div>${esc(m.fullTranslation)}</div>`;document.getElementById('questions').innerHTML=`<h2>問題</h2>${m.questions.map(q=>`<div class="q">${esc(q.prompt)}</div>`).join('')}`;document.getElementById('answers').innerHTML=`<h2>解答・解説</h2>${m.questions.map(q=>`<div class="q"><strong>${esc(q.prompt)}</strong><div><b>答え：</b>${esc(q.answer)}</div><div class="evidence"><b>根拠英文：</b>${esc(q.evidence)}<br><b>根拠の意味：</b>${esc(q.evidenceJp)}<br><b>なぜ：</b>${esc(q.reason)}</div></div>`).join('')}`;document.getElementById('audit').innerHTML=`<h2>品質監査</h2><ul><li>文数：${m.sentences.length}（10文以上）</li><li>自動水増し：なし</li><li>自動スラッシュ生成：なし</li><li>月フィルタ：なし</li><li>語彙監査：${m.vocabAudit?'済':'未'}</li><li>意味・流れ監査：${m.manualMeaningAudit?'済':'未'}</li><li>スラッシュ監査：${m.manualSlashAudit?'済':'未'}</li><li>設問監査：${m.manualQuestionAudit?'済':'未'}</li></ul><div class="notice">${esc(m.auditNote)}</div><h3>使用語彙と出典区分</h3><div class="muted">${m.allowedWords.map(x=>`${esc(x[0])}［${esc(x[1])}］`).join(' / ')}</div>`;}
document.getElementById('section').addEventListener('change',render);document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tabpage').forEach(p=>p.classList.add('hidden'));document.getElementById(b.dataset.tab).classList.remove('hidden');}));render();
</script>
</body>
</html>
