<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>長文読解問題作成アプリ v10 rebuild stage1</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;margin:0;background:#f5f7fb;color:#1f2937}.wrap{max-width:980px;margin:0 auto;padding:18px}.panel{background:#fff;border:1px solid #d8dee9;border-radius:16px;padding:18px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap}select,button{padding:10px 12px;border-radius:10px;border:1px solid #cbd5e1;background:#fff}button{font-weight:700;cursor:pointer}.tabs button.active{background:#0f172a;color:#fff}.muted{color:#667085;font-size:13px;line-height:1.7}.ok{color:#166534;font-weight:800}.warn{color:#92400e;font-weight:800}.en{font-size:18px;line-height:1.9}.slash{padding:10px 0;border-bottom:1px dashed #e5e7eb}.slash .enline{font-weight:700}.slash .jpline{margin-top:4px;color:#374151}.q{padding:12px 0;border-bottom:1px solid #eef2f7}.evidence{background:#f8fafc;border-left:4px solid #94a3b8;padding:10px;margin-top:8px}.hidden{display:none}.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:800}.meta{font-size:13px;color:#475569;line-height:1.8}h1{font-size:24px;margin:0 0 8px}h2{font-size:20px;margin-top:0}.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
<section class="panel">
<h1>長文読解問題作成アプリ v10 再構築</h1>
<div class="muted">GitHub再構築用 stage1。月フィルタなし。小学生既習語＋選択単元上限までの教科書語彙だけを既習扱いし、手作業監査済み本文だけを表示します。</div>
<div class="row" style="margin-top:12px">
<label>教科書 <select id="textbook"><option>サンシャイン</option></select></label>
<label>学年 <select id="grade"><option value="1">中1</option></select></label>
<label>単元上限 <select id="section"><option>Get Ready 2</option></select></label>
</div>
<div id="gate" style="margin-top:12px"></div>
</section>
<section class="panel tabs row">
<button data-tab="passage" class="active">本文</button>
<button data-tab="slash">英文解釈</button>
<button data-tab="questions">問題</button>
<button data-tab="answers">解答・解説</button>
<button data-tab="audit">品質監査</button>
</section>
<section id="passage" class="panel tabpage"></section>
<section id="slash" class="panel tabpage hidden"></section>
<section id="questions" class="panel tabpage hidden"></section>
<section id="answers" class="panel tabpage hidden"></section>
<section id="audit" class="panel tabpage hidden"></section>
</div>
<script>
const MASTER={
 id:'V10-SUN-G1-GR2-001', textbook:'サンシャイン', grade:'1', section:'Get Ready 2', level:'HOP',
 title:'My English Book',
 sentences:[
  'This is my English book.',
  'Really?',
  'Yes.',
  'This is a dog.',
  'I see.',
  'This is a cat, too.',
  'Great!',
  'I write “dog” in my notebook.',
  'I write “cat” in my notebook, too.',
  'I can read “dog”.',
  'I can read “cat”, too.',
  'Great!'
 ],
 fullTranslation:'「これは私の英語の本です。」「本当に？」「うん。」「これは犬です。」「なるほど。」「これはねこでもあります。」「すごい！」「私はノートに dog と書きます。」「cat もノートに書きます。」「私は dog を読むことができます。」「cat も読むことができます。」「すごい！」',
 slashRows:[
  {en:'This is / my English book.',jp:'これは〜です / 私の英語の本'},
  {en:'Really?',jp:'本当に？'},
  {en:'Yes.',jp:'うん。'},
  {en:'This is / a dog.',jp:'これは〜です / 犬'},
  {en:'I see.',jp:'なるほど。'},
  {en:'This is / a cat, too.',jp:'これは〜です / ねこでも'},
  {en:'Great!',jp:'すごい！'},
  {en:'I write “dog” / in my notebook.',jp:'私は「dog」と書きます / 私のノートに'},
  {en:'I write “cat” / in my notebook, too.',jp:'私は「cat」と書きます / 私のノートにも'},
  {en:'I can read / “dog”.',jp:'私は読むことができます / 「dog」を'},
  {en:'I can read / “cat”, too.',jp:'私は読むことができます / 「cat」も'},
  {en:'Great!',jp:'すごい！'}
 ],
 questions:[
  {prompt:'1. 最初に見せているものは何ですか。本文から英語で答えなさい。',answer:'my English book',evidence:'This is my English book.',evidenceJp:'これは私の英語の本です。',reason:'最初の文で、見せているものをそのまま説明しています。'},
  {prompt:'2. 本の中で取り上げている動物を2つ、英語で答えなさい。',answer:'dog and cat',evidence:'This is a dog. / This is a cat, too.',evidenceJp:'これは犬です。／これはねこでもあります。',reason:'4文目と6文目に動物が1つずつ出ています。'},
  {prompt:'3. ノートに書いた英単語を2つ答えなさい。',answer:'dog and cat',evidence:'I write “dog” in my notebook. / I write “cat” in my notebook, too.',evidenceJp:'私はノートに dog と書きます。／cat もノートに書きます。',reason:'8文目と9文目が、ノートに書いた語を直接示しています。'},
  {prompt:'4. 「私」が読める2つの語を答えなさい。',answer:'dog and cat',evidence:'I can read “dog”. / I can read “cat”, too.',evidenceJp:'私は dog を読むことができます。／cat も読むことができます。',reason:'10文目と11文目で、can read の後ろに読める語が示されています。'}
 ],
 allowedWords:[
  {word:'I',source:'Get Ready 2'},
  {word:'great',source:'Get Ready 2'},
  {word:'too',source:'Get Ready 2'},
  {word:'really',source:'Get Ready 2'},
  {word:'I see.',source:'Get Ready 2 phrase'},
  {word:'this',source:'elementary'},
  {word:'is',source:'elementary'},
  {word:'my',source:'elementary'},
  {word:'English',source:'elementary'},
  {word:'book',source:'elementary'},
  {word:'yes',source:'elementary'},
  {word:'a',source:'elementary'},
  {word:'dog',source:'elementary'},
  {word:'cat',source:'elementary'},
  {word:'write',source:'elementary'},
  {word:'in',source:'elementary'},
  {word:'notebook',source:'elementary'},
  {word:'can',source:'elementary'},
  {word:'read',source:'elementary'}
 ],
 vocabAudit:true, manualSlashAudit:true, manualMeaningAudit:true, manualQuestionAudit:true,
 auditNote:'Get Ready 2 の see は「わかる」の語義で登録されているため、視覚動詞 see a dog としては使用していない。I see. の会話表現だけを使用。'
};
function releaseCheck(m){return m.sentences.length>=10 && m.slashRows.length===m.sentences.length && m.vocabAudit && m.manualSlashAudit && m.manualMeaningAudit && m.manualQuestionAudit;}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function render(){
 const released=releaseCheck(MASTER);
 document.getElementById('gate').innerHTML=released?'<span class="badge">release:true</span> <span class="ok">品質ゲート通過</span>':'<span class="warn">release:false</span>';
 document.getElementById('passage').innerHTML=`<h2>${esc(MASTER.title)}</h2><div class="meta">${MASTER.id} / ${MASTER.textbook} / 中${MASTER.grade} / ${MASTER.section} / ${MASTER.level}</div><ol class="en">${MASTER.sentences.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><h3>自然な全訳</h3><div>${esc(MASTER.fullTranslation)}</div>`;
 document.getElementById('slash').innerHTML=`<h2>英文解釈</h2><div class="notice">単語置換ではなく、本文ごとに意味のまとまりを手作業で確定しています。</div>${MASTER.slashRows.map(r=>`<div class="slash"><div class="enline">${esc(r.en)}</div><div class="jpline">${esc(r.jp)}</div></div>`).join('')}<h3>自然な全訳</h3><div>${esc(MASTER.fullTranslation)}</div>`;
 document.getElementById('questions').innerHTML=`<h2>問題</h2>${MASTER.questions.map(q=>`<div class="q">${esc(q.prompt)}</div>`).join('')}`;
 document.getElementById('answers').innerHTML=`<h2>解答・解説</h2>${MASTER.questions.map(q=>`<div class="q"><strong>${esc(q.prompt)}</strong><div><b>答え：</b>${esc(q.answer)}</div><div class="evidence"><b>根拠英文：</b>${esc(q.evidence)}<br><b>根拠の意味：</b>${esc(q.evidenceJp)}<br><b>なぜ：</b>${esc(q.reason)}</div></div>`).join('')}`;
 document.getElementById('audit').innerHTML=`<h2>品質監査</h2><ul><li>文数：${MASTER.sentences.length}（10文以上）</li><li>自動水増し：なし</li><li>自動スラッシュ生成：なし</li><li>月フィルタ：なし</li><li>語彙監査：${MASTER.vocabAudit?'済':'未'}</li><li>意味・流れ監査：${MASTER.manualMeaningAudit?'済':'未'}</li><li>スラッシュ監査：${MASTER.manualSlashAudit?'済':'未'}</li><li>設問監査：${MASTER.manualQuestionAudit?'済':'未'}</li></ul><div class="notice">${esc(MASTER.auditNote)}</div><h3>使用語彙と出典区分</h3><div class="muted">${MASTER.allowedWords.map(x=>`${esc(x.word)}［${esc(x.source)}］`).join(' / ')}</div><div class="muted" style="margin-top:12px">このstage1はGet Ready 2のみ。Get Ready 3以降は監査完了後に順次追加します。</div>`;
}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tabpage').forEach(p=>p.classList.add('hidden'));document.getElementById(b.dataset.tab).classList.remove('hidden');}));
render();
</script>
</body>
</html>
